name: Desktop Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

# Ensure only one build workflow runs at a time for the same reference
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Java runtime bundled in every package. Pinned, so that the source code
  # the "sources" job attaches (OpenJDK17U-jdk-sources_<version>) is exactly the
  # one of the runtime shipped.
  TEMURIN_VERSION: '17.0.20+8'
  # AppImage tooling, pinned with SHA-256: appimagetool, and the runtime it puts
  # at the start of every .AppImage (its source goes in the "sources" archive).
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_SHA256_X86_64: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGETOOL_SHA256_AARCH64: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
  APPIMAGE_RUNTIME_VERSION: '20251108'
  APPIMAGE_RUNTIME_SHA256_X86_64: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  APPIMAGE_RUNTIME_SHA256_AARCH64: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

jobs:
  # Compile and package the desktop applications across OS platforms
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    # Minimal token permissions for the job. Everything not defined here is dropped
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Java 17 (Eclipse Temurin, exact version): jpackage bundles it in the packages
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.TEMURIN_VERSION }}

      # The licence notes shipped in the app need every licence text: stop here
      # rather than package an app without them (scripts/fetch-missing-license-texts.sh).
      - name: Check third-party licence texts
        shell: bash
        run: |
          set -e
          L=src/main/resources/licenses
          test -s src/main/resources/third_party_licenses.txt
          test -s "$L/SOURCES.txt"
          test -n "$(ls -A "$L/dng-sdk" 2>/dev/null)" || { echo "::error::$L/dng-sdk is missing: run scripts/fetch-missing-license-texts.sh and commit the result"; exit 1; }
          grep -q 'opencore-amr-0.1.6.tar.gz' "$L/SOURCES.txt" || { echo "::error::OpenCORE AMR licence files not checked against the upstream tarball: run scripts/fetch-missing-license-texts.sh and commit the result"; exit 1; }

      # Establish isolated Gradle build environment with security validation
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true # Verifies integrity of the wrapper file to prevent malicious dependency injection
          cache-provider: basic   # Abides by standard open-source caching rules
          # Prevents cache poisoning if workflow ever runs on external/forked PR contexts
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Native audio engine is built from source via CMake; ensure a toolchain on Linux
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      # Windows: nessun installer, solo l'app impacchettata. Le altre piattaforme
      # producono anche i formati nativi (dmg / deb / rpm).
      - name: Build Packages (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew createReleaseDistributable packagePortableArchives

      - name: Build Packages (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew createReleaseDistributable packageDistributionForCurrentOS packagePortableArchives

      # Build a portable AppImage from the unpacked distributable (Linux only)
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          export APPIMAGE_EXTRACT_AND_RUN=1
          APP_VER="$(cat build/display-version.txt 2>/dev/null || true)"
          if [ -z "$APP_VER" ]; then APP_VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$APP_VER" ]; then APP_VER="dev"; fi
          OUT="build/packages"; mkdir -p "$OUT"
          APPDIR="$RUNNER_TEMP/AppDir"; rm -rf "$APPDIR"; mkdir -p "$APPDIR"

          # Copy the unpacked app (folder name resolved dynamically)
          APP_SRC="$(find build/compose/binaries/main-release/app -maxdepth 1 -mindepth 1 -type d | head -n1)"
          cp -r "$APP_SRC/." "$APPDIR/"
          LAUNCHER_NAME="$(ls "$APPDIR/bin" | head -n1)"

          # Icon
          cp src/main/resources/app_icon.png "$APPDIR/wifi-audio-streaming.png"
          cp src/main/resources/app_icon.png "$APPDIR/.DirIcon"

          # Desktop entry
          cat > "$APPDIR/wifi-audio-streaming.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=WiFi Audio Streaming
          Exec=AppRun
          Icon=wifi-audio-streaming
          Categories=AudioVideo;
          Terminal=false
          EOF

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/bin/$LAUNCHER_NAME" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Pick appimagetool and the AppImage runtime for the runner architecture,
          # both pinned and checked (the runtime ends up inside every .AppImage)
          case "$(uname -m)" in
            aarch64|arm64) AITARCH=aarch64; AIT_SHA="$APPIMAGETOOL_SHA256_AARCH64"; RT_SHA="$APPIMAGE_RUNTIME_SHA256_AARCH64" ;;
            *) AITARCH=x86_64; AIT_SHA="$APPIMAGETOOL_SHA256_X86_64"; RT_SHA="$APPIMAGE_RUNTIME_SHA256_X86_64" ;;
          esac
          curl -fL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${AITARCH}.AppImage"
          echo "${AIT_SHA}  appimagetool" | sha256sum -c -
          curl -fL -o appimage-runtime "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${AITARCH}"
          echo "${RT_SHA}  appimage-runtime" | sha256sum -c -
          chmod +x appimagetool
          ARCH=$AITARCH ./appimagetool --runtime-file appimage-runtime "$APPDIR" "$OUT/WiFi-Audio-Streaming-${APP_VER}-linux-${AITARCH}.AppImage"

      - name: Rename dmg per architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP_VER="$(cat build/display-version.txt 2>/dev/null || true)"
          if [ -z "$APP_VER" ]; then APP_VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$APP_VER" ]; then APP_VER="dev"; fi
          case "$(uname -m)" in
            arm64|aarch64) MACARCH=arm64 ;;
            *) MACARCH=x64 ;;
          esac
          DMG_DIR="build/compose/binaries/main/dmg"
          for f in "$DMG_DIR"/*.dmg; do
            [ -e "$f" ] || continue
            mv "$f" "$DMG_DIR/WiFi-Audio-Streaming-${APP_VER}-macos-${MACARCH}.dmg"
          done
          ls -la "$DMG_DIR"

      # Upload built binaries as artifacts for later use in the release job
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
            build/compose/binaries/main/dmg/*.dmg
            build/packages/*.zip
            build/packages/*.tar.gz
            build/packages/*.AppImage
          retention-days: 30
          if-no-files-found: ignore # Matrix platforms only compile their relative target outputs

  # Source code of the third-party components in the packages (FFmpeg and its
  # libraries, the Java runtime, the AppImage runtime): their licences ask to
  # keep it available next to the binaries. Independent of the build above.
  sources:
    name: Pack third-party sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Pack the sources
        shell: bash
        run: |
          set -e
          name="wifi-audio-streaming-${GITHUB_REF_NAME}-third-party-sources.tar"
          bash scripts/package-third-party-sources.sh "$RUNNER_TEMP/$name"
          mkdir -p sources-out
          mv "$RUNNER_TEMP/$name" "sources-out/$name"

      - name: Upload the source archive
        uses: actions/upload-artifact@v6
        with:
          name: third-party-sources
          path: sources-out/*.tar
          retention-days: 30
          if-no-files-found: error

  # Download assets, make draft release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sources]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}

    # Explicitly granted scopes required for secure artifact attestation and drafting releases
    permissions:
      contents: write         # Required to construct releases and append assets
      id-token: write         # Required to map OIDC identity tokens for provenance signatures
      attestations: write     # Required to attach the final build provenance claims

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Aggregate the outputs from every matrix configuration into one directory
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release-assets
          pattern: desktop-artifacts-*
          merge-multiple: true

      # The third-party source archive goes in the same release as the packages
      - name: Download the Third-Party Source Archive
        uses: actions/download-artifact@v7
        with:
          name: third-party-sources
          path: ./release-assets

      # Generates Sigstore-backed build certificates asserting where and how your desktop binaries were built
      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ./release-assets/**/*.deb
            ./release-assets/**/*.rpm
            ./release-assets/**/*.dmg
            ./release-assets/**/*.zip
            ./release-assets/**/*.tar.gz
            ./release-assets/**/*.AppImage
            ./release-assets/**/*-third-party-sources.tar

      # Create Draft release
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          # Turn on recursive globbing for this shell execution
          shopt -s globstar

          gh release create "${RELEASE_VERSION}" \
            --draft \
            --title "Desktop Release ${RELEASE_VERSION}" \
            --generate-notes \
            ./release-assets/**/*.*
