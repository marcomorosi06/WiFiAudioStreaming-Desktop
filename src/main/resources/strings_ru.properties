auto_start_encryption_title=Автозапуск шифрования
auto_start_encryption_desc=Зашифруйте звук автоматически запускаемого сервера. Отдельно от общей настройки, поскольку они служат разным моментам: посещаемый сеанс может оставаться открытым для проверки, тогда как сеанс, который запускается сам по себе и длится часами, стоит зашифровать.
