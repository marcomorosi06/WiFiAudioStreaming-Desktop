auto_start_delay_desc=Секунды ожидания перед запуском сервера. При входе в систему сеть часто еще не готова, и сервер, который запускается без адреса, никто не находит.
auto_start_network_title=Подождите сети
auto_start_network_desc=Удерживайте автозапуск до тех пор, пока машина не получит пригодный для использования локальный адрес, в течение одной минуты.
auto_start_volume_title=Начальный том
auto_start_volume_desc=Громкость применяется при автоматическом запуске сервера. Оставьте, чтобы сохранить текущий.
