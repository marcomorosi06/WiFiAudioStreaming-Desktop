native_engine_desc=Используйте собственный звуковой движок C (рекомендуется). В Linux: PulseAudio/PipeWire через dlopen, автоматически отключает звук динамиков. Отключите, чтобы вернуться к устаревшему грабберу FFmpeg.
mute_render_title=Отключение динамиков во время потоковой передачи
mute_render_desc=Отключите локальное воспроизведение, пока его захватывает сервер, чтобы звук не слышался дважды. Выключите его, чтобы слышать его и здесь, и на клиенте. Только родной двигатель; предыдущее состояние восстанавливается при остановке сервера. CLI: --no-mute-render.
server_persist_title=Поддерживать работу сервера после отключения
server_persist_desc=При одноадресной передаче сеанс завершает уход клиента, а не сервера: он оставляет порт открытым и ждет следующего клиента. Мультикаст уже работает таким образом.
