vcable_help_button=Нужна помощь в настройке?
vcable_help_win_title=Windows — Настройка VB-CABLE
vcable_help_win_1=Перейдите на vb-audio.com/Cable и загрузите VB-CABLE.
vcable_help_win_2=Запустите установщик от имени администратора, затем перезагрузите компьютер.
vcable_help_win_3=После перезапуска в раскрывающемся списке выше появится «CABLE Input» — выберите его.
vcable_help_win_4=В Discord, Zoom или любом другом приложении перейдите в «Настройки звука» и выберите «CABLE Output» в качестве микрофона.
vcable_help_win_5=Готово! Потоковое аудио теперь будет отображаться в качестве вашего микрофона в этих приложениях.
vcable_help_win_link=Откройте vb-audio.com/Cable
vcable_help_linux_title=Linux — автоматический виртуальный приемник
vcable_help_linux_1=Никакой установки не требуется. Когда начинается потоковая передача, виртуальный приемник под названием «WFAS_VirtualMic» создается автоматически с помощью pactl.
vcable_help_linux_2=Откройте pavucontrol (регулятор громкости PulseAudio) или эквивалент PipeWire.
vcable_help_linux_3=Во вкладке «Запись» установите Discord/Zoom/и т.д. для захвата с «WFAS_VirtualMic».
vcable_help_linux_4=Потоковое аудио теперь будет отображаться в этих приложениях в виде микрофона.
