welcome_privacy_detail=GitHub — американская компания, принадлежащая Microsoft. Каждый запрос обязательно раскрывает им ваш IP-адрес, а также время запроса. Больше ничего не отправляется: ни учетной записи, ни идентификатора, ни данных об использовании. Отключите эту функцию, и приложение никогда не будет подключаться к сети самостоятельно. Вы все равно можете в любое время проверить это вручную в настройках.
