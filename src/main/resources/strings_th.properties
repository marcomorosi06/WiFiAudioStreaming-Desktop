welcome_title=Welcome to WiFi Audio Streaming!
welcome_thanks=Thanks for installing the app. Here's everything you need to get started.
welcome_android_title=Get the Android App
welcome_android_body=Install the companion Android app to receive audio on your phone or tablet. Free and open source.
welcome_android_btn=Download on GitHub
welcome_cli_title=Use it from the Terminal
welcome_cli_body=คุณสามารถควบคุมแอปจากเทอร์มินัลใดก็ได้ด้วยคำสั่ง wfas คลิกด้านล่างเพื่อเพิ่มลงใน PATH ของคุณทันที\n___XYZ_แยก___\nเพิ่ม wfas ใน PATH\n___XYZ_แยก___\nเริ่มต้นเลย\n___XYZ_แยก___\nขอบคุณสำหรับการติดตั้ง!\n___XYZ_แยก___\nเคล็ดลับ: เพิ่ม wfas ใน PATH ของคุณเพื่อการเข้าถึงที่รวดเร็ว\n___XYZ_แยก___\nเรียกใช้แอป GUI > การตั้งค่า > คำสั่ง CLI > ติดตั้ง\n___XYZ_แยก___\nคำสั่ง CLI (wfas)\n___XYZ_แยก___\nติดตั้ง wfas ใน PATH\n___XYZ_แยก___\nเพิ่มคำสั่ง wfas ให้กับ PATH ระบบของคุณ เพื่อให้คุณสามารถเรียกใช้จากเทอร์มินัลใดก็ได้ เรียกใช้อีกครั้งหากคุณย้ายแอปเพื่ออัปเดตเส้นทาง\n___XYZ_แยก___\nwfas ได้รับการติดตั้งและเป็นปัจจุบันแล้ว\n___XYZ_แยก___\nไม่ได้ติดตั้ง\n___XYZ_แยก___\nติดตั้ง\n___XYZ_แยก___\nอัปเดตเส้นทาง\n___XYZ_แยก___\nติดตั้งแล้ว\n___XYZ_แยก___\nคำสั่ง wfas พร้อมใช้งานแล้วใน PATH ของคุณ เปิดเทอร์มินัลใหม่เพื่อใช้งาน\n___XYZ_แยก___\nเปิดเทอร์มินัลแล้ว\n___XYZ_แยก___\nหน้าต่างเทอร์มินัลถูกเปิดขึ้นเพื่อทำการติดตั้งให้เสร็จสิ้นด้วยสิทธิ์ของผู้ดูแลระบบ เมื่อปิดแล้ว ให้เปิดเทอร์มินัลใหม่และเรียกใช้: wfas --help\n___XYZ_แยก___\nการติดตั้งล้มเหลว\n___XYZ_แยก___\nแสดงหน้าจอต้อนรับ\n___XYZ_แยก___\nรีเซ็ตการตั้งค่าทั้งหมด\n___XYZ_แยก___\nคืนค่าการตั้งค่าทั้งหมดเป็นค่าเริ่มต้นการติดตั้ง\n___XYZ_แยก___\nรีเซ็ตการตั้งค่าทั้งหมดใช่ไหม\n___XYZ_แยก___\nการดำเนินการนี้จะคืนค่าการตั้งค่าทั้งหมดกลับเป็นค่าเริ่มต้น การดำเนินการนี้ไม่สามารถยกเลิกได้\n___XYZ_แยก___\nรีเซ็ต\n___XYZ_แยก___\nไฟร์วอลล์
