vcable_help_button=Need help setting this up?
vcable_help_win_title=Windows — VB-CABLE Setup
vcable_help_win_1=Go to vb-audio.com/Cable and download VB-CABLE.
vcable_help_win_2=Run the installer as Administrator, then restart your PC.
vcable_help_win_3=After restarting, "CABLE Input" will appear in the dropdown above — select it.
vcable_help_win_4=In Discord, Zoom or any other app, go to Audio Settings and choose "CABLE Output" as the microphone.
vcable_help_win_5=Done! The streamed audio will now appear as your microphone in those apps.
vcable_help_win_link=Open vb-audio.com/Cable
vcable_help_linux_title=Linux — Automatic Virtual Sink
vcable_help_linux_1=No installation needed. When streaming starts, a virtual sink called "WFAS_VirtualMic" is created automatically via pactl.
vcable_help_linux_2=Open pavucontrol (PulseAudio Volume Control) or a PipeWire equivalent.
vcable_help_linux_3=In the "Recording" tab, set Discord/Zoom/etc. to capture from "WFAS_VirtualMic".
vcable_help_linux_4=เสียงที่สตรีมจะปรากฏเป็นไมโครโฟนในแอปเหล่านั้น\n___XYZ_แยก___\nติดตั้ง PavuControl\n___XYZ_แยก___\nmacOS — การตั้งค่า BlackHole\n___XYZ_แยก___\nดาวน์โหลด BlackHole (โอเพ่นซอร์สฟรี) จาก github.com/ExistentialAudio/BlackHole\n___XYZ_แยก___\nติดตั้งตามคำแนะนำบนหน้าจอ ไม่จำเป็นต้องรีสตาร์ท\n___XYZ_แยก___\nเลือก "BlackHole 2ch" (หรือ 16ch) จากเมนูแบบเลื่อนลงด้านบน\n___XYZ_แยก___\nในการตั้งค่าระบบ → เสียง คุณสามารถเลือกสร้างอุปกรณ์มัลติเอาท์พุตเพื่อฟังเสียงและกำหนดเส้นทางพร้อมกันได้\n___XYZ_แยก___\nใน Discord, Zoom หรือแอปอื่นๆ ให้เลือก "BlackHole 2ch" เป็นไมโครโฟน\n___XYZ_แยก___\nเปิด BlackHole บน GitHub\n___XYZ_แยก___\nเริ่มย่อเล็กสุดไปที่ถาด\n___XYZ_แยก___\nเปิดแอปที่ซ่อนอยู่ในถาดระบบ เมื่อรวมกับ Launch at Startup มันจะทำงานเหมือนกับ AirPlay/Chromecast: พร้อมใช้งานเสมอ ไม่ขวางทางคุณ\n___XYZ_แยก___\nใกล้กับถาด\n___XYZ_แยก___\nเมื่อคุณปิดหน้าต่าง ให้ย่อขนาดไปที่ถาดระบบแทนที่จะออก คลิกขวาที่ไอคอนถาดเพื่อออกให้ดี\n___XYZ_แยก___\nแสดงหน้าต่าง\n___XYZ_แยก___\nซ่อนไปที่ถาด\n___XYZ_แยก___\nเลิก\n___XYZ_แยก___\nทำงานในพื้นหลัง คลิกขวาที่ไอคอนถาดเพื่อออก\n___XYZ_แยก___\nใช้ไอคอนสีเข้ม (แผงไฟ)\n___XYZ_แยก___\nใช้ไอคอนแสง (แผงสีเข้ม)\n___XYZ_แยก___\nยินดีต้อนรับสู่การสตรีมเสียง WiFi!\n___XYZ_แยก___\nขอบคุณสำหรับการติดตั้งแอป นี่คือทุกสิ่งที่คุณต้องการเพื่อเริ่มต้น\n___XYZ_แยก___\nรับแอพ Android\n___XYZ_แยก___\nติดตั้งแอป Android ที่ใช้ร่วมกันเพื่อรับเสียงบนโทรศัพท์หรือแท็บเล็ตของคุณ ฟรีและโอเพ่นซอร์ส\n___XYZ_แยก___\nดาวน์โหลดบน GitHub\n___XYZ_แยก___\nใช้มันจาก Terminal
