tray_unavailable_desc=ไม่สามารถซ่อนหน้าต่างไว้ในถาดได้ ดังนั้นการปิดหน้าต่างจะเป็นการออกจากแอป\n___XYZ_แยก___\nเริ่มการเข้ารหัสอัตโนมัติ\n___XYZ_แยก___\nเข้ารหัสเสียงของเซิร์ฟเวอร์ที่เริ่มทำงานโดยอัตโนมัติ แยกจากการตั้งค่าทั่วไป เนื่องจากทั้งสองให้บริการในช่วงเวลาที่แตกต่างกัน: เซสชันที่เข้าร่วมสามารถอยู่ในที่โล่งสำหรับการตรวจสอบ ในขณะที่เซสชันที่เริ่มต้นเองและทำงานนานหลายชั่วโมงก็คุ้มค่ากับการเข้ารหัส\n___XYZ_แยก___\nเข้ารหัสแล้ว\n___XYZ_แยก___\nไม่ได้เข้ารหัส\n___XYZ_แยก___\nสืบทอดในปัจจุบันหมายถึงการเข้ารหัส\n___XYZ_แยก___\nสืบทอดในปัจจุบันหมายความว่าไม่ได้เข้ารหัส\n___XYZ_แยก___\nไม่จับ\n___XYZ_แยก___\nไมโครโฟน\n___XYZ_แยก___\nระบบเสียง\n___XYZ_แยก___\nไมโครโฟนและระบบเสียง\n___XYZ_แยก___\nเอาต์พุตของระบบ (ลูปแบ็ค)\n___XYZ_แยก___\nปะปนอยู่ในกระแสน้ำ\n___XYZ_แยก___\nListener บนพอร์ต XYZPH0XYZ\n___XYZ_แยก___\nกำลังจับเลย\n___XYZ_แยก___\nเปิดบันทึกการจับภาพ\n___XYZ_แยก___\nรีเซ็ตระดับเสียงเป็น 100%\n___XYZ_แยก___\nเกิน 100% คือกำไรทางดิจิทัล: คลิปข้อความที่ดัง
