mode=โหมด\n___XYZ_แยก___\nรับ (ลูกค้า)\n___XYZ_แยก___\nส่ง (เซิร์ฟเวอร์)\n___XYZ_แยก___\nการกำหนดค่าเซิร์ฟเวอร์\n___XYZ_แยก___\nแหล่งกำเนิดเสียงหลัก (อินพุต)\n___XYZ_แยก___\nเอาต์พุตไมโครโฟนที่ได้รับ (เช่น สายเคเบิลเสมือน)\n___XYZ_แยก___\nโหมดมัลติคาสต์\n___XYZ_แยก___\nส่งไปยังลูกค้าหลายรายพร้อมกัน\n___XYZ_แยก___\nการกำหนดค่าไคลเอ็นต์\n___XYZ_แยก___\nอุปกรณ์ส่งสัญญาณเสียง\n___XYZ_แยก___\nแบ่งปันไมโครโฟน\n___XYZ_แยก___\nพูดผ่านเดสก์ท็อป (Discord, Zoom, เกม...)\n___XYZ_แยก___\nเลือกไมโครโฟนที่จะส่ง\n___XYZ_แยก___\nพบเซิร์ฟเวอร์\n___XYZ_แยก___\nมัลติคาสต์\n___XYZ_แยก___\nยูนิคาสต์\n___XYZ_แยก___\nเข้ารหัสแล้ว\n___XYZ_แยก___\nจำเป็นต้องใช้กุญแจ\n___XYZ_แยก___\nการอนุมัติ\n___XYZ_แยก___\nกำลังส่งไมโครโฟน\n___XYZ_แยก___\nยอมรับการพูดคุยกลับ\n___XYZ_แยก___\nเพลิดเพลินกับการสตรีมเสียงผ่าน WiFi ใช่ไหม?\n___XYZ_แยก___\nแอปนี้ฟรีและไม่มีโฆษณา สร้างโดยบุคคลเพียงคนเดียวในเวลาว่าง หากเป็นประโยชน์สำหรับคุณ เคล็ดลับเล็กๆ น้อยๆ เกี่ยวกับ Ko-fi จะช่วยให้ Ko-fi ยังคงอยู่ได้ ไม่มีความกดดัน ทุกอย่างยังคงทำงานต่อไปไม่ว่าจะทางใดก็ทางหนึ่ง\n___XYZ_แยก___\nสนับสนุนบน Ko-fi ☕\n___XYZ_แยก___\nอาจจะในภายหลัง
