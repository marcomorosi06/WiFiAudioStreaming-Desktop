server_silent_title=อุปกรณ์อีกเครื่องไม่ตอบรับ\n___XYZ_แยก___\n“XYZPH0XYZ” ไม่เคยตอบคำขอเชื่อมต่อ สาเหตุที่เป็นไปได้มากที่สุดก็คือกำลังใช้งานแอปเวอร์ชันเก่า ซึ่งไม่สามารถพูดคุยกับแอปนี้ได้ โปรดอัปเดตแอปบนอุปกรณ์นั้น มิฉะนั้น ให้ตรวจสอบว่าไฟร์วอลล์ไม่ได้ปิดกั้นพอร์ต\n___XYZ_แยก___\nอุปกรณ์อื่นจำเป็นต้องอัปเดต\n___XYZ_แยก___\nอุปกรณ์นี้จำเป็นต้องอัปเดต\n___XYZ_แยก___\nแอปทั้งสองกำลังใช้งานเวอร์ชันโปรโตคอล WFAS ที่เข้ากันไม่ได้ (อุปกรณ์นี้: vXYZPH0XYZ ปลายอีกด้านหนึ่ง: vXYZPH1XYZ) การเชื่อมต่อถูกปิด โปรดอัปเดตเพื่อให้อุปกรณ์ทั้งสองใช้งานเวอร์ชันล่าสุด\n___XYZ_แยก___\nอุปกรณ์ที่กำลังส่งสัญญาณกำลังเรียกใช้แอปเวอร์ชันเก่า (โปรโตคอล WFAS vXYZPH0XYZ อุปกรณ์นี้ใช้ vXYZPH1XYZ) การเชื่อมต่อจึงถูกปิด อัปเดตแอปบนอุปกรณ์ส่งสัญญาณ\n___XYZ_แยก___\nอุปกรณ์ที่ได้รับกำลังใช้งานแอปเวอร์ชันเก่า (โปรโตคอล WFAS vXYZPH0XYZ อุปกรณ์นี้ใช้ vXYZPH1XYZ) ดังนั้นการเชื่อมต่อจึงถูกปิด อัปเดตแอปบนอุปกรณ์ที่รับ\n___XYZ_แยก___\nอุปกรณ์นี้ใช้งานแอปเวอร์ชันเก่า (โปรโตคอล WFAS vXYZPH0XYZ อุปกรณ์อีกเครื่องใช้ vXYZPH1XYZ) การเชื่อมต่อจึงถูกปิด อัปเดตแอปบนอุปกรณ์นี้\n___XYZ_แยก___\nเปิดการดาวน์โหลด\n___XYZ_แยก___\nดาวน์โหลดจากเว็บไซต์\n___XYZ_แยก___\nดาวน์โหลดจากเว็บไซต์\n___XYZ_แยก___\nเปิดบน GitHub\n___XYZ_แยก___\nการสตรีมแบบหลายผู้รับใช้งานบนพอร์ต XYZPH0XYZ\n___XYZ_แยก___\nเซิร์ฟเวอร์กำลังรอพอร์ต XYZPH0XYZ\n___XYZ_แยก___\nเชื่อมต่อไคลเอ็นต์แล้ว กำลังสตรีมไปที่ XYZPH0XYZ\n___XYZ_แยก___\nกำลังติดต่อเซิร์ฟเวอร์ที่ XYZPH0XYZ\n___XYZ_แยก___\nกำลังรอการยืนยันเซิร์ฟเวอร์...\n___XYZ_แยก___\nเชื่อมต่อแล้ว! สตรีมมิ่งจาก XYZPH0XYZ\n___XYZ_แยก___\nเข้าร่วมสตรีมมัลติคาสต์บนพอร์ต XYZPH0XYZ\n___XYZ_แยก___\nสตรีมมิ่งที่ใช้งานอยู่\n___XYZ_แยก___\nพร้อมสตรีมแล้ว\n___XYZ_แยก___\nกำลังรอการเชื่อมต่อ\n___XYZ_แยก___\nกด 'เริ่มเซิร์ฟเวอร์' เพื่อเริ่มต้น\n___XYZ_แยก___\nเลือกเซิร์ฟเวอร์จากรายการด้านล่าง\n___XYZ_แยก___\nเริ่มเซิร์ฟเวอร์
