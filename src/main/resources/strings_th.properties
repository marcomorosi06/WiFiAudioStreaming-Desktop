app_title=การสตรีมเสียง WiFi\n___XYZ_แยก___\nการตั้งค่า\n___XYZ_แยก___\nเปิดการตั้งค่า\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nคำเตือน\n___XYZ_แยก___\nยกเลิก\n___XYZ_แยก___\nรีเฟรช\n___XYZ_แยก___\nเชื่อมต่อ\n___XYZ_แยก___\nหยุด\n___XYZ_แยก___\nไม่ได้ใช้งาน\n___XYZ_แยก___\nกำลังค้นหาเซิร์ฟเวอร์...\n___XYZ_แยก___\nข้อผิดพลาดของเซิร์ฟเวอร์: XYZPH0XYZ\n___XYZ_แยก___\nข้อผิดพลาดไคลเอ็นต์: XYZPH0XYZ\n___XYZ_แยก___\nข้อผิดพลาด: ไม่ได้เลือกอุปกรณ์อินพุต\n___XYZ_แยก___\nข้อผิดพลาด: ไม่รองรับรูปแบบเสียง\n___XYZ_แยก___\nข้อผิดพลาด: บัฟเฟอร์เสียงไม่ถูกต้อง\n___XYZ_แยก___\nข้อผิดพลาดร้ายแรง: ไม่สามารถเข้าถึงสายเสียงได้\n___XYZ_แยก___\nเซิร์ฟเวอร์หยุดทำงาน\n___XYZ_แยก___\nการสตรีมสิ้นสุดลง\n___XYZ_แยก___\nข้อผิดพลาด: เซิร์ฟเวอร์ไม่ตอบสนอง\n___XYZ_แยก___\nการจับมือกันล้มเหลว\n___XYZ_แยก___\nเวอร์ชันโปรโตคอลที่เข้ากันไม่ได้\n___XYZ_แยก___\nเซิร์ฟเวอร์ไม่ตอบสนองการร้องขอการเชื่อมต่อ หากคุณเห็นในรายการแต่ไม่สามารถเชื่อมต่อได้ แสดงว่าอาจใช้แอปเวอร์ชันเก่าอยู่ ให้อัปเดตบนอุปกรณ์นั้น\n___XYZ_แยก___\nการกำหนดเส้นทางไมโครโฟนล้มเหลว: XYZPH0XYZ\n___XYZ_แยก___\nเซิร์ฟเวอร์ไม่ยอมรับไมโครโฟน ไมค์ไม่ได้ส่ง
