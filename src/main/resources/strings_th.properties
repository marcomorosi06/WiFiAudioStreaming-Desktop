http_codec_aac_desc=เอเอซี ? เวลาแฝงที่สูงขึ้น Safari, iOS, เบราว์เซอร์ทั้งหมด ใช้เมื่อไคลเอนต์ Opus ล้มเหลว\n___XYZ_แยก___\nสตรีม RTP/PCM ทำงานอยู่\n___XYZ_แยก___\nคัดลอกหรือบันทึกไฟล์ SDP เพื่อฟังด้วย VLC หรือ FFplay\n___XYZ_แยก___\nคัดลอก SDP\n___XYZ_แยก___\nบันทึก SDP ลงในไฟล์\n___XYZ_แยก___\nอินเทอร์เฟซเครือข่าย (Discovery & Multicast)\n___XYZ_แยก___\nหากคุณใช้ VPN (เช่น ZeroTier, Tailscale) ให้เลือกอะแดปเตอร์เสมือนที่นี่เพื่ออนุญาตให้อุปกรณ์ค้นหากัน\n___XYZ_แยก___\nมัลติคาสต์ถูกบังคับใช้เมื่อเปิดใช้งานสตรีม RTP\n___XYZ_แยก___\nมัลติคาสต์ถูกบังคับใช้เมื่อมีการเปิดใช้งานสตรีม HTTP\n___XYZ_แยก___\nมัลติคาสต์ถูกบังคับใช้เมื่อเปิดใช้งาน RTP หรือสตรีม HTTP\n___XYZ_แยก___\nMulticast จำเป็นสำหรับโปรโตคอลที่ใช้งานอยู่\n___XYZ_แยก___\nซื้อกาแฟให้ฉันหน่อย\n___XYZ_แยก___\nถ้าคุณชอบแอพนี้ ซื้อกาแฟให้ฉันหน่อย! \u2615\n___XYZ_แยก___\nใบอนุญาต\n___XYZ_แยก___\nEUPL v1.2 \u2014 \u00a9 มาร์โก โมโรซี\n___XYZ_แยก___\nโครงการนี้ได้รับอนุญาตภายใต้ European Union Public License v1.2 ทรัพย์สินทางปัญญาทั้งหมดเป็นของ Marco Morosi ใบอนุญาตให้สิทธิ์แก่คุณในการใช้ ศึกษา ดัดแปลง และแจกจ่ายซอฟต์แวร์อีกครั้ง แม้จะอยู่ในรูปแบบที่มีการแก้ไขก็ตาม โดยให้คุณคงใบอนุญาตเดิมไว้\n___XYZ_แยก___\nอ่านข้อความ EUPL v1.2 ฉบับเต็ม\n___XYZ_แยก___\nเปิด eupl.eu ในเบราว์เซอร์ของคุณ\n___XYZ_แยก___\nใบอนุญาตโอเพ่นซอร์ส\n___XYZ_แยก___\nซอฟต์แวร์บุคคลที่สามและใบอนุญาตของพวกเขา\n___XYZ_แยก___\nใบอนุญาตโอเพ่นซอร์ส\n___XYZ_แยก___\nหมายเหตุ: เว็บเบราว์เซอร์บังคับใช้การบัฟเฟอร์ภายในสำหรับสตรีม HTTP ซึ่งทำให้เกิดความล่าช้า 1-3 วินาทีอย่างหลีกเลี่ยงไม่ได้ นี่เป็นเรื่องปกติและไม่สามารถข้ามได้\n___XYZ_แยก___\nการกำหนดค่า Linux เริ่มอัตโนมัติ\n___XYZ_แยก___\nเปิดตัวเมื่อเริ่มต้น\n___XYZ_แยก___\nเริ่มแอปพลิเคชันโดยอัตโนมัติเมื่อคุณเข้าสู่ระบบ
