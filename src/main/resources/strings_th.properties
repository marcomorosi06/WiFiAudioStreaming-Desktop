auto_connect_retry_title=Retry Delay
auto_connect_retry_desc=ระยะเวลาที่ต้องรอหลังจากขาดการเชื่อมต่อก่อนที่จะเชื่อมต่อใหม่ ในหน่วยวินาที\n___XYZ_แยก___\nขอกุญแจ\n___XYZ_แยก___\nหากเซิร์ฟเวอร์ขอคีย์ รายการนี้ยังไม่ได้บันทึก: แสดงกล่องโต้ตอบคีย์ หรือข้ามเซิร์ฟเวอร์นั้น ปิดตามค่าเริ่มต้น เนื่องจากการเชื่อมต่อใหม่แบบอัตโนมัติไม่สามารถหยุดบนหน้าต่างที่ไม่มีใครอยู่ตรงนั้นเพื่อรับสาย\n___XYZ_แยก___\nเซิร์ฟเวอร์ที่บันทึกไว้\n___XYZ_แยก___\nเพิ่มเซิร์ฟเวอร์\n___XYZ_แยก___\nไม่สามารถเข้าถึงพวงกุญแจของระบบได้ ดังนั้นจึงไม่สามารถจัดเก็บคีย์ได้อย่างปลอดภัย บน Linux ติดตั้ง 'secret-tool' (แพ็คเกจ libsecret) และรีสตาร์ท\n___XYZ_แยก___\nปัญหาการจัดเก็บข้อมูลรับรอง\n___XYZ_แยก___\nจนกว่าจะได้รับการแก้ไข คีย์ที่คุณป้อนที่นี่จะไม่ถูกจดจำ\n___XYZ_แยก___\nไม่สามารถเข้าถึงพวงกุญแจระบบได้ ติดตั้ง 'secret-tool' (แพ็คเกจ libsecret) และรีสตาร์ท\n___XYZ_แยก___\nการป้องกันข้อมูลรับรอง Windows (DPAPI) ไม่พร้อมใช้งานบนระบบนี้\n___XYZ_แยก___\nพวงกุญแจ macOS ไม่พร้อมใช้งานบนระบบนี้\n___XYZ_แยก___\nระบบนี้ไม่มีที่เก็บข้อมูลรับรองที่สนับสนุน\n___XYZ_แยก___\nคีย์ริงของระบบตอบ แต่บันทึกการทดสอบล้มเหลว (XYZPH0XYZ) มันอาจจะล็อคอยู่ \u2014 ปลดล็อคแล้วลองอีกครั้ง\n___XYZ_แยก___\nที่อยู่\n___XYZ_แยก___\nท่าเรือ\n___XYZ_แยก___\nค่าเริ่มต้น\n___XYZ_แยก___\nชื่อ (ไม่บังคับ)\n___XYZ_แยก___\nคีย์\n___XYZ_แยก___\nบันทึกคีย์แล้ว\n___XYZ_แยก___\nไม่มีกุญแจ\n___XYZ_แยก___\nเก็บไว้ในที่เก็บข้อมูลรับรองระบบ ไม่เคยอยู่ใน config.json\n___XYZ_แยก___\nบันทึก\n___XYZ_แยก___\nเอากุญแจออก\n___XYZ_แยก___\nใช้รายการนี้\n___XYZ_แยก___\nไอคอนถาดไม่พร้อมใช้งาน
