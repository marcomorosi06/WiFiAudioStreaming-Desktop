qr_pairing_self_body=คำเชิญนี้สร้างโดยอุปกรณ์เดียวกันนี้ ดังนั้นจึงไม่มีสิ่งใดให้เชื่อมต่อ สแกนจากอุปกรณ์ที่ควรรับเสียง\n___XYZ_แยก___\nเข้าใจแล้ว\n___XYZ_แยก___\nนี่คือรหัสของคุณเอง\n___XYZ_แยก___\nอุปกรณ์อีกเครื่องปฏิเสธคำเชิญนี้ มันอาจจะถูกแทนที่ด้วยอันที่ใหม่กว่าหรือคีย์กลุ่มถูกสร้างขึ้นใหม่ ขอรหัสใหม่ครับ\n___XYZ_แยก___\nสแกนรหัสใหม่\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nคำเชิญใช้ไม่ได้อีกต่อไป\n___XYZ_แยก___\nสร้างคีย์ใหม่\n___XYZ_แยก___\nสแกนคิวอาร์\n___XYZ_แยก___\nปิดเครื่องสแกน\n___XYZ_แยก___\nคำเชิญนั้นหมดอายุแล้ว ขออันสดครับ.\n___XYZ_แยก___\nพบคำเชิญแล้ว\n___XYZ_แยก___\nเล็งกล้องไปที่โค้ด QR ที่แสดงโดยอุปกรณ์อื่น\n___XYZ_แยก___\nเอ่อ… คุณต้องการให้ฉันสแกนเรื่องนั้นเหรอ? นั่นไม่ใช่รหัส QR ของ WFAS!\n___XYZ_แยก___\nสแกนรหัสเชิญ\n___XYZ_แยก___\nคบเพลิง\n___XYZ_แยก___\nคิวอาร์โค้ด\n___XYZ_แยก___\nสร้างคีย์สุ่มโดยอัตโนมัติสำหรับการเชิญแต่ละครั้ง — ปลอดภัยกว่ารหัสผ่านที่เลือกด้วยตนเอง ไม่มีรหัสผ่านให้จำหรือพูดออกมาดังๆ\n___XYZ_แยก___\nคีย์ที่สร้างขึ้นโดยอัตโนมัติ\n___XYZ_แยก___\nในโหมดกุญแจ กุญแจต้องไม่ว่างเปล่า ป้อนรหัสภายใต้ความปลอดภัย หรือเปลี่ยนไปใช้รหัส QR เพื่อให้สร้างรหัสให้คุณ\n___XYZ_แยก___\nกุญแจหาย\n___XYZ_แยก___\nรหัสกลุ่มเปลี่ยนแปลงโดยผู้ส่ง\n___XYZ_แยก___\nไม่สามารถส่งไปยังกลุ่มมัลติคาสต์: XYZPH0XYZ\n___XYZ_แยก___\nการเชื่อมต่อ\n___XYZ_แยก___\nวิธีการเชื่อมต่อ
