snapcast_how_to_connect_auto=ลูกค้าบนเครือข่ายนี้ค้นหาสตรีมได้ด้วยตนเอง หากไม่มีให้ชี้ไปที่ที่อยู่ด้านล่าง\n___XYZ_แยก___\nการค้นพบอัตโนมัติปิดอยู่ ดังนั้นลูกค้าจะต้องชี้ไปยังที่อยู่นี้อย่างชัดเจน\n___XYZ_แยก___\nในแอปมือถือ Snapcast ให้เพิ่มเซิร์ฟเวอร์ตาม IP ใน Home Assistant ใช้การรวม Snapcast กับโฮสต์นี้และพอร์ตควบคุม\n___XYZ_แยก___\nจำกุญแจไว้\n___XYZ_แยก___\nเก็บไว้ใน XYZPH0XYZ ซึ่งเข้ารหัสโดยระบบ\n___XYZ_แยก___\nไม่จัดเก็บ: จะถูกถามอีกครั้งทุกครั้งที่สตาร์ท\n___XYZ_แยก___\nไม่มีการจัดเก็บข้อมูลรับรองบนระบบนี้ ดังนั้นจึงไม่ได้บันทึกคีย์: ป้อนคีย์ทุกครั้งที่สตาร์ท หรือตั้งค่า WFAS_AUTH_KEY\n___XYZ_แยก___\nรอก่อนที่จะเริ่มอัตโนมัติ...\n___XYZ_แยก___\nกำลังรอเครือข่าย...\n___XYZ_แยก___\nยกเลิกการเริ่มอัตโนมัติ: ไม่มีที่อยู่ในเครื่องหลังจาก 60 วินาที\n___XYZ_แยก___\nการสตาร์ทอัตโนมัติถูกยกเลิก: ความปลอดภัยถูกตั้งค่าไว้ที่คีย์ แต่ไม่มีการบันทึกคีย์\n___XYZ_แยก___\nเริ่มการหน่วงเวลา\n___XYZ_แยก___\nวินาทีที่ต้องรอก่อนที่เซิร์ฟเวอร์จะเริ่มทำงาน เมื่อเข้าสู่ระบบเครือข่ายมักจะยังไม่พร้อม และเซิร์ฟเวอร์ที่เริ่มต้นโดยไม่มีที่อยู่คือเซิร์ฟเวอร์ที่ไม่มีใครพบ\n___XYZ_แยก___\nรอเครือข่าย\n___XYZ_แยก___\nกดปุ่มสตาร์ทอัตโนมัติค้างไว้จนกระทั่งเครื่องนี้มีที่อยู่ในเครื่องที่ใช้งานได้ สูงสุดหนึ่งนาที\n___XYZ_แยก___\nเริ่มระดับเสียง\n___XYZ_แยก___\nปริมาณที่ใช้เมื่อเซิร์ฟเวอร์เริ่มทำงานอัตโนมัติ ลาออกเพื่อคงอันปัจจุบันไว้\n___XYZ_แยก___\nเริ่มต้นความปลอดภัยอัตโนมัติ\n___XYZ_แยก___\nโหมดความปลอดภัยสำหรับเซิร์ฟเวอร์ที่เริ่มทำงานโดยอัตโนมัติ สืบทอดจะใช้การตั้งค่าทั่วไป key ต้องใช้คีย์ที่แชร์ล่วงหน้าที่บันทึกไว้\n___XYZ_แยก___\nสืบทอด\n___XYZ_แยก___\nกำลังเชื่อมต่ออัตโนมัติกับ XYZPH0XYZ...\n___XYZ_แยก___\nXYZPH0XYZ ข้ามไป: คีย์ที่บันทึกไว้ไม่พร้อมใช้งาน\n___XYZ_แยก___\nช่วงการสแกน\n___XYZ_แยก___\nความถี่ในการตรวจสอบรายการเป็นวินาที\n___XYZ_แยก___\nลองล่าช้าอีกครั้ง
snapcast_how_to_connect_manual=Automatic discovery is off, so clients must be pointed at this address explicitly.
snapcast_how_to_connect_apps=In the Snapcast mobile app add the server by IP. In Home Assistant use the Snapcast integration with this host and the control port.
