welcome_privacy_title=Automatic update check
welcome_privacy_desc=On every launch the app asks GitHub whether a newer version exists.
welcome_privacy_detail=GitHub เป็นบริษัทในสหรัฐอเมริกาที่ Microsoft เป็นเจ้าของ ทุกคำขอจำเป็นต้องเปิดเผยที่อยู่ IP ของคุณให้พวกเขาทราบพร้อมกับเวลาของคำขอ ไม่มีการส่งสิ่งใดอีก: ไม่มีบัญชี ไม่มีตัวระบุ ไม่มีข้อมูลการใช้งาน ปิดการตั้งค่านี้แล้วแอปจะไม่ติดต่อกับเครือข่ายเลย \u2014 คุณยังคงตรวจสอบด้วยตนเองจากการตั้งค่าได้ตลอดเวลา\n___XYZ_แยก___\nมีการตรวจสอบ 7 ครั้งทุกครั้งที่เปิดตัว\n___XYZ_แยก___\nปิด \u00b7 แอปไม่เคยติดต่อกับ GitHub\n___XYZ_แยก___\nรายละเอียดเพิ่มเติม\n___XYZ_แยก___\nรายละเอียดน้อยลง\n___XYZ_แยก___\nฉันเห็นสิ่งที่คุณทำที่นั่นใน build.gradle\n___XYZ_แยก___\nดูคุณสิ กำลังแฮ็คไฟล์ในเครื่องของคุณเอง ภูมิใจในตัวเอง? ;)\n___XYZ_แยก___\nไม่สามารถเล่นสตรีมนี้ได้: เซิร์ฟเวอร์ส่ง XYZPH0XYZ ซึ่งอุปกรณ์เอาต์พุตนี้ไม่รองรับ\n___XYZ_แยก___\nนักพัฒนา\n___XYZ_แยก___\nคุณสมบัติของนักพัฒนา\n___XYZ_แยก___\nแสดงตัวเลือกการทดลองขั้นสูง\n___XYZ_แยก___\nลดเสียงรบกวน\n___XYZ_แยก___\nทำความสะอาดเสียงฮัมและเสียงฟู่จากแหล่งสัญญาณอะนาล็อก\n___XYZ_แยก___\nความแรง: XYZPH0XYZ%%\n___XYZ_แยก___\nเฉพาะสำหรับผู้ส่งอะนาล็อกที่มีเสียงรบกวน เช่น ไมโครคอนโทรลเลอร์สุ่มตัวอย่างสัญญาณออก สำหรับเสียงดิจิตอลที่สะอาด สามารถเพิ่มได้เฉพาะสิ่งประดิษฐ์เท่านั้น อย่าใช้หากผู้ส่งขจัดเสียงรบกวนที่ด้านข้างไปแล้ว\n___XYZ_แยก___\nเซิร์ฟเวอร์นั้นกำลังสตรีมไปยังอุปกรณ์อื่นอยู่แล้ว\n___XYZ_แยก___\nลิงค์ยูเอสบี\n___XYZ_แยก___\nสตรีมผ่าน USB\n___XYZ_แยก___\nใช้สาย USB แทน Wi-Fi เปิดใช้งานการปล่อยสัญญาณผ่าน USB บนโทรศัพท์ Android จากนั้นแอปจะค้นหาลิงก์ด้วยตัวเอง\n___XYZ_แยก___\nบัฟเฟอร์ USB (มิลลิวินาที)\n___XYZ_แยก___\nบัฟเฟอร์กระวนกระวายใจที่ใช้แทนเสียงในขณะที่ลิงก์ USB ทำงานอยู่ ต่ำกว่าหมายถึงเวลาแฝงน้อยลง แต่มีความเสี่ยงที่จะเกิดการตกกลางคันมากขึ้น อุปกรณ์บางตัวส่งแพ็กเก็ต USB ออกมาเป็นชุดและต้องการบัฟเฟอร์ที่นี่มากกว่าผ่าน Wi-Fi ไม่น้อย\n___XYZ_แยก___\nโหมด USB ปิดอยู่\n___XYZ_แยก___\nลิงค์ USB ใช้งานอยู่: XYZPH0XYZ (XYZPH0XYZ)\n___XYZ_แยก___\nไม่พบลิงค์ USB เชื่อมต่อโทรศัพท์และเปิดใช้งานการปล่อยสัญญาณผ่าน USB\n___XYZ_แยก___\nไม่พบลิงค์ USB เชื่อมต่อโทรศัพท์และเปิดใช้งานการปล่อยสัญญาณผ่าน USB
