qr_pairing_deeplink_confirm_body_multicast=ตรวจพบคำเชิญ WFAS สำหรับการรับแบบหลายผู้รับ คุณต้องการเชื่อมต่อตอนนี้หรือไม่?\n___XYZ_แยก___\nตรวจพบคำเชิญ WFAS สำหรับการสตรีมจากอุปกรณ์นั้น คุณต้องการเชื่อมต่อตอนนี้หรือไม่?\n___XYZ_แยก___\nเชื่อมต่อ\n___XYZ_แยก___\nไม่สนใจ\n___XYZ_แยก___\nอุปกรณ์นี้กำลังส่งสัญญาณอยู่ในขณะนี้ การเชื่อมต่อจะหยุดการส่งข้อมูลนั้น\n___XYZ_แยก___\nเชื่อมต่อกับ XYZPH0XYZ?\n___XYZ_แยก___\nคีย์ของกลุ่มมัลติคาสต์นี้ได้รับการอัปเดตหลังจากสร้างโค้ดแล้ว ขอให้อุปกรณ์กระจายเสียงได้รับคำเชิญใหม่\n___XYZ_แยก___\nเข้าใจแล้ว\n___XYZ_แยก___\nกลุ่มนี้มีการเปลี่ยนแปลง\n___XYZ_แยก___\nรหัสนี้ใช้ไม่ได้อีกต่อไปเนื่องจากเหตุผลด้านความปลอดภัย สร้างคำเชิญใหม่เพื่อดำเนินการต่อ\n___XYZ_แยก___\nสร้างรหัสใหม่\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nรหัส QR หมดอายุแล้ว\n___XYZ_แยก___\nรหัสที่สแกนไม่ใช่คำเชิญ WFAS ที่ถูกต้อง ตรวจสอบให้แน่ใจว่าคุณกำลังสแกนโค้ดที่สร้างโดยอุปกรณ์อื่น\n___XYZ_แยก___\nยกเลิก\n___XYZ_แยก___\nลองอีกครั้ง\n___XYZ_แยก___\nไม่รู้จักรหัส\n___XYZ_แยก___\nไม่พบเว็บแคม คุณยังคงสามารถป้อนที่อยู่และรหัสได้ด้วยตนเอง\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nป้อนด้วยตนเอง\n___XYZ_แยก___\nกล้องใช้งานไม่ได้\n___XYZ_แยก___\nอุปกรณ์ที่เชื่อมต่อทั้งหมดจะต้องจับคู่อีกครั้ง ใช้ตัวเลือกนี้หากคุณคิดว่าอุปกรณ์ที่ไม่ได้รับอนุญาตทราบรหัสปัจจุบัน\n___XYZ_แยก___\nยกเลิก\n___XYZ_แยก___\nสร้างใหม่\n___XYZ_แยก___\nสร้างคีย์กลุ่มใหม่หรือไม่
