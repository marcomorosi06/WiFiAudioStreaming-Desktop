snapcast_codec_pcm_desc=ไม่มีการบีบอัด ประมาณ 1.5 Mbps ต่อไคลเอนต์ที่สเตอริโอ 48 kHz เวลาแฝงในการเข้ารหัสเป็นศูนย์\n___XYZ_แยก___\nการบีบอัดแบบไม่สูญเสีย ลดแบนด์วิธลงครึ่งหนึ่งโดยประมาณ เพิ่มความล่าช้าในการเข้ารหัสประมาณ 25 มิลลิวินาที\n___XYZ_แยก___\nสูญเสียแบนด์วิธต่ำสุด ต้องใช้อินพุตสเตอริโอ 16 บิต 48000 Hz\n___XYZ_แยก___\nOpus ต้องการสเตอริโอ 48000 Hz ด้วยการตั้งค่าเสียงปัจจุบัน เซิร์ฟเวอร์จะถอยกลับไปเป็น PCM\n___XYZ_แยก___\nขนาดก้อน\n___XYZ_แยก___\nบัฟเฟอร์ไคลเอ็นต์ (มิลลิวินาที)\n___XYZ_แยก___\nไคลเอ็นต์ตั้งเวลาการเล่นล่วงหน้าได้มากเพียงใด ยิ่งสูงก็ยิ่งแข็งแกร่ง ยิ่งต่ำก็ตอบสนองได้ดีกว่า\n___XYZ_แยก___\nชื่อสตรีม\n___XYZ_แยก___\nเริ่มต้นเซิร์ฟเวอร์เพื่อโฆษณาสตรีมผ่าน mDNS ลูกค้าค้นพบมันโดยอัตโนมัติ\n___XYZ_แยก___\nXYZPH0XYZ ไม่สามารถใช้งานได้ที่นี่ แต่จะสตรีมเป็น XYZPH1XYZ แทน\n___XYZ_แยก___\nให้บริการ XYZPH0XYZ (XYZPH1XYZ) ไปยังไคลเอนต์ XYZPH2XYZ, การเชื่อมต่อควบคุม XYZPH3XYZ\n___XYZ_แยก___\nXYZPH0XYZ - ปริมาณ XYZPH1XYZ%%, เวลาแฝง XYZPH2XYZ ms\n___XYZ_แยก___\nออนไลน์\n___XYZ_แยก___\nออฟไลน์\n___XYZ_แยก___\nSnapcast หลายห้อง\n___XYZ_แยก___\nไคลเอนต์ XYZPH0XYZ กำลังเล่นพร้อมกัน\n___XYZ_แยก___\nสตรีม\n___XYZ_แยก___\nการควบคุม\n___XYZ_แยก___\nตัวแปลงสัญญาณ\n___XYZ_แยก___\nการค้นพบ\n___XYZ_แยก___\nโฆษณาผ่าน mDNS\n___XYZ_แยก___\nไม่ได้โฆษณา - เชื่อมต่อด้วยตนเอง\n___XYZ_แยก___\nพอร์ต XYZPH0XYZ ไม่พร้อมใช้งาน\n___XYZ_แยก___\nไม่สามารถเปิดพอร์ต: XYZPH0XYZ เซิร์ฟเวอร์ Snapcast อื่นอาจทำงานอยู่แล้ว หรือไฟร์วอลล์กำลังบล็อกอยู่\n___XYZ_แยก___\nวิธีการเชื่อมต่อ
