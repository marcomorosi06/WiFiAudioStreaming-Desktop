mute_render_desc=Silence local playback while the server captures it, so the audio is not heard twice. Turn it off to keep hearing it here as well as on the client. Native engine only; the previous state is restored when the server stops. CLI: --no-mute-render.
server_persist_title=Keep Server Running After Disconnect
server_persist_desc=In unicast, a client leaving ends the session, not the server: it keeps the port open and waits for the next client. Multicast already works this way.
mic_routing_title=Incoming microphone routing
mic_routing_desc=Choose how to handle the microphone stream received from the client
mic_routing_off=Off
mic_routing_off_desc=Ignore the client microphone
mic_routing_virtual=Virtual microphone
mic_routing_virtual_desc=แสดงไมโครโฟนไปยังแอปอื่นๆ (Discord, Zoom...) เป็นอุปกรณ์อินพุตเสมือน\n___XYZ_แยก___\nผสมให้เข้ากัน\n___XYZ_แยก___\nผสมผสานไมโครโฟนเข้ากับสตรีมเสียงที่ส่งกลับไปยังไคลเอนต์\n___XYZ_แยก___\nsink เสมือนชื่อ "WFAS_VirtualMic" จะถูกสร้างขึ้นโดยอัตโนมัติผ่าน pactl\n___XYZ_แยก___\nสายเคเบิลเสมือนที่ตรวจพบ: XYZPH0XYZ\n___XYZ_แยก___\nไม่พบสายเคเบิลเสมือน ติดตั้ง VB-CABLE (Windows) หรือ BlackHole/Loopback (macOS) หรือเลือกอุปกรณ์ด้วยตนเอง\n___XYZ_แยก___\nอุปกรณ์เอาท์พุตสำหรับไมโครโฟน\n___XYZ_แยก___\nไมโครโฟนจะถูกผสมเข้ากับสตรีมเสียงขาออกโดยตรง\n___XYZ_แยก___\nการแชร์ไมโครโฟนรองรับเฉพาะในโหมดผู้รับเดียวเท่านั้น ปิดการใช้งานมัลติคาสต์/RTP เพื่อใช้งาน\n___XYZ_แยก___\nไมโครโฟนเสมือนใช้ได้เฉพาะในโหมดผู้รับเดียวเท่านั้น มิกซ์เข้ากับสตรีมยังคงใช้งานได้ในแบบมัลติคาสต์\n___XYZ_แยก___\nปิดเสียงไมโครโฟนแล้ว\n___XYZ_แยก___\nไมโครโฟนใช้งานอยู่\n___XYZ_แยก___\nอุปกรณ์อินพุตไมโครโฟน\n___XYZ_แยก___\nต้องการความช่วยเหลือในการตั้งค่านี้หรือไม่?\n___XYZ_แยก___\nWindows — การตั้งค่า VB-CABLE\n___XYZ_แยก___\nไปที่ vb-audio.com/Cable และดาวน์โหลด VB-CABLE\n___XYZ_แยก___\nเรียกใช้โปรแกรมติดตั้งในฐานะผู้ดูแลระบบ จากนั้นรีสตาร์ทพีซีของคุณ\n___XYZ_แยก___\nหลังจากรีสตาร์ทแล้ว "CABLE Input" จะปรากฏในรายการแบบเลื่อนลงด้านบน — เลือก\n___XYZ_แยก___\nใน Discord, Zoom หรือแอปอื่นๆ ให้ไปที่การตั้งค่าเสียงแล้วเลือก "CABLE Output" เป็นไมโครโฟน\n___XYZ_แยก___\nเสร็จแล้ว! เสียงที่สตรีมจะปรากฏเป็นไมโครโฟนของคุณในแอปเหล่านั้น\n___XYZ_แยก___\nเปิด vb-audio.com/Cable\n___XYZ_แยก___\nLinux — ซิงก์เสมือนอัตโนมัติ\n___XYZ_แยก___\nไม่จำเป็นต้องติดตั้ง เมื่อการสตรีมเริ่มต้น sink เสมือนที่เรียกว่า "WFAS_VirtualMic" จะถูกสร้างขึ้นโดยอัตโนมัติผ่าน pactl\n___XYZ_แยก___\nเปิด Pavucontrol (การควบคุมระดับเสียง PulseAudio) หรือเทียบเท่ากับ PipeWire\n___XYZ_แยก___\nในแท็บ "การบันทึก" ให้ตั้งค่า Discord/Zoom/etc เพื่อจับภาพจาก "WFAS_VirtualMic"
