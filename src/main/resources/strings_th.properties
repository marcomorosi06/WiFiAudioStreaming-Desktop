fw_title=อนุญาตผ่านไฟร์วอลล์ Windows\n___XYZ_แยก___\nกฎใช้งานอยู่\n___XYZ_แยก___\nไม่ได้กำหนดค่า\n___XYZ_แยก___\nหากอุปกรณ์ไม่สามารถเชื่อมต่อได้และยังคง "รอ" อยู่ ให้อนุญาตการรับส่งข้อมูลขาเข้าบนพอร์ต UDP เหล่านี้ ต้องได้รับการอนุมัติจากผู้ดูแลระบบเพียงครั้งเดียว\n___XYZ_แยก___\nพอร์ต UDP\n___XYZ_แยก___\nอนุญาตผ่านไฟร์วอลล์\n___XYZ_แยก___\nfirewalld ทำงานอยู่ในระบบนี้\n___XYZ_แยก___\nufw ทำงานอยู่บนระบบนี้\n___XYZ_แยก___\nหากอุปกรณ์ไม่สามารถเชื่อมต่อและยังคง "รอ" UDP ขาเข้าบนพอร์ตเหล่านี้อาจถูกบล็อก รันคำสั่งด้านล่างในเทอร์มินัล\n___XYZ_แยก___\nคำสั่งคัดลอก\n___XYZ_แยก___\nอนุญาต\n___XYZ_แยก___\nอัปเดตไฟร์วอลล์แล้ว\n___XYZ_แยก___\nขณะนี้ UDP ขาเข้าได้รับอนุญาตบนพอร์ตที่เลือกแล้ว อุปกรณ์ควรจะสามารถเชื่อมต่อได้\n___XYZ_แยก___\nไม่ได้นำไปใช้\n___XYZ_แยก___\nการเปลี่ยนแปลงต้องได้รับอนุมัติจากผู้ดูแลระบบ คลิกอนุญาตอีกครั้งและยอมรับพรอมต์ของ Windows\n___XYZ_แยก___\nเกิดข้อผิดพลาด\n___XYZ_แยก___\nคุณลักษณะนี้มีเฉพาะใน Windows เท่านั้น\n___XYZ_แยก___\nการเริ่มต้นและหน้าต่าง\n___XYZ_แยก___\nเสียง\n___XYZ_แยก___\nระบบ\n___XYZ_แยก___\nข้อมูล\n___XYZ_แยก___\nดาวน์โหลดจากเว็บไซต์\n___XYZ_แยก___\nดาวน์โหลดจาก GitHub\n___XYZ_แยก___\nตรวจสอบการอัพเดตอัตโนมัติ\n___XYZ_แยก___\nทุกครั้งที่เปิดตัวแอปจะถาม GitHub ว่ามีเวอร์ชันที่ใหม่กว่าหรือไม่
