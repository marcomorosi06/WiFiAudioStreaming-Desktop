status_serving_protocols=สตรีมมิ่งด้วย %s\n___XYZ_แยก___\nเอาต์พุต DLNA\n___XYZ_แยก___\nจุดสิ้นสุดของสื่อ\n___XYZ_แยก___\nรูปแบบ\n___XYZ_แยก___\nไม่ได้เลือกตัวแสดงภาพ เลือกหนึ่งรายการในการตั้งค่า\n___XYZ_แยก___\n%s การเชื่อมต่อที่ใช้งานอยู่\n___XYZ_แยก___\nเชิญ\n___XYZ_แยก___\nเชิญอุปกรณ์\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nสร้างรหัสเชิญ\n___XYZ_แยก___\nคัดลอกคีย์แล้ว\n___XYZ_แยก___\nคัดลอก\n___XYZ_แยก___\nหมดอายุใน %s\n___XYZ_แยก___\nการเข้ารหัสเสียงเปิดอยู่: กลุ่มมัลติคาสต์ไม่มีการจับมือกัน ดังนั้นหากไม่มีการจับมือกัน คีย์ก็จะไม่ปกป้องอะไรเลย\n___XYZ_แยก___\n%s · พอร์ต XYZPH1XYZ\n___XYZ_แยก___\nหมดอายุแล้ว\n___XYZ_แยก___\nซ่อนกุญแจ\n___XYZ_แยก___\nคีย์ (ป้อนด้วยตนเอง)\n___XYZ_แยก___\nแสดงกุญแจ\n___XYZ_แยก___\nยังไม่มีที่อยู่เครือข่าย เชื่อมต่อกับเครือข่าย Wi-Fi แล้วลองอีกครั้ง\n___XYZ_แยก___\nสแกนรหัสนี้จากอุปกรณ์รับเพื่อเข้าร่วมกลุ่ม\n___XYZ_แยก___\nสแกนรหัสนี้จากอุปกรณ์รับ ใช้ได้สำหรับการจับคู่เดียวเท่านั้น\n___XYZ_แยก___\nแตะรหัสเพื่อกลับไปสู่เวอร์ชันสีสันสดใส\n___XYZ_แยก___\nมีปัญหาในการสแกนใช่ไหม แตะรหัสสำหรับเวอร์ชันขาวดำธรรมดา\n___XYZ_แยก___\nสแกนเพื่อเชื่อมต่อ
