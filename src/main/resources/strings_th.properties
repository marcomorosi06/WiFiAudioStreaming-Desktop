linux_deps_inline=การพึ่งพา Linux หายไป ตรวจสอบป๊อปอัป\n___XYZ_แยก___\nความเป็นส่วนตัวของ Windows Mic\n___XYZ_แยก___\nหากไคลเอนต์ได้ยินเสียงเงียบสนิท แสดงว่า Windows กำลังบล็อกสายเคเบิลเสมือน คุณต้องอนุญาตให้แอปเดสก์ท็อปเข้าถึงไมโครโฟนในการตั้งค่า Windows\n___XYZ_แยก___\nอย่าแสดงอีก\n___XYZ_แยก___\nแก้ไข\n___XYZ_แยก___\nตกลง\n___XYZ_แยก___\nการดำเนินการที่จำเป็น: ตั้งค่าเอาต์พุตเสียง\n___XYZ_แยก___\nหากต้องการสตรีมเสียงของระบบ คุณต้องคลิกไอคอนลำโพงในทาสก์บาร์ของ Windows และตั้งค่า 'CABLE Input' เป็นอุปกรณ์เล่นเริ่มต้นก่อนที่จะเริ่ม\n___XYZ_แยก___\nความสว่าง: XYZPH0XYZ%%\n___XYZ_แยก___\nสี HEX\n___XYZ_แยก___\nโปรโตคอลเซิร์ฟเวอร์\n___XYZ_แยก___\nเลือกโปรโตคอลที่ไคลเอ็นต์สามารถใช้เพื่อรับสตรีม\n___XYZ_แยก___\nโปรโตคอลเนทีฟที่มีความหน่วงต่ำ (ต้องมีแอป)\n___XYZ_แยก___\nเข้ากันได้กับ VLC, ffplay, Kodi ? ไม่จำเป็นต้องใช้แอป\n___XYZ_แยก___\nเว็บอินเตอร์เฟส (HTTP/MP3)\n___XYZ_แยก___\nสตรีมผ่านเบราว์เซอร์, iOS Safari, สมาร์ททีวี ? เวลาแฝง ~ 2 วินาที\n___XYZ_แยก___\nพอร์ต HTTP\n___XYZ_แยก___\nเปิด URL นี้ในเบราว์เซอร์ใดก็ได้บนเครือข่ายเดียวกัน\n___XYZ_แยก___\nเปิดอยู่เสมอ\n___XYZ_แยก___\nเว็บสตรีมทำงานอยู่\n___XYZ_แยก___\nคัดลอก URL\n___XYZ_แยก___\nเปิดในเบราว์เซอร์\n___XYZ_แยก___\nกำลังเปิดสตรีมในเบราว์เซอร์: XYZPH0XYZ\n___XYZ_แยก___\nความเข้ากันได้ของเบราว์เซอร์\n___XYZ_แยก___\nบทประพันธ์? เวลาแฝงที่ต่ำกว่า Chrome, Firefox, Edge, เดสก์ท็อป VLC
