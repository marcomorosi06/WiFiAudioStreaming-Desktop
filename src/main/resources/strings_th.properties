auth_key_show=แสดงกุญแจ\n___XYZ_แยก___\nคีย์อ่อนแอ\n___XYZ_แยก___\nยุติธรรมที่สำคัญ\n___XYZ_แยก___\nกุญแจที่แข็งแกร่ง\n___XYZ_แยก___\nซ่อนกุญแจ\n___XYZ_แยก___\nเข้ารหัสเสียง\n___XYZ_แยก___\nเข้ารหัสเสียงจากต้นทางถึงปลายทางด้วย ChaCha20-Poly1305 ต้องใช้โหมดคีย์ (คีย์ที่แชร์ล่วงหน้า)\n___XYZ_แยก___\nเปิดตลอดเวลา: โหมด QR พร้อมมัลติคาสต์ต้องมีการเข้ารหัส\n___XYZ_แยก___\nเวลาแฝง: XYZPH0XYZ ms (XYZPH1XYZ)\n___XYZ_แยก___\nตอบสนอง\n___XYZ_แยก___\nสมดุล\n___XYZ_แยก___\nมีเสถียรภาพ\n___XYZ_แยก___\nขั้นสูง\n___XYZ_แยก___\nขนาดแพ็คเก็ต: XYZPH0XYZ ไบต์\n___XYZ_แยก___\nไบต์ของเสียงต่อแพ็กเก็ตเครือข่าย (สตรีมเซิร์ฟเวอร์และไมโครโฟน) ล่าง = แพ็กเก็ตที่เล็กกว่า เช่น สำหรับไมโครคอนโทรลเลอร์ ค่าเริ่มต้นคือเครือข่ายสูงสุด\n___XYZ_แยก___\nพอร์ตเสียงหลัก\n___XYZ_แยก___\nพอร์ตไมโครโฟน\n___XYZ_แยก___\nธีม\n___XYZ_แยก___\nเบา\n___XYZ_แยก___\nมืด\n___XYZ_แยก___\nระบบ\n___XYZ_แยก___\nเกี่ยวกับและช่วยเหลือ\n___XYZ_แยก___\nพัฒนาโดย\n___XYZ_แยก___\nเวอร์ชัน Android\n___XYZ_แยก___\nดูซอร์สโค้ดบน GitHub
