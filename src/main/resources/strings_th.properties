protocol_dlna_title=ตัวเรนเดอร์ DLNA / UPnP\n___XYZ_แยก___\nส่งสัญญาณเสียงไปยังเครื่องรับ AV, ซาวด์บาร์ และสมาร์ททีวี โดยไม่ต้องใช้แอป\n___XYZ_แยก___\nพอร์ตสื่อ DLNA\n___XYZ_แยก___\nพอร์ต TCP ที่ตัวเรนเดอร์เชื่อมต่อกลับเข้าไป ต้องสามารถเข้าถึงได้จากตัวแสดงภาพ\n___XYZ_แยก___\nรูปแบบเสียง\n___XYZ_แยก___\nอัตโนมัติ (ต่อรองได้)\n___XYZ_แยก___\nถามตัวเรนเดอร์แต่ละรายว่ารองรับอะไรบ้าง และเลือกตัวแสดงภาพที่ดีที่สุด ที่แนะนำ.\n___XYZ_แยก___\nPCM 16 บิตที่ไม่มีการบีบอัด ~1.4 Mbps เวลาแฝงต่ำสุด ความเข้ากันได้กว้างที่สุด\n___XYZ_แยก___\nPCM ที่ไม่บีบอัดภายในส่วนหัว WAV แบบสตรีมมิ่ง ช่วยเฟิร์มแวร์รุ่นเก่าบางตัว\n___XYZ_แยก___\nบีบอัด ~320kbps ใช้เมื่อเครือข่ายช้าหรือมี Wi-Fi หนาแน่น\n___XYZ_แยก___\nAAC ที่ถูกบีบอัด มีประสิทธิภาพ แต่การสนับสนุนตัวเรนเดอร์มีความสอดคล้องน้อยที่สุด\n___XYZ_แยก___\nการเรนเดอร์บนเครือข่าย\n___XYZ_แยก___\nสแกนอีกครั้ง\n___XYZ_แยก___\nกำลังค้นหาตัวแสดงภาพ...\n___XYZ_แยก___\nไม่พบตัวเรนเดอร์ DLNA ตรวจสอบให้แน่ใจว่าอุปกรณ์เปิดอยู่และอยู่บนเครือข่ายเดียวกัน\n___XYZ_แยก___\nตัวเรนเดอร์ที่เลือกจะถูกจดจำและเชื่อมต่อใหม่โดยอัตโนมัติเมื่อเริ่มการสตรีม\n___XYZ_แยก___\nออฟไลน์\n___XYZ_แยก___\nทางเลือก\n___XYZ_แยก___\nกำลังเล่น\n___XYZ_แยก___\nกำลังเชื่อมต่อ...\n___XYZ_แยก___\nกำลังลองอีกครั้ง...\n___XYZ_แยก___\nการจับมือกันล้มเหลว\n___XYZ_แยก___\nคัดลอกการวินิจฉัย\n___XYZ_แยก___\nล้างการเลือก\n___XYZ_แยก___\nและ
