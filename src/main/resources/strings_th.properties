usb_diag_macos=ไม่พบลิงค์ USB macOS ไม่มีไดรเวอร์ RNDIS ในตัว ดังนั้นการปล่อยสัญญาณผ่าน USB ของ Android มักจะใช้ไม่ได้ที่นี่ ใช้ Wi-Fi แทน\n___XYZ_แยก___\nพบอะแดปเตอร์ USB (XYZPH0XYZ) แต่ไม่มีที่อยู่ IP การปล่อยสัญญาณผ่าน USB อาจยังคงปิดอยู่ในอุปกรณ์\n___XYZ_แยก___\nอินเตอร์เฟซ USB\n___XYZ_แยก___\nปล่อยให้เป็นอัตโนมัติ เว้นแต่การตรวจจับจะเลือกอะแดปเตอร์ผิด อะแดปเตอร์ที่ไม่มีที่อยู่ IP ก็มีอยู่ในรายการเช่นกัน ดังนั้นคุณจึงสามารถบอกไดรเวอร์เก่าจากไดรเวอร์ที่ใช้งานอยู่ได้\n___XYZ_แยก___\nอัตโนมัติ\n___XYZ_แยก___\nXYZPH0XYZ (ไม่มีไอพี)\n___XYZ_แยก___\nส่งผ่าน USB\n___XYZ_แยก___\nสตรีมไปยังโทรศัพท์ผ่านสายเคเบิลแทน Wi-Fi\n___XYZ_แยก___\nรับผ่าน USB\n___XYZ_แยก___\nฟังโทรศัพท์ผ่านสายเคเบิลแทน Wi-Fi\n___XYZ_แยก___\nอุปกรณ์บนสายเคเบิลนี้จะปรากฏในรายการที่มีเครื่องหมาย USB\n___XYZ_แยก___\nเชื่อมต่อโทรศัพท์และเปิดใช้งานการปล่อยสัญญาณผ่าน USB\n___XYZ_แยก___\nสายเคเบิลได้รับการยอมรับ เปิดการเชื่อมต่ออินเทอร์เน็ตผ่าน USB บนอุปกรณ์เพื่อแจกที่อยู่\n___XYZ_แยก___\nยูเอสบี\n___XYZ_แยก___\nอินเตอร์เน็ตไร้สาย\n___XYZ_แยก___\nความพร้อมใช้งานของ WFAS\n___XYZ_แยก___\nเลือกเวลาที่อุปกรณ์นี้ให้บริการโปรโตคอล WFAS ดั้งเดิม "ปิดเมื่อเชื่อมต่อ USB" จะเก็บ WFAS ไว้ในเครือข่าย แต่จะระงับทันทีที่ลิงก์ USB ปรากฏขึ้น\n___XYZ_แยก___\nเปิดอยู่เสมอ\n___XYZ_แยก___\nปิดเมื่อเชื่อมต่อ USB\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nเมื่อปิด WFAS คุณต้องเปิดใช้งานโปรโตคอลอื่นอย่างน้อยหนึ่งรายการ หรือมีการเชื่อมต่อ USB ที่ใช้งานอยู่ เพื่อเริ่มสตรีม\n___XYZ_แยก___\nไม่มีโปรโตคอลที่ใช้ได้\n___XYZ_แยก___\nเปิดใช้งานโปรโตคอล WFAS\n___XYZ_แยก___\nเชื่อมต่อผ่าน USB\n___XYZ_แยก___\nเชื่อมต่อแบบไร้สาย
