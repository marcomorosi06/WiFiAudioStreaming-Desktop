auto_start_server=เซิร์ฟเวอร์เริ่มต้นอัตโนมัติ\n___XYZ_แยก___\nเริ่มเซิร์ฟเวอร์โดยอัตโนมัติเมื่อแอปพลิเคชันเปิดขึ้น\n___XYZ_แยก___\nโหมดเริ่มต้นอัตโนมัติ\n___XYZ_แยก___\nไคลเอนต์เริ่มต้นอัตโนมัติ\n___XYZ_แยก___\nเชื่อมต่อกับ IP ลำดับความสำคัญโดยอัตโนมัติเมื่อพร้อมใช้งานทุกๆ ~10 วินาที (คุณต้องอยู่ในหน้าการเชื่อมต่อไคลเอนต์จึงจะใช้งานได้)\n___XYZ_แยก___\nIP ลำดับความสำคัญ\n___XYZ_แยก___\nเพิ่มไอพี\n___XYZ_แยก___\nเสียงการเชื่อมต่อ\n___XYZ_แยก___\nเล่นเสียงเมื่อไคลเอนต์เชื่อมต่อกับเซิร์ฟเวอร์\n___XYZ_แยก___\nเสียงการเชื่อมต่อแบบกำหนดเอง\n___XYZ_แยก___\nไม่ได้เลือกไฟล์ (ใช้เสียงบี๊บเริ่มต้น)\n___XYZ_แยก___\nเรียกดู...\n___XYZ_แยก___\nเสียงตัดการเชื่อมต่อ\n___XYZ_แยก___\nเล่นเสียงเมื่อไคลเอนต์ยกเลิกการเชื่อมต่อจากเซิร์ฟเวอร์\n___XYZ_แยก___\nเครื่องยนต์เสียงเนทิฟ\n___XYZ_แยก___\nใช้เอ็นจิ้นเสียง C ดั้งเดิม (แนะนำ) บน Linux: PulseAudio/PipeWire ผ่าน dlopen, ปิดเสียงลำโพงอัตโนมัติ ปิดการใช้งานเพื่อถอยกลับไปใช้ FFmpeg Grabber ดั้งเดิม\n___XYZ_แยก___\nปิดเสียงลำโพงขณะสตรีมมิ่ง\n___XYZ_แยก___\nปิดเสียงการเล่นในเครื่องในขณะที่เซิร์ฟเวอร์จับภาพ เพื่อไม่ให้ได้ยินเสียงสองครั้ง ปิดเพื่อฟังต่อที่นี่และบนไคลเอนต์ เครื่องยนต์เนทิฟเท่านั้น สถานะก่อนหน้าจะถูกกู้คืนเมื่อเซิร์ฟเวอร์หยุดทำงาน CLI: --no-mute-render.\n___XYZ_แยก___\nให้เซิร์ฟเวอร์ทำงานต่อไปหลังจากตัดการเชื่อมต่อ\n___XYZ_แยก___\nในระบบยูนิคาสต์ การออกจากไคลเอ็นต์จะสิ้นสุดเซสชัน ไม่ใช่เซิร์ฟเวอร์ โดยจะทำให้พอร์ตเปิดอยู่และรอไคลเอ็นต์ถัดไป มัลติคาสต์ใช้งานได้ในลักษณะนี้แล้ว\n___XYZ_แยก___\nเส้นทางไมโครโฟนขาเข้า\n___XYZ_แยก___\nเลือกวิธีจัดการสตรีมไมโครโฟนที่ได้รับจากไคลเอนต์\n___XYZ_แยก___\nปิด\n___XYZ_แยก___\nละเว้นไมโครโฟนไคลเอนต์\n___XYZ_แยก___\nไมโครโฟนเสมือน
