native_engine_desc=Yerel C ses motorunu kullanın (önerilir). Linux'ta: dlopen aracılığıyla PulseAudio/PipeWire, hoparlörleri otomatik olarak kapatır. Eski FFmpeg yakalayıcıya geri dönmek için devre dışı bırakın.
