protocol_incompatible_body_local=Bu cihaz, uygulamanın eski bir sürümünü çalıştırıyor (WFAS protokolü v%1$d, diğer cihaz v%2$d kullanıyor), bu nedenle bağlantı kapatıldı. Bu cihazdaki uygulamayı güncelleyin.
