vcable_help_button=Bunu ayarlamak için yardıma mı ihtiyacınız var?
vcable_help_win_title=Windows — VB-CABLE Kurulumu
vcable_help_win_1=vb-audio.com/Cable adresine gidin ve VB-CABLE'ı indirin.
vcable_help_win_2=Yükleyiciyi Yönetici olarak çalıştırın, ardından bilgisayarınızı yeniden başlatın.
vcable_help_win_3=Yeniden başlattıktan sonra yukarıdaki açılır menüde "KABLO Girişi" görünecektir; onu seçin.
vcable_help_win_4=Discord, Zoom veya başka bir uygulamada Ses Ayarlarına gidin ve mikrofon olarak "KABLO Çıkışı"nı seçin.
vcable_help_win_5=Bitti! Yayınlanan ses artık bu uygulamalarda mikrofonunuz olarak görünecek.
vcable_help_win_link=Vb-audio.com/Cable'ı açın
vcable_help_linux_title=Linux — Otomatik Sanal Havuz
vcable_help_linux_1=Kurulum gerekmez. Akış başladığında, pactl aracılığıyla otomatik olarak "WFAS_VirtualMic" adlı bir sanal havuz oluşturulur.
vcable_help_linux_2=Pavucontrol'ü (PulseAudio Ses Kontrolü) veya PipeWire eşdeğerini açın.
vcable_help_linux_3="Kayıt" sekmesinde Discord/Zoom/vb.'yi ayarlayın. "WFAS_VirtualMic"ten yakalamak için.
vcable_help_linux_4=Yayınlanan ses artık bu uygulamalarda mikrofon olarak görünecek.
vcable_help_linux_link=Pavucontrol'ü yükleyin
vcable_help_mac_title=macOS — Kara Delik Kurulumu
vcable_help_mac_1=BlackHole'u (ücretsiz, açık kaynak) github.com/ExistentialAudio/BlackHole adresinden indirin.
vcable_help_mac_2=Ekrandaki talimatları izleyerek yükleyin. Yeniden başlatmaya gerek yok.
vcable_help_mac_3=Yukarıdaki açılır menüden "BlackHole 2ch" (veya 16ch) seçeneğini seçin.
vcable_help_mac_4=Sistem Ayarları → Ses bölümünde, sesi duymak ve aynı anda yönlendirmek için isteğe bağlı olarak bir Çoklu Çıkış Cihazı oluşturabilirsiniz.
vcable_help_mac_5=Discord, Zoom veya başka bir uygulamada mikrofon olarak "BlackHole 2ch"i seçin.
