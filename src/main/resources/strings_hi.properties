usb_diag_macos=कोई USB लिंक नहीं मिला. macOS में कोई अंतर्निहित RNDIS ड्राइवर नहीं है, इसलिए Android USB टेदरिंग आमतौर पर यहां काम नहीं करती है; इसके बजाय वाई-फ़ाई का उपयोग करें.
usb_diag_no_ip=USB एडाप्टर मिला (%s) लेकिन इसका कोई IP पता नहीं है। डिवाइस पर यूएसबी टेदरिंग संभवतः अभी भी बंद है।
usb_interface=यूएसबी इंटरफ़ेस
usb_interface_desc=जब तक डिटेक्शन गलत एडॉप्टर नहीं चुन लेता, तब तक ऑटो पर छोड़ दें। बिना आईपी पते वाले एडेप्टर भी सूचीबद्ध हैं, इसलिए आप लाइव ड्राइवर से पुराने ड्राइवर के बारे में बता सकते हैं।
