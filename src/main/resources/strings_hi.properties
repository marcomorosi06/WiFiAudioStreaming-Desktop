welcome_privacy_title=स्वचालित अद्यतन जाँच
welcome_privacy_desc=प्रत्येक लॉन्च पर ऐप GitHub से पूछता है कि क्या कोई नया संस्करण मौजूद है।
welcome_privacy_detail=GitHub माइक्रोसॉफ्ट के स्वामित्व वाली एक अमेरिकी कंपनी है। प्रत्येक अनुरोध आवश्यक रूप से अनुरोध के समय के साथ, उन्हें आपका आईपी पता बताता है। और कुछ नहीं भेजा गया है: कोई खाता नहीं, कोई पहचानकर्ता नहीं, कोई उपयोग डेटा नहीं। इसे बंद कर दें और ऐप कभी भी अपने आप नेटवर्क से संपर्क नहीं करेगा \u2014 आप अभी भी किसी भी समय सेटिंग्स से मैन्युअल रूप से जांच कर सकते हैं।
