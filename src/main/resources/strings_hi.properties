nr_hint=केवल शोर वाले एनालॉग प्रेषकों के लिए, जैसे कि एक माइक्रोकंट्रोलर लाइन-आउट का नमूना ले रहा है। स्वच्छ डिजिटल ऑडियो पर यह केवल कलाकृतियाँ जोड़ सकता है। यदि प्रेषक पहले से ही अपनी ओर से शोर हटा देता है तो इसका उपयोग न करें।
