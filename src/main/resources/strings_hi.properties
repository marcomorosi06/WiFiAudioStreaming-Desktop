usb_mode=USB पर स्ट्रीम करें
usb_mode_desc=वाई-फाई की जगह यूएसबी केबल का इस्तेमाल करें। एंड्रॉइड फोन पर यूएसबी टेदरिंग सक्षम करें, फिर ऐप अपने आप लिंक ढूंढ लेता है।
usb_latency=यूएसबी बफ़र (एमएस)
usb_latency_desc=यूएसबी लिंक सक्रिय होने पर ऑडियो के बजाय जिटर बफर का उपयोग किया जाता है। कम का मतलब कम विलंबता लेकिन ड्रॉपआउट का अधिक जोखिम है। कुछ डिवाइस बर्स्ट में यूएसबी पैकेट वितरित करते हैं और यहां वाई-फाई की तुलना में अधिक बफर की आवश्यकता होती है, कम नहीं।
