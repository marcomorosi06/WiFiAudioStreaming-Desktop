settings_material_hues_desc=Give each section a colour of its own (amber, green, pink, teal), on top of the theme. Off: every colour follows the theme colour.
w3u_latency_quick=Quicker
w3u_latency_steady=Steadier
latency_label_v2=Latency for v2 and RTP: %d ms (%s)
latency_v2_hint=With WFAS v3 the server sets the latency, on its card.
settings_v2_detail=Ports, packet size, USB buffer and noise reduction: only for devices still on v2.
w3_autoconnect_desc=With WFAS v3 the client goes back to the last paired server it used and keeps looking for it by itself. The address list and its timings are for WFAS v2 and come back with v2.
