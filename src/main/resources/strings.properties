# WFAS v3
w3_protocol_section=WFAS protocol
w3_v3_title=WFAS v3 (recommended)
w3_v3_desc=Devices are paired once, with a code, a QR or a PIN. Every session is encrypted and authenticated end to end, with keys that change at every connection, and nothing is announced on the network. The specification is still a draft (experimental): an external audit has not been done yet.
w3_v2_title=WFAS v2 (legacy)
w3_v2_desc=For devices that have not been updated yet. Turning it on turns v3 off.
w3_v2_enable_title=Turn on WFAS v2?
w3_v2_enable_body=WFAS v2 is the previous version of the protocol. It stays available for devices that cannot be updated yet, but it is outdated and has known weaknesses that v3 fixes:\n\n- protection is optional: without a key anyone on the network can connect, and the audio travels unencrypted;\n- with a shared key, a weak passphrase can be guessed by whoever records the traffic, and whoever obtains the key can also decrypt sessions recorded in the past;\n- the server announces itself to the whole network, and those announcements can be faked;\n- in multicast, any receiver can insert audio in the name of the server.\n\nStaying on v3 is recommended. If you turn v2 on, v3 is turned off until you switch back.
w3_v2_enable_stay=Stay on v3
