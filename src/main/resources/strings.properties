home_other_ways=Other ways to connect
home_addr_title=Connect by address
home_addr_desc=v3 first; v2 only if you say so
home_addr_note=For when a server is not found by itself. Type the IP address of the other device: if a server paired with v3 is there, it plays encrypted, as from the list above. If not, the app asks you before trying WFAS v2, which is not encrypted.
home_legacy_title=Older devices (WFAS v2)
home_legacy_desc=Only for servers that do not have v3 yet
home_legacy_found=%1$d found
home_legacy_note=These servers show up without pairing and their stream is not encrypted; the app asks you before each connection. If the other device has v3, pair it above instead: it is safer and it finds itself.
usb_v3_detail=Works with v3 and v2
usb_v3_on=On
usb_v3_how_client=The cable becomes a network link between the phone and the computer, and nothing else changes: a paired v3 server is found over the cable by itself and plays encrypted, as on Wi-Fi. Turn on USB tethering on the phone; on the computer leave the network interface on automatic.
usb_v3_how_server=The cable becomes a network link between the phone and the computer, and nothing else changes: paired clients find this server over the cable by themselves and play encrypted, as on Wi-Fi. A device paired on Wi-Fi works over the cable too.
