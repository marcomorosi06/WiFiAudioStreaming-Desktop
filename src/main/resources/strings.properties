w3_pf_cancelled=Pairing cancelled.
w3_pf_code=The codes did not match, so the pairing was stopped as a precaution. Try again; if it happens again, something on the network may be interfering.
w3_pf_race=Another device may have paired in place of this one. On the server, open the list of paired devices and remove any you do not recognise, then try again.
w3_notice_suspect_title=%1$s: pairing to be renewed
w3_notice_suspect_body=The keys of this pairing were used by another device, or the saved data was restored from an older copy. It is not a network problem. Connections with %1$s are paused as a precaution: pair it again to continue, it takes a minute.
w3_notice_forget_title=%1$s removed this pairing
w3_notice_forget_body=Remove it here too? If you keep it, it will not work until you pair again.
w3_notice_keep=Keep
w3_notice_mic_refused=The server does not allow the microphone of this device: the audio continues without it.
w3_notice_storage=The WFAS v3 keys could not be saved, so v3 stopped rather than lose them. Check the free space and the permissions of the configuration folder.
w3_fail_library=The WFAS v3 module is not available for this system.
w3_fail_selftest=The initial check of the encryption did not pass on this device, so WFAS v3 stays off as a precaution.
w3_fail_device_record=The WFAS v3 security data saved on this device cannot be read. You can reset it in the settings; the devices will then need to be paired again.
w3_fail_storage=The WFAS v3 keys could not be saved. Check the free space and the permissions of the configuration folder.
w3_fail_port=UDP port %1$d is already used by another program.
w3_fail_network=The WFAS v3 network port could not be opened.
w3_status_serving=WFAS v3 server ready: waiting for paired devices
w3_unprotected_body=WFAS v3 protects only its own stream. %s will carry the same audio without encryption and without pairing: anyone on the network can listen to it.
w3_cpair_no_camera=No webcam was found. You can type the code shown on the server instead.
w3_fail_in_use=WFAS v3 is already in use by another window or terminal of this app. Close that one, or use it.
w3_fail_store_key=The key that opens the WFAS v3 data saved on this device is missing (for example after the system keychain was reset). Nothing was overwritten: restore the key, or reset WFAS v3 in the settings and pair the devices again.
w3_script_v2_refused=WFAS v3 is on and no paired server answered at %1$s. A WFAS v2 server can be joined from the app, after a confirmation, or with WFAS v2 turned on in the settings.
w3_manual_looking=Looking for a paired server at %1$s…

