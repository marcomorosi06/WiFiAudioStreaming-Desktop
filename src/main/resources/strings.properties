w3u_delivery_title=Transmission
w3u_delivery_each=Unicast
w3u_delivery_all=Multicast
w3u_delivery_each_note=A separate stream to each device. Traffic grows with every listener; needed if clients send their microphone.
w3u_delivery_all_note=One stream shared by every device, so traffic stays the same however many listen. Clients cannot send their microphone, and some Wi-Fi routers handle multicast poorly.
w3u_delivery_locked=Multicast is required while %1$s is on.
w3u_delivery_live_all=Sending in multicast. To change it, stop and start again.
w3u_delivery_live_each=Sending in unicast. To change it, stop and start again.
