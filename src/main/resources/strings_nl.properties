welcome_privacy_detail=GitHub is een Amerikaans bedrijf dat eigendom is van Microsoft. Bij elk verzoek wordt noodzakelijkerwijs uw IP-adres aan hen bekendgemaakt, samen met het tijdstip van het verzoek. Er wordt niets anders verzonden: geen account, geen identificatie, geen gebruiksgegevens. Als je dit uitschakelt, maakt de app nooit zelf verbinding met het netwerk. Je kunt dit op elk gewenst moment nog steeds handmatig controleren via Instellingen.
