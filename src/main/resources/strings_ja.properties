auto_connect_retry_desc=切断後に再接続するまで待機する時間 (秒単位)。\n___XYZ_分割___\n鍵を尋ねる\n___XYZ_分割___\nサーバーがキーを要求した場合、このエントリは保存されていません。キー ダイアログを表示するか、そのサーバーをスキップします。デフォルトではオフ。誰も応答できないウィンドウでは無人再接続を停止できないためです。\n___XYZ_分割___\n保存されたサーバー\n___XYZ_分割___\nサーバーの追加\n___XYZ_分割___\nシステム キーリングにアクセスできないため、キーを安全に保管できません。 Linux では、「secret-tool」(libsecret パッケージ) をインストールして再起動します。\n___XYZ_分割___\n資格ストアの問題\n___XYZ_分割___\nこの問題が修正されるまで、ここに入力したキーは記憶されません。\n___XYZ_分割___\n到達可能なシステム キーリングがありません。 「secret-tool」(libsecretパッケージ)をインストールして再起動します。\n___XYZ_分割___\nこのシステムでは Windows 資格情報保護 (DPAPI) を利用できません。\n___XYZ_分割___\nmacOS キーチェーンはこのシステムでは使用できません。\n___XYZ_分割___\nこのシステムにはサポートされている資格情報ストアがありません。\n___XYZ_分割___\nシステム キーリングは応答しましたが、テスト保存は失敗しました (XYZPH0XYZ)。ロックされている可能性があります \u2014 ロックを解除して、もう一度お試しください。\n___XYZ_分割___\n住所\n___XYZ_分割___\n港\n___XYZ_分割___\nデフォルト\n___XYZ_分割___\n名前 (オプション)\n___XYZ_分割___\nキー\n___XYZ_分割___\nキーが保存されました\n___XYZ_分割___\n鍵なし\n___XYZ_分割___\nシステム資格情報ストアに保存され、config.json には保存されません\n___XYZ_分割___\n保存\n___XYZ_分割___\nキーを削除します\n___XYZ_分割___\nこのエントリを使用してください\n___XYZ_分割___\nトレイアイコンは使用できません
