snapcast_how_to_connect_auto=このネットワーク上のクライアントは独自にストリームを見つけます。そうでない場合は、以下のアドレスを指定してください。\n___XYZ_分割___\n自動検出がオフになっているため、クライアントはこのアドレスを明示的に指定する必要があります。\n___XYZ_分割___\nSnapcast モバイル アプリで、IP によってサーバーを追加します。ホーム アシスタントでは、このホストおよび制御ポートとのスナップキャスト統合を使用します。\n___XYZ_分割___\n鍵を覚えておいてください\n___XYZ_分割___\nシステムによって暗号化されて、XYZPH0XYZ に保存されます。\n___XYZ_分割___\n保存されません: 開始するたびに再度尋ねられます。\n___XYZ_分割___\nこのシステムには認証情報ストアがないため、キーは保存されません。起動するたびにキーを入力するか、WFAS_AUTH_KEY を設定してください。\n___XYZ_分割___\n自動開始まで待機しています...\n___XYZ_分割___\nネットワークを待っています...\n___XYZ_分割___\n自動開始がキャンセルされました: 60 秒後にローカル アドレスがありません\n___XYZ_分割___\n自動開始がキャンセルされました: セキュリティはキーに設定されていますが、キーは保存されていません\n___XYZ_分割___\n開始遅延\n___XYZ_分割___\nサーバーが起動するまでに待機する秒数。ログイン時にはネットワークの準備が整っていないことが多く、アドレスなしで起動したサーバーは誰も見つけられないことになります。\n___XYZ_分割___\nネットワークを待つ\n___XYZ_分割___\nこのマシンが使用可能なローカル アドレスを取得するまで、最長 1 分間自動起動を保留します。\n___XYZ_分割___\n開始ボリューム\n___XYZ_分割___\nサーバーの自動起動時に適用されるボリューム。現在のものを保持するには、オフのままにします。\n___XYZ_分割___\n自動起動セキュリティ\n___XYZ_分割___\n自動的に起動されるサーバーのセキュリティ モード。 「継承」では一般設定を使用します。キーには保存された事前共有キーが必要です。\n___XYZ_分割___\n継承する\n___XYZ_分割___\nXYZPH0XYZ に自動接続中...\n___XYZ_分割___\nXYZPH0XYZ はスキップされました: 保存されたキーは使用できません\n___XYZ_分割___\nスキャン間隔\n___XYZ_分割___\nリストがチェックされる頻度 (秒単位)。\n___XYZ_分割___\n再試行遅延
