usb_diag_macos=USB リンクが見つかりません。 macOS には RNDIS ドライバーが組み込まれていないため、Android USB テザリングは通常、ここでは機能しません。代わりに Wi-Fi を使用してください。\n___XYZ_分割___\nUSB アダプター (XYZPH0XYZ) が見つかりましたが、IP アドレスがありません。 USB テザリングがデバイスでまだオフになっている可能性があります。\n___XYZ_分割___\nUSBインターフェース\n___XYZ_分割___\n検出で間違ったアダプターが選択されない限り、[自動] のままにしておきます。 IP アドレスのないアダプターもリストされるため、古いドライバーと有効なドライバーを区別できます。\n___XYZ_分割___\n自動\n___XYZ_分割___\nXYZPH0XYZ (IPなし)\n___XYZ_分割___\nUSB経由で送信\n___XYZ_分割___\nWi-Fi の代わりにケーブル経由で電話にストリーミングします。\n___XYZ_分割___\nUSB経由で受信する\n___XYZ_分割___\nWi-Fi ではなくケーブル経由で電話を聞きます。\n___XYZ_分割___\nこのケーブル上のデバイスは、USB とマークされたリストに表示されます。\n___XYZ_分割___\n電話機を接続し、USB テザリングを有効にします。\n___XYZ_分割___\nケーブルは認識されています。デバイスで USB テザリングをオンにして、アドレスを配布します。\n___XYZ_分割___\nUSB\n___XYZ_分割___\nWi-Fi\n___XYZ_分割___\nWFAS の利用可能性\n___XYZ_分割___\nこのデバイスがネイティブ WFAS プロトコルを提供する場合を選択します。 「USB 接続時はオフ」にすると、WFAS はネットワーク上に維持されますが、USB リンクが確立されるとすぐに抑制されます。\n___XYZ_分割___\n常時オン\n___XYZ_分割___\nUSB接続時は消灯\n___XYZ_分割___\nオフ\n___XYZ_分割___\nWFAS がオフの場合、ストリームを開始するには、少なくとも 1 つの他のプロトコルを有効にするか、アクティブな USB 接続が必要です。\n___XYZ_分割___\n利用可能なプロトコルがありません\n___XYZ_分割___\nWFAS プロトコルを有効にする\n___XYZ_分割___\nUSB経由で接続\n___XYZ_分割___\nワイヤレス接続
