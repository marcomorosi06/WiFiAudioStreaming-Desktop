snapcast_codec_label=Codec
snapcast_codec_pcm_desc=非圧縮。 48 kHz ステレオでクライアントあたり約 1.5 Mbps、エンコード遅延なし。\n___XYZ_分割___\n可逆圧縮。帯域幅がおよそ半分になり、約 25 ミリ秒のエンコード遅延が追加されます。\n___XYZ_分割___\n損失が多く、帯域幅が最低です。 48000 Hz ステレオ 16 ビット入力が必要です。\n___XYZ_分割___\nOpus には 48000 Hz のステレオが必要です。現在のオーディオ設定では、サーバーは PCM に戻ります。\n___XYZ_分割___\nチャンクサイズ\n___XYZ_分割___\nクライアントバッファ (ミリ秒)\n___XYZ_分割___\nクライアントがどれだけ先に再生をスケジュールするか。値が大きいほど堅牢性が高く、値が小さいほど応答性が高くなります。\n___XYZ_分割___\nストリーム名\n___XYZ_分割___\nサーバーを起動して、mDNS 経由でストリームをアドバタイズします。クライアントはそれを自動的に検出します。\n___XYZ_分割___\nXYZPH0XYZ はここでは利用できません。代わりに XYZPH1XYZ としてストリーミングします\n___XYZ_分割___\nXYZPH0XYZ (XYZPH1XYZ) を XYZPH2XYZ クライアントに提供し、XYZPH3XYZ 制御接続を提供します\n___XYZ_分割___\nXYZPH0XYZ - ボリューム XYZPH1XYZ%%、レイテンシー XYZPH2XYZ ミリ秒\n___XYZ_分割___\nオンライン\n___XYZ_分割___\nオフライン\n___XYZ_分割___\nスナップキャスト マルチルーム\n___XYZ_分割___\nXYZPH0XYZ クライアントが同期して再生しています\n___XYZ_分割___\nストリーム\n___XYZ_分割___\n制御\n___XYZ_分割___\nコーデック\n___XYZ_分割___\n発見\n___XYZ_分割___\nmDNS 経由でアドバタイズされる\n___XYZ_分割___\nアドバタイズされていません - 手動で接続します\n___XYZ_分割___\nポート XYZPH0XYZ は使用できません\n___XYZ_分割___\nポートを開けませんでした: XYZPH0XYZ。別のスナップキャスト サーバーがすでに実行されているか、ファイアウォールによってブロックされている可能性があります。\n___XYZ_分割___\n接続方法
