fw_title=Windows ファイアウォールの通過を許可する\n___XYZ_分割___\nルールがアクティブです\n___XYZ_分割___\n未設定\n___XYZ_分割___\nデバイスが接続できず「待機中」のままの場合は、これらの UDP ポートでの受信トラフィックを許可します。管理者の承認が一度必要です。\n___XYZ_分割___\nUDPポート\n___XYZ_分割___\nファイアウォールの通過を許可する\n___XYZ_分割___\nこのシステムでは firewalld がアクティブです\n___XYZ_分割___\nこのシステムでは ufw がアクティブです\n___XYZ_分割___\nデバイスが接続できず「待機中」のままの場合、これらのポート上の受信 UDP がブロックされている可能性があります。ターミナルで以下のコマンドを実行します。\n___XYZ_分割___\nコピーコマンド\n___XYZ_分割___\n許可する\n___XYZ_分割___\nファイアウォールが更新されました\n___XYZ_分割___\n選択したポートで受信 UDP が許可されるようになりました。デバイスは接続できるはずです。\n___XYZ_分割___\n適用されません\n___XYZ_分割___\n変更には管理者の承認が必要です。もう一度「許可」をクリックし、Windows プロンプトを受け入れます。\n___XYZ_分割___\nエラー\n___XYZ_分割___\nこの機能は Windows でのみ使用できます。\n___XYZ_分割___\n起動とウィンドウ\n___XYZ_分割___\n音\n___XYZ_分割___\nシステム\n___XYZ_分割___\n情報\n___XYZ_分割___\nウェブサイトからダウンロード\n___XYZ_分割___\nGitHubからダウンロード\n___XYZ_分割___\n自動アップデートチェック\n___XYZ_分割___\nアプリは起動するたびに、新しいバージョンが存在するかどうかを GitHub に問い合わせます。
