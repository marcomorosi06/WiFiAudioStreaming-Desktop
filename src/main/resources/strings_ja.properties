connect_panel_hint=他のデバイスのアプリにこのアドレスを入力するか、QR コードをスキャンしてください\n___XYZ_分割___\nWFAS（アプリ）\n___XYZ_分割___\nRTP (VLC、ffplay)\n___XYZ_分割___\nブラウザ\n___XYZ_分割___\nDLNAレンダラー\n___XYZ_分割___\nUSBケーブル\n___XYZ_分割___\nスナップキャストクライアント\n___XYZ_分割___\n音声フォーマット\n___XYZ_分割___\nXYZPH0XYZが見つかりました\n___XYZ_分割___\nコピーされました\n___XYZ_分割___\nスペクトル\n___XYZ_分割___\n溝 XYZPH0XYZ\n___XYZ_分割___\nセッション\n___XYZ_分割___\n出力デバイス\n___XYZ_分割___\n輸送\n___XYZ_分割___\n暗号化\n___XYZ_分割___\nマイク\n___XYZ_分割___\n暗号化 (ChaCha20-Poly1305)\n___XYZ_分割___\n暗号化されていません\n___XYZ_分割___\n共有されていません\n___XYZ_分割___\nスナップキャストサーバー（マルチルーム）\n___XYZ_分割___\n同期されたオーディオを任意のスナップクライアントに提供: Raspberry Pi、ESP32、ホーム アシスタント、スナップキャスト モバイル アプリ\n___XYZ_分割___\nストリームポート\n___XYZ_分割___\n制御ポート\n___XYZ_分割___\nコーデック
