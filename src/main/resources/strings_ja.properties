qr_pairing_self_body=この招待は同じデバイスによって生成されたものであるため、接続するものはありません。音声を受信するデバイスからスキャンします。\n___XYZ_分割___\n分かりました\n___XYZ_分割___\nこれはあなた自身のコードです\n___XYZ_分割___\n他のデバイスがこの招待を拒否しました。おそらく新しいものに置き換えられたか、グループキーが再生成されたと考えられます。新しいコードを要求してください。\n___XYZ_分割___\n新しいコードをスキャンします\n___XYZ_分割___\n閉じる\n___XYZ_分割___\n招待は無効になりました\n___XYZ_分割___\nキーを再生成する\n___XYZ_分割___\nQRをスキャン\n___XYZ_分割___\nスキャナーを閉じる\n___XYZ_分割___\nその招待は有効期限が切れています。新鮮なものを求めてください。\n___XYZ_分割___\n招待が見つかりました\n___XYZ_分割___\n他のデバイスに表示された QR コードにカメラを向けます。\n___XYZ_分割___\nえーっと…スキャンしてほしいですか？それは WFAS の QR コードではありません。\n___XYZ_分割___\n招待コードをスキャンします\n___XYZ_分割___\nトーチ\n___XYZ_分割___\nQRコード\n___XYZ_分割___\n招待ごとにランダムなキーを自動的に生成します。手動で選択したパスワードよりも安全です。パスワードを覚えたり、大声で言ったりする必要はありません。\n___XYZ_分割___\nキーが自動的に生成される\n___XYZ_分割___\nキー モードでは、キーを空にすることはできません。 [セキュリティ] でいずれかを入力するか、QR コードに切り替えて生成させます。\n___XYZ_分割___\nキーがありません\n___XYZ_分割___\n送信者によって変更されたグループキー\n___XYZ_分割___\nマルチキャスト グループでは送信できません: XYZPH0XYZ\n___XYZ_分割___\n接続\n___XYZ_分割___\n接続方法
