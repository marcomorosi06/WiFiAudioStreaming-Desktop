protocol_dlna_title=DLNA / UPnP レンダラー\n___XYZ_分割___\nオーディオを AV レシーバー、サウンドバー、スマート TV にプッシュ - アプリは不要\n___XYZ_分割___\nDLNAメディアポート\n___XYZ_分割___\nレンダラーが接続し直す TCP ポート。レンダラーからアクセス可能である必要があります。\n___XYZ_分割___\n音声フォーマット\n___XYZ_分割___\n自動 (交渉による)\n___XYZ_分割___\n各レンダラが何をサポートしているかを尋ね、最適なものを選択します。推奨。\n___XYZ_分割___\n非圧縮 16 ビット PCM、約 1.4 Mbps。最小の遅延、最も幅広い互換性。\n___XYZ_分割___\nストリーミング WAV ヘッダー内の非圧縮 PCM。一部の古いファームウェアをサポートします。\n___XYZ_分割___\n圧縮、最大 320 kbps。ネットワークが遅い場合やWi-Fiが混雑している場合にご利用ください。\n___XYZ_分割___\n圧縮されたAAC。効率的ですが、レンダラーのサポートが最も一貫性が低くなります。\n___XYZ_分割___\nネットワーク上のレンダラー\n___XYZ_分割___\n再スキャン\n___XYZ_分割___\nレンダラーを検索しています…\n___XYZ_分割___\nDLNA レンダラーが見つかりません。デバイスが同じネットワーク上にあることを確認してください。\n___XYZ_分割___\n選択したレンダラーは記憶され、ストリーミングの開始時に自動的に再接続されます。\n___XYZ_分割___\nオフライン\n___XYZ_分割___\nフォールバック\n___XYZ_分割___\n遊ぶ\n___XYZ_分割___\n接続中…\n___XYZ_分割___\n再試行中…\n___XYZ_分割___\nハンドシェイクが失敗しました\n___XYZ_分割___\nコピー診断\n___XYZ_分割___\n選択をクリア\n___XYZ_分割___\nそして
