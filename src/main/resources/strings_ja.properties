vcable_help_button=Need help setting this up?
vcable_help_win_title=Windows — VB-CABLE Setup
vcable_help_win_1=Go to vb-audio.com/Cable and download VB-CABLE.
vcable_help_win_2=Run the installer as Administrator, then restart your PC.
vcable_help_win_3=After restarting, "CABLE Input" will appear in the dropdown above — select it.
vcable_help_win_4=In Discord, Zoom or any other app, go to Audio Settings and choose "CABLE Output" as the microphone.
vcable_help_win_5=Done! The streamed audio will now appear as your microphone in those apps.
vcable_help_win_link=Open vb-audio.com/Cable
vcable_help_linux_title=Linux — Automatic Virtual Sink
vcable_help_linux_1=No installation needed. When streaming starts, a virtual sink called "WFAS_VirtualMic" is created automatically via pactl.
vcable_help_linux_2=Open pavucontrol (PulseAudio Volume Control) or a PipeWire equivalent.
vcable_help_linux_3=In the "Recording" tab, set Discord/Zoom/etc. to capture from "WFAS_VirtualMic".
vcable_help_linux_4=ストリーミングされたオーディオは、これらのアプリでマイクとして表示されるようになります。\n___XYZ_分割___\npavucontrol をインストールする\n___XYZ_分割___\nmacOS — ブラックホールのセットアップ\n___XYZ_分割___\nBlackHole (無料、オープンソース) を github.com/ExistentialAudio/BlackHole からダウンロードします。\n___XYZ_分割___\n画面の指示に従ってインストールしてください。再起動は必要ありません。\n___XYZ_分割___\n上のドロップダウンで「BlackHole 2ch」(または16ch)を選択します。\n___XYZ_分割___\n[システム設定] → [サウンド] で、オプションでマルチ出力デバイスを作成して、オーディオを聞き、同時にルーティングすることができます。\n___XYZ_分割___\nDiscord、Zoom、またはその他のアプリで、マイクとして「BlackHole 2ch」を選択します。\n___XYZ_分割___\nGitHub で BlackHole を開く\n___XYZ_分割___\nトレイに最小化して開始\n___XYZ_分割___\nシステムトレイに隠れているアプリを起動します。 Launch at Startup と組み合わせると、AirPlay/Chromecast のように動作します。いつでも利用でき、邪魔になることはありません。\n___XYZ_分割___\nトレイに近い\n___XYZ_分割___\nウィンドウを閉じるときは、終了せずにシステム トレイに最小化します。完全に終了するには、トレイ アイコンを右クリックします。\n___XYZ_分割___\nショーウィンドウ\n___XYZ_分割___\nトレイに隠す\n___XYZ_分割___\nやめる\n___XYZ_分割___\nバックグラウンドで実行中。トレイアイコンを右クリックして終了します。\n___XYZ_分割___\nダークアイコン（ライトパネル）を使用する\n___XYZ_分割___\nライトアイコンを使用する(ダークパネル)\n___XYZ_分割___\nWiFi オーディオ ストリーミングへようこそ!\n___XYZ_分割___\nアプリをインストールしていただきありがとうございます。始めるために必要なものはすべてここにあります。\n___XYZ_分割___\nAndroid アプリを入手\n___XYZ_分割___\nコンパニオン Android アプリをインストールして、携帯電話またはタブレットで音声を受信します。無料でオープンソース。\n___XYZ_分割___\nGitHub でダウンロード\n___XYZ_分割___\nターミナルから利用する
