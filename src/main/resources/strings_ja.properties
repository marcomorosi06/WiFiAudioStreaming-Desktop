auto_start_server=自動起動サーバー\n___XYZ_分割___\nアプリケーションを開いたときにサーバーを自動的に起動する\n___XYZ_分割___\nオートスタートモード\n___XYZ_分割___\n自動起動クライアント\n___XYZ_分割___\n優先 IP が利用可能になった場合、約 10 秒ごとに自動的に接続します (機能するには、クライアント接続ページにアクセスする必要があります)\n___XYZ_分割___\n優先IP\n___XYZ_分割___\nIPの追加\n___XYZ_分割___\n接続音\n___XYZ_分割___\nクライアントがサーバーに接続するときにサウンドを再生する\n___XYZ_分割___\nカスタム接続音\n___XYZ_分割___\nファイルが選択されていません (デフォルトのビープ音を使用)\n___XYZ_分割___\n閲覧...\n___XYZ_分割___\n切断音\n___XYZ_分割___\nクライアントがサーバーから切断されたときにサウンドを再生する\n___XYZ_分割___\nネイティブオーディオエンジン\n___XYZ_分割___\nネイティブ C オーディオ エンジンを使用します (推奨)。 Linux の場合: dlopen 経由の PulseAudio/PipeWire、スピーカーを自動ミュートします。従来の FFmpeg グラバーにフォールバックするには無効にします。\n___XYZ_分割___\nストリーミング中にスピーカーをミュートする\n___XYZ_分割___\nサーバーがローカル再生をキャプチャしている間、ローカル再生を無音にし、音声が 2 回聞こえないようにします。ここでもクライアントでも聞き続けるには、オフにします。ネイティブエンジンのみ。サーバーが停止すると、以前の状態が復元されます。 CLI: --no-mute-render。\n___XYZ_分割___\n切断後もサーバーを実行し続ける\n___XYZ_分割___\nユニキャストでは、クライアントが終了すると、サーバーではなくセッションが終了します。サーバーはポートを開いたままにし、次のクライアントを待ちます。マルチキャストはすでにこのように機能しています。\n___XYZ_分割___\n受信マイクのルーティング\n___XYZ_分割___\nクライアントから受信したマイク ストリームの処理方法を選択します\n___XYZ_分割___\nオフ\n___XYZ_分割___\nクライアントのマイクを無視する\n___XYZ_分割___\n仮想マイク
