mic_routing_virtual=Virtual microphone
mic_routing_virtual_desc=マイクを仮想入力デバイスとして他のアプリ (Discord、Zoom...) に公開します。\n___XYZ_分割___\n流れに混ぜる\n___XYZ_分割___\nクライアントに送り返されるオーディオ ストリームにマイクをブレンドします\n___XYZ_分割___\n「WFAS_VirtualMic」という名前の仮想シンクが pactl 経由で自動的に作成されます\n___XYZ_分割___\n検出された仮想ケーブル: XYZPH0XYZ\n___XYZ_分割___\n仮想ケーブルが検出されませんでした。 VB-CABLE (Windows) または BlackHole/Loopback (macOS) をインストールするか、デバイスを手動で選択します\n___XYZ_分割___\nマイク用の出力デバイス\n___XYZ_分割___\nマイクは送信オーディオ ストリームに直接ミックスされます。\n___XYZ_分割___\nマイクの共有はユニキャスト モードでのみサポートされます。マルチキャスト/RTPを無効にして使用してください。\n___XYZ_分割___\n仮想マイクはユニキャスト モードでのみ使用できます。ストリームへのミックスはマルチキャストでも機能します。\n___XYZ_分割___\nマイクがミュートされました\n___XYZ_分割___\nマイクがアクティブです\n___XYZ_分割___\nマイク入力デバイス\n___XYZ_分割___\n設定に関してサポートが必要ですか?\n___XYZ_分割___\nWindows — VB-CABLE セットアップ\n___XYZ_分割___\nvb-audio.com/Cable にアクセスし、VB-CABLE をダウンロードします。\n___XYZ_分割___\n管理者としてインストーラーを実行し、PC を再起動します。\n___XYZ_分割___\n再起動後、上のドロップダウンに「CABLE Input」が表示されますので、それを選択します。\n___XYZ_分割___\nDiscord、Zoom、またはその他のアプリで、オーディオ設定に移動し、マイクとして「ケーブル出力」を選択します。\n___XYZ_分割___\n完了！ストリーミングされたオーディオがこれらのアプリのマイクとして表示されるようになります。\n___XYZ_分割___\nvb-audio.com/Cable を開く\n___XYZ_分割___\nLinux — 自動仮想シンク\n___XYZ_分割___\nインストールは必要ありません。ストリーミングが開始されると、pactl によって「WFAS_VirtualMic」という仮想シンクが自動的に作成されます。\n___XYZ_分割___\npavucontrol (PulseAudio Volume Control) または PipeWire 同等のものを開きます。\n___XYZ_分割___\n「録画」タブでDiscord/Zoomなどの設定を行います。 「WFAS_VirtualMic」からキャプチャします。
