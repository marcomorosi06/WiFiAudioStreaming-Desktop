welcome_privacy_desc=On every launch the app asks GitHub whether a newer version exists.
welcome_privacy_detail=GitHub は Microsoft が所有する米国の企業です。すべてのリクエストでは、リクエストの時刻とともに、必ずあなたの IP アドレスが相手に明らかになります。他には何も送信されません。アカウント、識別子、使用状況データは送信されません。これをオフにすると、アプリが独自にネットワークに接続することはなくなります。いつでも [設定] から手動で確認できます。\n___XYZ_分割___\n起動するたびにオン7をチェックします\n___XYZ_分割___\nオフ7では、アプリは GitHub に接続しません\n___XYZ_分割___\nさらに詳しく\n___XYZ_分割___\n詳細が少ない\n___XYZ_分割___\nbuild.gradle で何をしたかわかります。\n___XYZ_分割___\n自分のローカル ファイルをハッキングしているところを見てください。自分に誇りを持っていますか？ ;)\n___XYZ_分割___\nこのストリームを再生できません: サーバーは XYZPH0XYZ を送信しますが、この出力デバイスはこれをサポートしていません。\n___XYZ_分割___\n開発者\n___XYZ_分割___\n開発者向け機能\n___XYZ_分割___\n高度な実験的なオプションを表示する\n___XYZ_分割___\nノイズリダクション\n___XYZ_分割___\nアナログソースから主電源のハムやヒスノイズを除去します\n___XYZ_分割___\n強さ: XYZPH0XYZ%%\n___XYZ_分割___\nライン出力をサンプリングするマイクロコントローラーなど、ノイズの多いアナログ送信機のみ。クリーンなデジタルオーディオでは、アーティファクトのみを追加できます。送信側ですでにノイズを除去している場合は使用しないでください。\n___XYZ_分割___\nそのサーバーはすでに別のデバイスにストリーミングしています。\n___XYZ_分割___\nUSBリンク\n___XYZ_分割___\nUSB経由でストリーミング\n___XYZ_分割___\nWi-Fi の代わりに USB ケーブルを使用します。 Android スマートフォンで USB テザリングを有効にすると、アプリが独自にリンクを見つけます。\n___XYZ_分割___\nUSBバッファ(ミリ秒)\n___XYZ_分割___\nUSB リンクがアクティブな間、オーディオ バッファーの代わりに使用されるジッター バッファー。低いほど遅延は少なくなりますが、ドロップアウトのリスクが高くなります。一部のデバイスは USB パケットをバーストで配信するため、Wi-Fi 経由よりも多くのバッファを必要とします。\n___XYZ_分割___\nUSBモードがオフになっています。\n___XYZ_分割___\nUSB リンクがアクティブ: XYZPH0XYZ (XYZPH0XYZ)\n___XYZ_分割___\nUSB リンクが見つかりません。電話機を接続し、USB テザリングを有効にします。\n___XYZ_分割___\nUSB リンクが見つかりません。電話機を接続し、USB テザリングを有効にします。
