tray_unavailable_title=Tray icon unavailable
tray_unavailable_desc=ウィンドウをトレイに隠すことはできないため、ウィンドウを閉じるとアプリが終了します。\n___XYZ_分割___\n自動開始暗号化\n___XYZ_分割___\n自動起動したサーバーの音声を暗号化します。この 2 つは異なる瞬間に使用されるため、一般的な設定とは別にします。参加セッションは検査のために平文のままにすることができますが、自動的に開始され何時間も実行されるセッションは暗号化する価値があります。\n___XYZ_分割___\n暗号化された\n___XYZ_分割___\n暗号化されていません\n___XYZ_分割___\n現在、継承とは暗号化を意味します。\n___XYZ_分割___\n現在、「継承」は暗号化されていないことを意味します。\n___XYZ_分割___\nキャプチャしていません\n___XYZ_分割___\nマイク\n___XYZ_分割___\nシステムオーディオ\n___XYZ_分割___\nマイクとシステムオーディオ\n___XYZ_分割___\nシステム出力 (ループバック)\n___XYZ_分割___\n流れに混じる\n___XYZ_分割___\nポート XYZPH0XYZ のリスナー\n___XYZ_分割___\nただいまキャプチャ中\n___XYZ_分割___\nキャプチャログを開く\n___XYZ_分割___\n音量を100%にリセット\n___XYZ_分割___\n100% を超えるとデジタル ゲインになります。大音量のパッセージはクリップされます。
auto_start_encryption_title=Auto-start Encryption
auto_start_encryption_desc=Encrypt the audio of the automatically started server. Separate from the general setting, because the two serve different moments: an attended session can stay in the clear for inspection, while one that starts by itself and runs for hours is worth encrypting.
