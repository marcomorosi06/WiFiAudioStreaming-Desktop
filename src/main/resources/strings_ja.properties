http_codec_aac_desc=AAC?遅延が長くなります。 Safari、iOS、すべてのブラウザ。 Opus クライアントが失敗した場合に使用します。\n___XYZ_分割___\nRTP/PCM ストリームがアクティブです\n___XYZ_分割___\nVLC または FFplay で聴くために SDP ファイルをコピーまたは保存します\n___XYZ_分割___\nSDPのコピー\n___XYZ_分割___\nSDPをファイルに保存\n___XYZ_分割___\nネットワークインターフェース (ディスカバリーおよびマルチキャスト)\n___XYZ_分割___\nVPN (ZeroTier、Tailscale など) を使用している場合は、ここでその仮想アダプターを選択して、デバイスが相互に検出できるようにします。\n___XYZ_分割___\nRTP ストリームが有効な場合、マルチキャストが強制されます。\n___XYZ_分割___\nHTTP ストリームが有効な場合、マルチキャストが強制されます。\n___XYZ_分割___\nマルチキャストは、RTP または HTTP ストリームが有効な場合に強制されます。\n___XYZ_分割___\nマルチキャストはアクティブなプロトコルには必須です。\n___XYZ_分割___\nコーヒーを買ってきて\n___XYZ_分割___\nこのアプリが気に入ったら、コーヒーを買ってきてください! \u2615\n___XYZ_分割___\nライセンス\n___XYZ_分割___\nEUPL v1.2 \u2014 \u00a9 マルコ・モロシ\n___XYZ_分割___\nこのプロジェクトは、欧州連合パブリックライセンス v1.2 に基づいてライセンスされています。すべての知的財産はマルコ モロシに帰属します。このライセンスは、同じライセンスを保持している限り、たとえ変更された形式であっても、ソフトウェアを使用、研究、変更、再配布する権利を付与します。\n___XYZ_分割___\nEUPL v1.2 の全文を読む\n___XYZ_分割___\nブラウザでeupl.euを開きます\n___XYZ_分割___\nオープンソースライセンス\n___XYZ_分割___\nサードパーティのソフトウェアとそのライセンス\n___XYZ_分割___\nオープンソースライセンス\n___XYZ_分割___\n注: Web ブラウザでは HTTP ストリームの内部バッファリングが強制されるため、必然的に 1 ～ 3 秒の遅延が発生します。これは正常なことであり、回避することはできません。\n___XYZ_分割___\nLinux 自動起動設定\n___XYZ_分割___\n起動時に起動\n___XYZ_分割___\nログイン時にアプリケーションを自動的に起動する
