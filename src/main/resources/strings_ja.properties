welcome_cli_body=wfas コマンドを使用して、任意の端末からアプリを制御できます。以下をクリックして、今すぐ PATH に追加してください。\n___XYZ_分割___\nwfasをPATHに追加\n___XYZ_分割___\n始めましょう\n___XYZ_分割___\nインストールしてくれてありがとう！\n___XYZ_分割___\nヒント: 簡単にアクセスできるように、wfas を PATH に追加します。\n___XYZ_分割___\nGUI アプリを実行 > [設定] > [CLI コマンド] > [インストール]\n___XYZ_分割___\nCLI コマンド (wfas)\n___XYZ_分割___\nwfasをPATHにインストールする\n___XYZ_分割___\nwfas コマンドをシステム PATH に追加して、どの端末からでも実行できるようにします。アプリを移動してパスを更新する場合は、再度実行します。\n___XYZ_分割___\nwfas がインストールされ、最新の状態になっている\n___XYZ_分割___\nインストールされていません\n___XYZ_分割___\nインストール\n___XYZ_分割___\nパスを更新する\n___XYZ_分割___\nインストール済み\n___XYZ_分割___\nこれで、wfas コマンドが PATH で使用できるようになります。新しいターミナルを開いて使用します。\n___XYZ_分割___\nターミナルがオープンされました\n___XYZ_分割___\n管理者権限でインストールを完了するためにターミナル ウィンドウが開きました。閉じたら、新しいターミナルを開いて次を実行します: wfas --help\n___XYZ_分割___\nインストールに失敗しました\n___XYZ_分割___\nようこそ画面を表示する\n___XYZ_分割___\nすべての設定をリセット\n___XYZ_分割___\nすべての設定をインストール時のデフォルトに戻す\n___XYZ_分割___\nすべての設定をリセットしますか?\n___XYZ_分割___\nこれにより、すべての設定がデフォルト値に復元されます。この操作は元に戻すことができません。\n___XYZ_分割___\nリセット\n___XYZ_分割___\nファイアウォール
