server_silent_title=他のデバイスが応答していません\n___XYZ_分割___\n「XYZPH0XYZ」は接続要求に応答しませんでした。最も可能性の高い理由は、古いバージョンのアプリが実行されており、このバージョンと通信できないためです。そのデバイス上のアプリを更新してください。それ以外の場合は、ファイアウォールがポートをブロックしていないかどうかを確認してください。\n___XYZ_分割___\n他のデバイスにはアップデートが必要です\n___XYZ_分割___\nこのデバイスにはアップデートが必要です\n___XYZ_分割___\n2 つのアプリは、互換性のない WFAS プロトコル バージョンを実行しています (このデバイス: vXYZPH0XYZ、もう一方の端: vXYZPH1XYZ)。接続が閉じられました。両方のデバイスで最新バージョンが実行されるように更新してください。\n___XYZ_分割___\n送信しているデバイスは古いバージョンのアプリ (WFAS プロトコル vXYZPH0XYZ、このデバイスは vXYZPH1XYZ を使用します) を実行しているため、接続が閉じられました。送信側デバイスのアプリを更新します。\n___XYZ_分割___\n受信しているデバイスは古いバージョンのアプリ (WFAS プロトコル vXYZPH0XYZ、このデバイスは vXYZPH1XYZ を使用します) を実行しているため、接続が閉じられました。受信側デバイスのアプリを更新します。\n___XYZ_分割___\nこのデバイスは古いバージョンのアプリ (WFAS プロトコル vXYZPH0XYZ、他のデバイスは vXYZPH1XYZ を使用) を実行しているため、接続が閉じられました。このデバイスのアプリを更新します。\n___XYZ_分割___\nダウンロードを開く\n___XYZ_分割___\nウェブサイトからダウンロード\n___XYZ_分割___\nウェブサイトからダウンロード\n___XYZ_分割___\nGitHub で開く\n___XYZ_分割___\nポート XYZPH0XYZ でマルチキャスト ストリーミングがアクティブです\n___XYZ_分割___\nポート XYZPH0XYZ で待機しているサーバー\n___XYZ_分割___\nクライアント接続、XYZPH0XYZ へのストリーミング\n___XYZ_分割___\nXYZPH0XYZのサーバーに接続しています\n___XYZ_分割___\nサーバーの確認を待っています...\n___XYZ_分割___\nつながりました！ XYZPH0XYZからストリーミング中\n___XYZ_分割___\nポート XYZPH0XYZ でマルチキャスト ストリームに参加しています\n___XYZ_分割___\nストリーミングアクティブ\n___XYZ_分割___\nストリーミングの準備ができました\n___XYZ_分割___\n接続待ち\n___XYZ_分割___\n「サーバーの開始」を押して開始してください\n___XYZ_分割___\n以下のリストからサーバーを選択してください\n___XYZ_分割___\nサーバーの起動
