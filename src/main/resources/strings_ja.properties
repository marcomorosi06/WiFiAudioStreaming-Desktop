qr_pairing_deeplink_confirm_body_multicast=マルチキャスト受信用の WFAS 招待が検出されました。今すぐ接続しますか?\n___XYZ_分割___\nそのデバイスからのストリーミングに対する WFAS 招待が検出されました。今すぐ接続しますか?\n___XYZ_分割___\n接続する\n___XYZ_分割___\n無視する\n___XYZ_分割___\nこのデバイスは現在送信中です。接続すると送信が停止します。\n___XYZ_分割___\nXYZPH0XYZに接続しますか?\n___XYZ_分割___\nこのマルチキャスト グループのキーは、コードが生成された後に更新されました。ブロードキャスト デバイスに新しい招待を要求します。\n___XYZ_分割___\n分かりました\n___XYZ_分割___\nこのグループは変わりました\n___XYZ_分割___\nこのコードはセキュリティ上の理由から無効になりました。続行するには、新しい招待を生成します。\n___XYZ_分割___\n新しいコードを生成する\n___XYZ_分割___\n閉じる\n___XYZ_分割___\nQRコードの有効期限が切れました\n___XYZ_分割___\nスキャンされたコードは有効な WFAS 招待ではありません。他のデバイスによって生成されたコードをスキャンしていることを確認してください。\n___XYZ_分割___\nキャンセル\n___XYZ_分割___\nもう一度試してください\n___XYZ_分割___\nコードが認識されない\n___XYZ_分割___\nWebカメラが検出されませんでした。アドレスとキーを手動で入力することもできます。\n___XYZ_分割___\n閉じる\n___XYZ_分割___\n手動で入力\n___XYZ_分割___\nカメラが使用できません\n___XYZ_分割___\n接続されているすべてのデバイスは再度ペアリングする必要があります。未承認のデバイスが現在のキーを知っていると思われる場合は、このオプションを使用します。\n___XYZ_分割___\nキャンセル\n___XYZ_分割___\n再生する\n___XYZ_分割___\nグループキーを再生成しますか?
