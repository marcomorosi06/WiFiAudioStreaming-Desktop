vcable_help_button=Precisa de ajuda para configurar isso?
vcable_help_win_title=Windows - Configuração do VB-CABLE
vcable_help_win_1=Acesse vb-audio.com/Cable e baixe VB-CABLE.
vcable_help_win_2=Execute o instalador como Administrador e reinicie o PC.
vcable_help_win_3=Após reiniciar, "CABLE Input" aparecerá no menu suspenso acima - selecione-o.
vcable_help_win_4=No Discord, Zoom ou qualquer outro aplicativo, vá em Configurações de áudio e escolha “Saída de cabo” como microfone.
vcable_help_win_5=Pronto! O áudio transmitido agora aparecerá como seu microfone nesses aplicativos.
vcable_help_win_link=Abra vb-audio.com/Cable
vcable_help_linux_title=Linux – coletor virtual automático
vcable_help_linux_1=Nenhuma instalação necessária. Quando o streaming é iniciado, um coletor virtual chamado "WFAS_VirtualMic" é criado automaticamente via pactl.
vcable_help_linux_2=Abra pavucontrol (PulseAudio Volume Control) ou um equivalente PipeWire.
vcable_help_linux_3=Na aba "Gravação", defina Discord/Zoom/etc. para capturar de "WFAS_VirtualMic".
vcable_help_linux_4=O áudio transmitido agora aparecerá como um microfone nesses aplicativos.
vcable_help_linux_link=Instalar pavucontrol
vcable_help_mac_title=macOS – Configuração do BlackHole
vcable_help_mac_1=Baixe BlackHole (gratuito e de código aberto) em github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Instale-o seguindo as instruções na tela. Não é necessário reiniciar.
vcable_help_mac_3=Selecione "BlackHole 2ch" (ou 16ch) no menu suspenso acima.
vcable_help_mac_4=Em Configurações do sistema → Som, você pode opcionalmente criar um dispositivo de múltiplas saídas para ouvir o áudio e direcioná-lo simultaneamente.
vcable_help_mac_5=No Discord, Zoom ou qualquer outro aplicativo, escolha “BlackHole 2ch” como microfone.
vcable_help_mac_link=Abra o BlackHole no GitHub
start_minimized_tray=Iniciar minimizado para a bandeja
start_minimized_tray_desc=Inicie o aplicativo oculto na bandeja do sistema. Combinado com o Launch at Startup, ele se comporta como o AirPlay/Chromecast: sempre disponível, nunca no seu caminho.
close_to_tray=Perto da bandeja
close_to_tray_desc=Ao fechar a janela, minimize a bandeja do sistema em vez de sair. Clique com o botão direito no ícone da bandeja para sair definitivamente.
