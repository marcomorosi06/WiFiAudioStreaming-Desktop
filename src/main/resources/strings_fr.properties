close_to_tray=Près du plateau
close_to_tray_desc=Lorsque vous fermez la fenêtre, réduisez-la dans la barre d'état système au lieu de quitter. Cliquez avec le bouton droit sur l'icône de la barre d'état pour quitter définitivement.
