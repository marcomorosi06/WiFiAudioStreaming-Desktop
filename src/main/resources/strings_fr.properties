vcable_help_button=Besoin d'aide pour configurer cela ?
vcable_help_win_title=Windows — Configuration de VB-CABLE
vcable_help_win_1=Allez sur vb-audio.com/Cable et téléchargez VB-CABLE.
vcable_help_win_2=Exécutez le programme d'installation en tant qu'administrateur, puis redémarrez votre PC.
vcable_help_win_3=Après le redémarrage, « CABLE Entrée » apparaîtra dans la liste déroulante ci-dessus – sélectionnez-le.
vcable_help_win_4=Dans Discord, Zoom ou toute autre application, accédez aux paramètres audio et choisissez « Sortie CABLE » comme microphone.
vcable_help_win_5=C'est fait ! L'audio diffusé apparaîtra désormais comme votre microphone dans ces applications.
vcable_help_win_link=Ouvrez vb-audio.com/Cable
vcable_help_linux_title=Linux – Puits virtuel automatique
vcable_help_linux_1=Aucune installation nécessaire. Lorsque le streaming démarre, un récepteur virtuel appelé "WFAS_VirtualMic" est créé automatiquement via pactl.
vcable_help_linux_2=Ouvrez pavucontrol (PulseAudio Volume Control) ou un équivalent PipeWire.
vcable_help_linux_3=Dans l'onglet "Enregistrement", définissez Discord/Zoom/etc. à capturer depuis "WFAS_VirtualMic".
vcable_help_linux_4=L'audio diffusé apparaîtra désormais sous forme de microphone dans ces applications.
vcable_help_linux_link=Installer pavucontrol
vcable_help_mac_title=macOS — Configuration de BlackHole
vcable_help_mac_1=Téléchargez BlackHole (gratuit, open source) depuis github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Installez-le en suivant les instructions à l'écran. Aucun redémarrage nécessaire.
vcable_help_mac_3=Sélectionnez « BlackHole 2ch » (ou 16ch) dans la liste déroulante ci-dessus.
vcable_help_mac_4=Dans Paramètres système → Son, vous pouvez éventuellement créer un périphérique à sorties multiples pour entendre l'audio et l'acheminer simultanément.
vcable_help_mac_5=Dans Discord, Zoom ou toute autre application, choisissez « BlackHole 2ch » comme microphone.
vcable_help_mac_link=Ouvrez BlackHole sur GitHub
