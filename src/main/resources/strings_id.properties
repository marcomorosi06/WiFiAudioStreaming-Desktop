usb_panel_hint_ready=Perangkat pada kabel ini muncul dalam daftar bertanda USB.
usb_panel_hint_waiting=Hubungkan telepon dan aktifkan penambatan USB di dalamnya.
usb_panel_hint_no_ip=Kabelnya dikenali. Aktifkan penambatan USB pada perangkat sehingga perangkat dapat memberikan alamat.
usb_transport_label=USB
usb_transport_wifi=Wi-Fi
wfas_mode_label=ketersediaan WFAS
wfas_mode_desc=Pilih kapan perangkat ini melayani protokol WFAS asli. "Mati saat USB tersambung" mempertahankan WFAS di jaringan tetapi menyembunyikannya segera setelah tautan USB muncul.
