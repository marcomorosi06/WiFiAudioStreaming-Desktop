welcome_privacy_detail=GitHub adalah perusahaan Amerika yang dimiliki oleh Microsoft. Setiap permintaan tentu mengungkapkan alamat IP Anda kepada mereka, beserta waktu permintaannya. Tidak ada lagi yang dikirim: tidak ada akun, tidak ada pengenal, tidak ada data penggunaan. Nonaktifkan ini dan aplikasi tidak akan pernah menghubungi jaringan sendiri \u2014 Anda masih dapat memeriksanya secara manual dari Setelan kapan saja.
welcome_privacy_on=Pada 7 pemeriksaan di setiap peluncuran
welcome_privacy_off=Off \u000b7 aplikasi tidak pernah menghubungi GitHub
more_details=Lebih detailnya
less_details=Lebih sedikit detail
update_ahead_title=Saya melihat apa yang Anda lakukan di sana di build.gradle.
update_ahead_body=Lihat dirimu, meretas file lokalmu sendiri. Bangga pada diri sendiri? ;)
status_unsupported_format=Tidak dapat memutar streaming ini: server mengirimkan %1$s, yang tidak didukung oleh perangkat keluaran ini.
developer_group=Pengembang
developer_title=Fitur pengembang
developer_desc=Tampilkan opsi eksperimental tingkat lanjut
nr_title=Pengurangan kebisingan
nr_desc=Membersihkan dengungan dan desisan listrik dari sumber analog
nr_strength=Kekuatan: %1$d%%
nr_hint=Hanya untuk pengirim analog yang berisik, seperti mikrokontroler yang mengambil sampel saluran keluar. Pada audio digital yang bersih, ini hanya dapat menambahkan artefak. Jangan gunakan jika pengirim sudah menghilangkan noise di sisinya.
status_server_busy=Server tersebut sudah melakukan streaming ke perangkat lain.

usb_section=Tautan USB
usb_mode=Streaming melalui USB
usb_mode_desc=Gunakan kabel USB, bukan Wi-Fi. Aktifkan penambatan USB di ponsel Android, lalu aplikasi akan menemukan tautannya sendiri.
usb_latency=Penyangga USB (md)
usb_latency_desc=Buffer jitter digunakan sebagai pengganti audio saat link USB aktif. Lebih rendah berarti lebih sedikit latensi namun lebih besar risiko putus sekolah. Beberapa perangkat mengirimkan paket USB secara tiba-tiba dan membutuhkan lebih banyak buffer di sini dibandingkan melalui Wi-Fi, bukan lebih sedikit.
