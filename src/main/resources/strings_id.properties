dlna_format_mp3_desc=Terkompresi, ~320 kbps. Gunakan saat jaringan lambat atau Wi-Fi macet.
dlna_format_adts_desc=AAC terkompresi. Efisien, namun dukungan penyaji adalah yang paling tidak konsisten.
