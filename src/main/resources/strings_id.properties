vcable_help_button=Butuh bantuan untuk menyiapkannya?
vcable_help_win_title=Windows — Pengaturan KABEL VB
vcable_help_win_1=Buka vb-audio.com/Cable dan unduh VB-CABLE.
vcable_help_win_2=Jalankan penginstal sebagai Administrator, lalu restart PC Anda.
vcable_help_win_3=Setelah memulai ulang, "CABLE Input" akan muncul di dropdown di atas — pilih.
vcable_help_win_4=Di Discord, Zoom, atau aplikasi lainnya, buka Pengaturan Audio dan pilih "Output KABEL" sebagai mikrofon.
vcable_help_win_5=Selesai! Audio yang dialirkan sekarang akan muncul sebagai mikrofon Anda di aplikasi tersebut.
vcable_help_win_link=Buka vb-audio.com/Cable
vcable_help_linux_title=Linux — Wastafel Virtual Otomatis
vcable_help_linux_1=Tidak diperlukan instalasi. Saat streaming dimulai, wastafel virtual bernama "WFAS_VirtualMic" dibuat secara otomatis melalui pactl.
vcable_help_linux_2=Buka pavucontrol (PulseAudio Volume Control) atau yang setara dengan PipeWire.
vcable_help_linux_3=Di tab "Rekaman", atur Discord/Zoom/dll. untuk mengambil dari "WFAS_VirtualMic".
vcable_help_linux_4=Audio yang dialirkan sekarang akan muncul sebagai mikrofon di aplikasi tersebut.
vcable_help_linux_link=Instal pavucontrol
vcable_help_mac_title=macOS — Pengaturan Lubang Hitam
vcable_help_mac_1=Unduh BlackHole (gratis, sumber terbuka) dari github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Instal dengan mengikuti petunjuk di layar. Tidak perlu memulai ulang.
vcable_help_mac_3=Pilih "BlackHole 2ch" (atau 16ch) pada dropdown di atas.
vcable_help_mac_4=Di Pengaturan Sistem → Suara, Anda dapat membuat Perangkat Multi-Output untuk mendengarkan audio dan merutekannya secara bersamaan.
vcable_help_mac_5=Di Discord, Zoom, atau aplikasi lainnya, pilih "BlackHole 2ch" sebagai mikrofon.
vcable_help_mac_link=Buka BlackHole di GitHub
