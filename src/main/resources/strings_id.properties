usb_diag_ready=Tautan USB aktif: %s (%s)
usb_diag_windows=Tidak ada tautan USB yang ditemukan. Hubungkan telepon dan aktifkan penambatan USB di dalamnya.
usb_diag_linux=Tidak ada tautan USB yang ditemukan. Hubungkan telepon dan aktifkan penambatan USB di dalamnya.
usb_diag_macos=Tidak ada tautan USB yang ditemukan. macOS tidak memiliki driver RNDIS bawaan, jadi penambatan USB Android biasanya tidak berfungsi di sini; gunakan Wi-Fi sebagai gantinya.
usb_diag_no_ip=Adaptor USB ditemukan (%s) tetapi tidak memiliki alamat IP. Penambatan USB mungkin masih tidak aktif pada perangkat.
usb_interface=Antarmuka USB
usb_interface_desc=Biarkan dalam mode Otomatis kecuali deteksi memilih adaptor yang salah. Adaptor tanpa alamat IP juga terdaftar, sehingga Anda dapat membedakan driver lama dari driver yang aktif.
usb_interface_auto=Otomatis
usb_interface_no_ip=%s (tidak ada IP)
usb_send_label=Kirim melalui USB
usb_send_hint=Streaming ke ponsel melalui kabel, bukan Wi-Fi.
