welcome_cli_body=您可以使用 wfas 命令從任何終端控制應用程式。點擊下面立即將其添加到您的路徑中。\n___XYZ_分割___\n將 wfa 加入 PATH\n___XYZ_分割___\n開始使用\n___XYZ_分割___\n感謝安裝！\n___XYZ_分割___\n提示：將 wfa 新增到您的 PATH 以便快速存取。\n___XYZ_分割___\n運行 GUI 應用程式 > 設定 > CLI 命令 > 安裝\n___XYZ_分割___\nCLI 指令 (wfas)\n___XYZ_分割___\n在 PATH 中安裝 wfas\n___XYZ_分割___\n將 wfas 命令新增至系統路徑中，以便您可以從任何終端運行它。如果您移動應用程式以更新路徑，請再次運行。\n___XYZ_分割___\nwfas 已安裝並且是最新的\n___XYZ_分割___\n未安裝\n___XYZ_分割___\n安裝\n___XYZ_分割___\n更新路徑\n___XYZ_分割___\n已安裝\n___XYZ_分割___\nwfas 指令現在在您的 PATH 中可用。打開一個新終端來使用它。\n___XYZ_分割___\n航廈開放\n___XYZ_分割___\n已開啟終端機視窗以使用管理員權限完成安裝。關閉後，打開一個新終端並運行：wfas --help\n___XYZ_分割___\n安裝失敗\n___XYZ_分割___\n顯示歡迎畫面\n___XYZ_分割___\n重置所有設定\n___XYZ_分割___\n將所有設定恢復為其安裝預設值\n___XYZ_分割___\n重置所有設定？\n___XYZ_分割___\n這會將所有設定恢復為其預設值。此操作無法撤銷。\n___XYZ_分割___\n重置\n___XYZ_分割___\n防火牆
