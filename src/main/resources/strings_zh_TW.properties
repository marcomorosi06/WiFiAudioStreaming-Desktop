http_codec_aac_desc=亞克力？更高的延遲。 Safari、iOS、所有瀏覽器。當 Opus 用戶端失敗時使用。\n___XYZ_分割___\nRTP/PCM 串流活動\n___XYZ_分割___\n複製或儲存 SDP 檔案以使用 VLC 或 FFplay 收聽\n___XYZ_分割___\n複製SDP\n___XYZ_分割___\n將 SDP 儲存到文件\n___XYZ_分割___\n網路介面（發現與群播）\n___XYZ_分割___\n如果您使用 VPN（例如 ZeroTier、Tailscale），請在此處選擇其虛擬適配器以允許裝置相互查找。\n___XYZ_分割___\n啟用 RTP 流時會強制執行多播。\n___XYZ_分割___\n啟用 HTTP 流時會強制執行多重播送。\n___XYZ_分割___\n啟用 RTP 或 HTTP 流時會強制執行多重播送。\n___XYZ_分割___\n對於活動協議來說，多播是強制性的。\n___XYZ_分割___\n給我買杯咖啡\n___XYZ_分割___\n如果你喜歡這個應用程序，請給我一杯咖啡！ §2615\n___XYZ_分割___\n許可證\n___XYZ_分割___\nEUPL v1.2 \u2014 \u00a9 Marco Morosi\n___XYZ_分割___\n該項目根據歐盟公共許可證 v1.2 獲得許可。所有智慧財產權均屬於 Marco Morosi。該許可證授予您使用、研究、修改和重新分發該軟體的權利，即使是修改後的形式，前提是您保留相同的許可證。\n___XYZ_分割___\n閱讀完整的 EUPL v1.2 文本\n___XYZ_分割___\n在瀏覽器中開啟 eupl.eu\n___XYZ_分割___\n開源許可證\n___XYZ_分割___\n第三方軟體及其許可證\n___XYZ_分割___\n開源許可證\n___XYZ_分割___\n注意：Web 瀏覽器對 HTTP 流強制執行內部緩衝，這不可避免地會導致 1-3 秒的延遲。這是正常現象，無法繞過。\n___XYZ_分割___\nLinux 自啟動配置\n___XYZ_分割___\n啟動時啟動\n___XYZ_分割___\n登入時自動啟動應用程式
