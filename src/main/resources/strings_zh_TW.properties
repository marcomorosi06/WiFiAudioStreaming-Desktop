fw_title=允許透過 Windows 防火牆\n___XYZ_分割___\n規則有效\n___XYZ_分割___\n未配置\n___XYZ_分割___\n如果裝置無法連線並處於「等待」狀態，請允許這些 UDP 連接埠上的入站流量。需要管理員批准一次。\n___XYZ_分割___\nUDP埠\n___XYZ_分割___\n允許通過防火牆\n___XYZ_分割___\n系統上的firewalld處於作用中狀態\n___XYZ_分割___\nufw 在此系統上處於作用中狀態\n___XYZ_分割___\n如果裝置無法連線並處於「等待」狀態，則這些連接埠上的入站 UDP 可能會被封鎖。在終端機中執行以下命令。\n___XYZ_分割___\n複製指令\n___XYZ_分割___\n允許\n___XYZ_分割___\n防火牆已更新\n___XYZ_分割___\n現在，所選連接埠上允許入站 UDP。設備應該能夠連接。\n___XYZ_分割___\n未應用\n___XYZ_分割___\n更改需要管理員批准。再次按一下「允許」並接受 Windows 提示。\n___XYZ_分割___\n錯誤\n___XYZ_分割___\n此功能僅在 Windows 上可用。\n___XYZ_分割___\n啟動和視窗\n___XYZ_分割___\n聲音\n___XYZ_分割___\n系統\n___XYZ_分割___\n資訊\n___XYZ_分割___\n從網站下載\n___XYZ_分割___\n從 GitHub 下載\n___XYZ_分割___\n自動更新檢查\n___XYZ_分割___\n每次啟動時，應用程式都會詢問 GitHub 是否存在更新版本。
