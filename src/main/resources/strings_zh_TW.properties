qr_pairing_deeplink_confirm_body_multicast=偵測到用於多播接收的 WFAS 邀請。您現在想連接嗎？\n___XYZ_分割___\n偵測到 WFAS 邀請用於從該裝置進行串流傳輸。您現在想連接嗎？\n___XYZ_分割___\n連接\n___XYZ_分割___\n忽略\n___XYZ_分割___\n該設備正在傳輸。連接將停止該傳輸。\n___XYZ_分割___\n連接到 XYZPH0XYZ？\n___XYZ_分割___\n該多播組的金鑰在程式碼產生後被更新。向廣播設備請求新的邀請。\n___XYZ_分割___\n明白了\n___XYZ_分割___\n這個群已經變了\n___XYZ_分割___\n出於安全原因，此程式碼不再有效。產生新邀請以繼續。\n___XYZ_分割___\n產生新程式碼\n___XYZ_分割___\n關閉\n___XYZ_分割___\nQR 圖碼已過期\n___XYZ_分割___\n掃描的程式碼不是有效的 WFAS 邀請。確保您正在掃描其他裝置產生的程式碼。\n___XYZ_分割___\n取消\n___XYZ_分割___\n再試一次\n___XYZ_分割___\n代碼無法識別\n___XYZ_分割___\n未偵測到網路攝影機。您仍然可以手動輸入地址和密鑰。\n___XYZ_分割___\n關閉\n___XYZ_分割___\n手動輸入\n___XYZ_分割___\n相機不可用\n___XYZ_分割___\n所有連接的裝置都必須重新配對。如果您認為未經授權的裝置知道目前金鑰，請使用此選項。\n___XYZ_分割___\n取消\n___XYZ_分割___\n再生\n___XYZ_分割___\n重新產生群組密鑰？
