auto_start_server=自動啟動伺服器\n___XYZ_分割___\n應用程式開啟時自動啟動伺服器\n___XYZ_分割___\n自動啟動模式\n___XYZ_分割___\n自動啟動客戶端\n___XYZ_分割___\n每隔約 10 秒自動連線到可用的優先 IP（您必須位於用戶端連線頁面才能正常運作）\n___XYZ_分割___\n優先IP\n___XYZ_分割___\n新增IP\n___XYZ_分割___\n連結聲音\n___XYZ_分割___\n當客戶端連接到伺服器時播放聲音\n___XYZ_分割___\n自訂連線聲音\n___XYZ_分割___\n未選擇檔案（使用預設蜂鳴聲）\n___XYZ_分割___\n瀏覽...\n___XYZ_分割___\n斷開聲音\n___XYZ_分割___\n當客戶端與伺服器斷開連線時播放聲音\n___XYZ_分割___\n原生音訊引擎\n___XYZ_分割___\n使用原生 C 音訊引擎（建議）。在 Linux 上：透過 dlopen 的 PulseAudio/PipeWire，自動讓揚聲器靜音。停用回退到舊版 FFmpeg 採集器。\n___XYZ_分割___\n串流媒體時將揚聲器靜音\n___XYZ_分割___\n在伺服器捕獲本地播放時將其靜音，這樣就不會聽到兩次音訊。將其關閉以繼續在此處以及在客戶端上聽到它。僅本機引擎；當伺服器停止時，將恢復先前的狀態。 CLI: --no-mute-render。\n___XYZ_分割___\n斷開連接後保持伺服器運行\n___XYZ_分割___\n在單播中，客戶端離開會結束會話，而不是伺服器：它保持連接埠開啟並等待下一個客戶端。多播已經以這種方式工作。\n___XYZ_分割___\n傳入麥克風路由\n___XYZ_分割___\n選擇如何處理從客戶端收到的麥克風串流\n___XYZ_分割___\n關閉\n___XYZ_分割___\n忽略客戶端麥克風\n___XYZ_分割___\n虛擬麥克風
