welcome_privacy_detail=GitHub 是微軟旗下的美國公司。每個請求都必須向他們透露您的 IP 位址以及請求時間。不會發送任何其他內容：沒有帳戶、沒有識別碼、沒有使用資料。關閉此功能後，應用程式永遠不會自行連接網絡，您仍然可以隨時從「設定」中手動檢查。\n___XYZ_分割___\n每次啟動時都會進行檢查\n___XYZ_分割___\n關閉應用程式永遠不會聯絡 GitHub\n___XYZ_分割___\n更多詳情\n___XYZ_分割___\n細節較少\n___XYZ_分割___\n我看到你在 build.gradle 中做了什麼。\n___XYZ_分割___\n看看你，正在破解你自己的本地文件。為自己感到驕傲嗎？ ;)\n___XYZ_分割___\n無法播放此串流：伺服器發送 XYZPH0XYZ，此輸出裝置不支援。\n___XYZ_分割___\n開發商\n___XYZ_分割___\n開發者特色\n___XYZ_分割___\n顯示進階實驗選項\n___XYZ_分割___\n降噪\n___XYZ_分割___\n消除來自模擬來源的電源嗡嗡聲和嘶嘶聲\n___XYZ_分割___\n強度：XYZPH0XYZ%%\n___XYZ_分割___\n僅適用於雜訊的類比發送器，例如對線路輸出進行取樣的微控制器。在乾淨的數位音訊上，它只能添加偽影。如果發送器已經消除了其一側的噪音，請勿使用它。\n___XYZ_分割___\n該伺服器已經在串流到另一台裝置。\n___XYZ_分割___\nUSB連接\n___XYZ_分割___\n透過 USB 串流\n___XYZ_分割___\n使用 USB 連接線取代 Wi-Fi。在 Android 手機上啟用 USB 網路分享，然後應用程式會自行尋找連結。\n___XYZ_分割___\nUSB 緩衝區（毫秒）\n___XYZ_分割___\n當 USB 連結處於作用中狀態時，使用抖動緩衝器取代音訊緩衝器。更低意味著延遲更少，但丟失的風險更大。某些裝置會突發傳輸 USB 封包，因此需要比 Wi-Fi 更多的緩衝區，而不​​是更少。\n___XYZ_分割___\nUSB 模式已關閉。\n___XYZ_分割___\nUSB 連結處於作用中狀態：XYZPH0XYZ (XYZPH0XYZ)\n___XYZ_分割___\n未找到 USB 連結。連接手機並啟用 USB 網路分享。\n___XYZ_分割___\n未找到 USB 連結。連接手機並啟用 USB 網路分享。
