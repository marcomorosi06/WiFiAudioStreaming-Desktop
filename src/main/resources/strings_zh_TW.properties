usb_diag_macos=未找到 USB 連結。 macOS 沒有內建的 RNDIS 驅動程序，因此 Android USB 網路共享通常在這裡不起作用；使用 Wi-Fi 代替。\n___XYZ_分割___\n尋找 USB 轉接器 (XYZPH0XYZ)，但沒有 IP 位址。裝置上的 USB 網路共用可能仍處於關閉狀態。\n___XYZ_分割___\nUSB介面\n___XYZ_分割___\n保留“自動”，除非檢測選擇了錯誤的適配器。沒有 IP 位址的適配器也被列出，因此您可以區分過時的驅動程式和即時驅動程式。\n___XYZ_分割___\n汽車\n___XYZ_分割___\nXYZPH0XYZ（無 IP）\n___XYZ_分割___\n透過 USB 發送\n___XYZ_分割___\n透過電纜而不是 Wi-Fi 串流傳輸到手機。\n___XYZ_分割___\n透過 USB 接收\n___XYZ_分割___\n透過電纜而不是 Wi-Fi 收聽電話。\n___XYZ_分割___\n此連接線上的裝置出現在標記為 USB 的清單中。\n___XYZ_分割___\n連接手機並啟用 USB 網路分享。\n___XYZ_分割___\n電纜已被識別。打開裝置上的 USB 網路共享，以便它可以分發位址。\n___XYZ_分割___\nUSB\n___XYZ_分割___\n無線網路\n___XYZ_分割___\nWFAS 可用性\n___XYZ_分割___\n選擇此設備何時提供本機 WFAS 協定。 「連接 USB 時關閉」可將 WFAS 保持在網路上，但一旦 USB 連結出現就將其抑制。\n___XYZ_分割___\n始終開啟\n___XYZ_分割___\n連接 USB 時熄滅\n___XYZ_分割___\n關閉\n___XYZ_分割___\n關閉 WFAS 後，您至少需要啟用一種其他協定或有效的 USB 連接才能啟動串流。\n___XYZ_分割___\n無可用協議\n___XYZ_分割___\n啟動 WFAS 協議\n___XYZ_分割___\n透過 USB 連接\n___XYZ_分割___\n無線連線
