protocol_dlna_title=DLNA / UPnP 渲染器\n___XYZ_分割___\n將音訊推送到 AV 接收器、條形音箱和智慧電視 — 無需應用程式\n___XYZ_分割___\nDLNA 媒體端口\n___XYZ_分割___\n渲染器連接回的 TCP 連接埠。必須可從渲染器存取。\n___XYZ_分割___\n音訊格式\n___XYZ_分割___\n自動（協商）\n___XYZ_分割___\n詢問每個渲染器支援什麼並選擇最佳匹配。受到推崇的。\n___XYZ_分割___\n未壓縮的 16 位元 PCM，~1.4 Mbps。最低的延遲，最廣泛的兼容性。\n___XYZ_分割___\n流式 WAV 標頭內未壓縮的 PCM。對一些較舊的韌體有幫助。\n___XYZ_分割___\n壓縮後，約 320 kbps。網路速度較慢或 Wi-Fi 擁塞時使用。\n___XYZ_分割___\n壓縮的 AAC。高效，但渲染器支援最不穩定。\n___XYZ_分割___\n網路上的渲染器\n___XYZ_分割___\n重新掃描\n___XYZ_分割___\n正在搜尋渲染器...\n___XYZ_分割___\n未找到 DLNA 渲染器。確保裝置已開啟且位於相同網路上。\n___XYZ_分割___\n串流開始時，系統會記住並自動重新連接選定的渲染器。\n___XYZ_分割___\n離線\n___XYZ_分割___\n後備\n___XYZ_分割___\n演奏\n___XYZ_分割___\n正在連線…\n___XYZ_分割___\n正在重試...\n___XYZ_分割___\n握手失敗\n___XYZ_分割___\n複製診斷\n___XYZ_分割___\n清除選擇\n___XYZ_分割___\n和
