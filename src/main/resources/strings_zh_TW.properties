snapcast_how_to_connect_auto=該網路上的用戶端自行查找串流。如果沒有，請將其指向下面的地址。\n___XYZ_分割___\n自動發現已關閉，因此用戶端必須明確指向該位址。\n___XYZ_分割___\n在 Snapcast 行動應用程式中透過 IP 新增伺服器。在 Home Assistant 中，使用 Snapcast 與該主機和控制連接埠整合。\n___XYZ_分割___\n記住鑰匙\n___XYZ_分割___\n儲存在XYZPH0XYZ中，並由系統加密。\n___XYZ_分割___\n不儲存：每次啟動時都會再次詢問。\n___XYZ_分割___\n系統上沒有憑證存儲，因此不會儲存金鑰：在每次啟動時輸入它，或設定 WFAS_AUTH_KEY。\n___XYZ_分割___\n自動啟動前等待...\n___XYZ_分割___\n等待網路...\n___XYZ_分割___\n自動啟動取消：60秒後無本機位址\n___XYZ_分割___\n自動啟動取消：安全設定為金鑰，但不儲存金鑰\n___XYZ_分割___\n啟動延遲\n___XYZ_分割___\n伺服器啟動前等待的秒數。登入時網路通常還沒準備好，沒有位址啟動的伺服器是無人找到的伺服器。\n___XYZ_分割___\n等待網路\n___XYZ_分割___\n保持自動啟動，直到該電腦具有可用的本機位址，最多一分鐘。\n___XYZ_分割___\n起始量\n___XYZ_分割___\n伺服器自動啟動時套用的音量。離開以保留當前的。\n___XYZ_分割___\n自動啟動安全\n___XYZ_分割___\n自動啟動伺服器的安全模式。繼承使用通用設定； key 需要儲存的預共用金鑰。\n___XYZ_分割___\n繼承\n___XYZ_分割___\n自動連接到 XYZPH0XYZ...\n___XYZ_分割___\nXYZPH0XYZ 已跳過：已儲存的密鑰不可用\n___XYZ_分割___\n掃描間隔\n___XYZ_分割___\n檢查清單的頻率（以秒為單位）。\n___XYZ_分割___\n重試延遲
