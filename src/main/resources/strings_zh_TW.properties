server_silent_title=其他設備沒有回應\n___XYZ_分割___\n「XYZPH0XYZ」從未應答連線要求。最可能的原因是它正在運行舊版本的應用程序，該應用程式無法與此版本通訊 - 更新該設備上的應用程式。否則，請檢查防火牆是否未封鎖該連接埠。\n___XYZ_分割___\n另一台設備需要更新\n___XYZ_分割___\n該設備需要更新\n___XYZ_分割___\n這兩個應用程式運行不相容的 WFAS 協定版本（本設備：vXYZPH0XYZ，另一端：vXYZPH1XYZ）。連線已關閉。請更新，以便兩台裝置都運行最新版本。\n___XYZ_分割___\n正在傳輸的裝置正在執行舊版的應用程式（WFAS 協定 vXYZPH0XYZ，此裝置使用 vXYZPH1XYZ），因此連線已關閉。更新傳輸裝置上的應用程式。\n___XYZ_分割___\n正在接收的裝置正在執行舊版的應用程式（WFAS 協定 vXYZPH0XYZ，此裝置使用 vXYZPH1XYZ），因此連線已關閉。更新接收裝置上的應用程式。\n___XYZ_分割___\n此裝置正在執行舊版的應用程式（WFAS 協定 vXYZPH0XYZ，其他裝置使用 vXYZPH1XYZ），因此連線已關閉。更新此裝置上的應用程式。\n___XYZ_分割___\n開啟下載\n___XYZ_分割___\n從網站下載\n___XYZ_分割___\n從網站下載\n___XYZ_分割___\n在 GitHub 上打開\n___XYZ_分割___\n連接埠 XYZPH0XYZ 上的組播流處於活動狀態\n___XYZ_分割___\n伺服器在連接埠 XYZPH0XYZ 上等待\n___XYZ_分割___\n客戶端已連接，串流傳輸至 XYZPH0XYZ\n___XYZ_分割___\n正在聯絡位於 XYZPH0XYZ 的伺服器\n___XYZ_分割___\n等待伺服器確認...\n___XYZ_分割___\n已連線！從 XYZPH0XYZ 串流\n___XYZ_分割___\n在連接埠 XYZPH0XYZ 上加入多播流\n___XYZ_分割___\n串流媒體活動\n___XYZ_分割___\n準備串流\n___XYZ_分割___\n等待連接\n___XYZ_分割___\n按下“啟動伺服器”開始\n___XYZ_分割___\n從下面的清單中選擇一個伺服器\n___XYZ_分割___\n啟動伺服器
