qr_pairing_self_body=該邀請是由同一裝置產生的，因此沒有任何可連接的內容。從應接收音訊的裝置上掃描它。\n___XYZ_分割___\n明白了\n___XYZ_分割___\n這是你自己的程式碼\n___XYZ_分割___\n另一台設備拒絕了此邀請。它可能已被更新的密鑰替換，或者群組密鑰已重新產生。要求一個新的代碼。\n___XYZ_分割___\n掃描新程式碼\n___XYZ_分割___\n關閉\n___XYZ_分割___\n邀請不再有效\n___XYZ_分割___\n重新產生金鑰\n___XYZ_分割___\n掃描二維碼\n___XYZ_分割___\n關閉掃描儀\n___XYZ_分割___\n該邀請已過期。要求一份新鮮的。\n___XYZ_分割___\n已找到邀請\n___XYZ_分割___\n將相機對準其他裝置顯示的二維碼。\n___XYZ_分割___\n嗯……你想讓我掃描一下嗎？這不是 WFAS 二維碼！\n___XYZ_分割___\n掃描邀請碼\n___XYZ_分割___\n火炬\n___XYZ_分割___\nQR 圖碼\n___XYZ_分割___\n為每個邀請自動產生一個隨機金鑰 - 比手動選擇的密碼更安全。無需記住或大聲說出密碼。\n___XYZ_分割___\n自動產生密鑰\n___XYZ_分割___\n在密鑰模式下密鑰不能為空。在「安全性」下輸入一個，或切換到二維碼，讓其為您產生。\n___XYZ_分割___\n鑰匙遺失\n___XYZ_分割___\n寄件者更改了群組密鑰\n___XYZ_分割___\n無法在多播組上傳送：XYZPH0XYZ\n___XYZ_分割___\n連接方式\n___XYZ_分割___\n如何連接
