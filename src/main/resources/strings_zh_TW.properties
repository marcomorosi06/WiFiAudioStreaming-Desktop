vcable_help_button=Need help setting this up?
vcable_help_win_title=Windows — VB-CABLE Setup
vcable_help_win_1=Go to vb-audio.com/Cable and download VB-CABLE.
vcable_help_win_2=Run the installer as Administrator, then restart your PC.
vcable_help_win_3=After restarting, "CABLE Input" will appear in the dropdown above — select it.
vcable_help_win_4=In Discord, Zoom or any other app, go to Audio Settings and choose "CABLE Output" as the microphone.
vcable_help_win_5=Done! The streamed audio will now appear as your microphone in those apps.
vcable_help_win_link=Open vb-audio.com/Cable
vcable_help_linux_title=Linux — Automatic Virtual Sink
vcable_help_linux_1=No installation needed. When streaming starts, a virtual sink called "WFAS_VirtualMic" is created automatically via pactl.
vcable_help_linux_2=Open pavucontrol (PulseAudio Volume Control) or a PipeWire equivalent.
vcable_help_linux_3=In the "Recording" tab, set Discord/Zoom/etc. to capture from "WFAS_VirtualMic".
vcable_help_linux_4=串流音訊現在將在這些應用程式中顯示為麥克風。\n___XYZ_分割___\n安裝 pavucontrol\n___XYZ_分割___\nmacOS — 黑洞設定\n___XYZ_分割___\n從 github.com/ExistentialAudio/BlackHole 下載 BlackHole（免費、開源）。\n___XYZ_分割___\n請依照螢幕上的指示進行安裝。無需重新啟動。\n___XYZ_分割___\n在上面的下拉清單中選擇“BlackHole 2ch”（或 16ch）。\n___XYZ_分割___\n在「系統設定」→「聲音」中，您可以選擇建立多輸出裝置來聆聽音訊並同時路由它。\n___XYZ_分割___\n在 Discord、Zoom 或任何其他應用程式中，選擇“BlackHole 2ch”作為麥克風。\n___XYZ_分割___\n在 GitHub 上開啟 BlackHole\n___XYZ_分割___\n開始最小化到托盤\n___XYZ_分割___\n啟動隱藏在系統托盤中的應用程式。與啟動時啟動相結合，它的行為就像 AirPlay/Chromecast：始終可用，永遠不會妨礙您。\n___XYZ_分割___\n靠近托盤\n___XYZ_分割___\n關閉視窗時，最小化到系統托盤而不是退出。右鍵單擊托盤圖示即可永久退出。\n___XYZ_分割___\n顯示視窗\n___XYZ_分割___\n隱藏到托盤\n___XYZ_分割___\n戒菸\n___XYZ_分割___\n在後台運行。右鍵單擊托盤圖示即可退出。\n___XYZ_分割___\n使用深色圖示（淺色面板）\n___XYZ_分割___\n使用淺色圖示（深色面板）\n___XYZ_分割___\n歡迎使用 WiFi 音訊串流！\n___XYZ_分割___\n感謝您安裝該應用程式。這是您開始使用所需的一切。\n___XYZ_分割___\n獲取 Android 應用程式\n___XYZ_分割___\n安裝配套的 Android 應用程式以在手機或平板電腦上接收音訊。免費且開源。\n___XYZ_分割___\n在 GitHub 上下載\n___XYZ_分割___\n從終端使用它
