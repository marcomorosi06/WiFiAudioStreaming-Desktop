auto_connect_retry_desc=斷開連接後重新連接之前等待的時間（以秒為單位）。\n___XYZ_分割___\n問鑰匙\n___XYZ_分割___\n如果伺服器要求提供金鑰，則此項目尚未儲存：顯示金鑰對話框，或跳過該伺服器。預設處於關閉狀態，因為無人值守的重新連線無法在沒有人可以應答的視窗上停止。\n___XYZ_分割___\n已儲存的伺服器\n___XYZ_分割___\n新增伺服器\n___XYZ_分割___\n系統密鑰環不可訪問，因此無法安全地儲存密鑰。在 Linux 上安裝「secret-tool」（libsecret 軟體包）並重新啟動。\n___XYZ_分割___\n憑證儲存問題\n___XYZ_分割___\n在修復此問題之前，您在此輸入的鍵不會被記住。\n___XYZ_分割___\n無法存取系統密鑰環。安裝“secret-tool”（libsecret 軟體包）並重新啟動。\n___XYZ_分割___\nWindows 憑證保護 (DPAPI) 在此系統上無法使用。\n___XYZ_分割___\nmacOS 鑰匙圈在此系統上不可用。\n___XYZ_分割___\n本系統沒有受支援的憑證儲存。\n___XYZ_分割___\n系統密鑰環已應答，但測試保存失敗 (XYZPH0XYZ)。它可能被鎖定並解鎖並重試。\n___XYZ_分割___\n地址\n___XYZ_分割___\n港口\n___XYZ_分割___\n預設\n___XYZ_分割___\n姓名（可選）\n___XYZ_分割___\n鑰匙\n___XYZ_分割___\n密鑰已儲存\n___XYZ_分割___\n沒有鑰匙\n___XYZ_分割___\n儲存在系統憑證儲存中，而不是儲存在 config.json 中\n___XYZ_分割___\n儲存\n___XYZ_分割___\n移除鑰匙\n___XYZ_分割___\n使用此條目\n___XYZ_分割___\n托盤圖示不可用
