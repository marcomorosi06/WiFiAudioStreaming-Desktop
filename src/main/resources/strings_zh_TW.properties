tray_unavailable_desc=該視窗無法隱藏到托盤中，因此關閉它會退出應用程式。\n___XYZ_分割___\n自動啟動加密\n___XYZ_分割___\n對自動啟動的伺服器的音訊進行加密。與一般設定不同，因為兩者服務於不同的時刻：有人參與的會話可以保持暢通無阻以供檢查，而自行啟動並運行數小時的會話則值得加密。\n___XYZ_分割___\n加密的\n___XYZ_分割___\n未加密\n___XYZ_分割___\n繼承目前意味著加密。\n___XYZ_分割___\n繼承目前意味著不加密。\n___XYZ_分割___\n不捕捉\n___XYZ_分割___\n麥克風\n___XYZ_分割___\n系統音訊\n___XYZ_分割___\n麥克風和系統音訊\n___XYZ_分割___\n系統輸出（環回）\n___XYZ_分割___\n混入流中\n___XYZ_分割___\n連接埠 XYZPH0XYZ 上的偵聽器\n___XYZ_分割___\n立即捕捉\n___XYZ_分割___\n打開捕獲日誌\n___XYZ_分割___\n將音量重設為 100%\n___XYZ_分割___\n高於 100% 的是數字增益：大聲的段落剪輯。
auto_start_encryption_title=Auto-start Encryption
auto_start_encryption_desc=Encrypt the audio of the automatically started server. Separate from the general setting, because the two serve different moments: an attended session can stay in the clear for inspection, while one that starts by itself and runs for hours is worth encrypting.
