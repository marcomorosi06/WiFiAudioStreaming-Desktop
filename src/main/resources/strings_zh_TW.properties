snapcast_codec_pcm_desc=未壓縮。每個客戶端在 48 kHz 立體聲下的速度約為 1.5 Mbps，零編碼延遲。\n___XYZ_分割___\n無損壓縮。頻寬大致減半，增加約 25 毫秒的編碼延遲。\n___XYZ_分割___\n有損、最低頻寬。需要 48000 Hz 立體聲 16 位元輸入。\n___XYZ_分割___\nOpus 需要 48000 Hz 立體聲。使用目前音訊設置，伺服器將回退到 PCM。\n___XYZ_分割___\n區塊大小\n___XYZ_分割___\n客戶端緩衝區（毫秒）\n___XYZ_分割___\n客戶提前多遠安排播放。越高則越穩健，越低則反應越靈敏。\n___XYZ_分割___\n流名稱\n___XYZ_分割___\n啟動伺服器以透過 mDNS 通告流。客戶會自動發現它。\n___XYZ_分割___\nXYZPH0XYZ 此處不可用，而是作為 XYZPH1XYZ 進行串流傳輸\n___XYZ_分割___\n為 XYZPH2XYZ 用戶端提供 XYZPH0XYZ (XYZPH1XYZ) 服務，XYZPH3XYZ 控制連接\n___XYZ_分割___\nXYZPH0XYZ - 音量 XYZPH1XYZ%%，延遲 XYZPH2XYZ 毫秒\n___XYZ_分割___\n網路\n___XYZ_分割___\n離線\n___XYZ_分割___\nSnapcast 多房間\n___XYZ_分割___\nXYZPH0XYZ 用戶端同步播放\n___XYZ_分割___\n串流\n___XYZ_分割___\n控制\n___XYZ_分割___\n編解碼器\n___XYZ_分割___\n發現\n___XYZ_分割___\n透過 mDNS 發布廣告\n___XYZ_分割___\n未公佈 - 手動連接\n___XYZ_分割___\n連接埠 XYZPH0XYZ 不可用\n___XYZ_分割___\n無法開啟連接埠：XYZPH0XYZ。另一個 Snapcast 伺服器可能已經在運行，或者防火牆正在阻止它。\n___XYZ_分割___\n如何連接
