mic_routing_virtual=Virtual microphone
mic_routing_virtual_desc=將麥克風作為虛擬輸入裝置提供給其他應用程式（Discord、Zoom...）\n___XYZ_分割___\n混入流中\n___XYZ_分割___\n將麥克風混合到發送回客戶端的音訊串流中\n___XYZ_分割___\n將透過 pactl 自動建立名為「WFAS_VirtualMic」的虛擬接收器\n___XYZ_分割___\n偵測到的虛擬電纜：XYZPH0XYZ\n___XYZ_分割___\n未偵測到虛擬電纜。安裝 VB-CABLE (Windows) 或 BlackHole/Loopback (macOS)，或手動選擇設備\n___XYZ_分割___\n麥克風輸出設備\n___XYZ_分割___\n麥克風將直接混合到輸出音訊串流中\n___XYZ_分割___\n僅單播模式支援麥克風共享。禁用多播/RTP 才能使用它。\n___XYZ_分割___\n虛擬麥克風僅在單播模式下可用。混合到串流中仍然可以在多播中工作。\n___XYZ_分割___\n麥克風靜音\n___XYZ_分割___\n麥克風處於活動狀態\n___XYZ_分割___\n麥克風輸入設備\n___XYZ_分割___\n需要幫助設定嗎？\n___XYZ_分割___\nWindows — VB-CABLE 設定\n___XYZ_分割___\n前往 vb-audio.com/Cable 並下載 VB-CABLE。\n___XYZ_分割___\n以管理員身份執行安裝程序，然後重新啟動電腦。\n___XYZ_分割___\n重新啟動後，“電纜輸入”將出現在上面的下拉清單中 - 選擇它。\n___XYZ_分割___\n在 Discord、Zoom 或任何其他應用程式中，前往音訊設定並選擇「電纜輸出」作為麥克風。\n___XYZ_分割___\n完成！串流音訊現在將在這些應用程式中顯示為您的麥克風。\n___XYZ_分割___\n打開 vb-audio.com/Cable\n___XYZ_分割___\nLinux — 自動虛擬接收器\n___XYZ_分割___\n無需安裝。當串流開始時，會透過 pactl 自動建立一個名為「WFAS_VirtualMic」的虛擬接收器。\n___XYZ_分割___\n開啟 pavucontrol（PulseAudio 音量控制）或 PipeWire 等效項。\n___XYZ_分割___\n在「錄音」標籤中，設定Discord/Zoom/等。從“WFAS_VirtualMic”捕獲。
