auto_connect_retry_desc=断开连接后重新连接之前等待的时间（以秒为单位）。\n___XYZ_分割___\n询问钥匙\n___XYZ_分割___\n如果服务器要求提供密钥，则此条目尚未保存：显示密钥对话框，或跳过该服务器。默认情况下处于关闭状态，因为无人值守的重新连接无法在没有人可以应答的窗口上停止。\n___XYZ_分割___\n已保存的服务器\n___XYZ_分割___\n添加服务器\n___XYZ_分割___\n系统密钥环不可访问，因此无法安全地存储密钥。在 Linux 上安装“secret-tool”（libsecret 软件包）并重新启动。\n___XYZ_分割___\n凭证存储问题\n___XYZ_分割___\n在修复此问题之前，您在此处输入的键不会被记住。\n___XYZ_分割___\n无法访问系统密钥环。安装“secret-tool”（libsecret 软件包）并重新启动。\n___XYZ_分割___\nWindows 凭据保护 (DPAPI) 在此系统上不可用。\n___XYZ_分割___\nmacOS 钥匙串在此系统上不可用。\n___XYZ_分割___\n该系统没有受支持的凭证存储。\n___XYZ_分割___\n系统密钥环已应答，但测试保存失败 (XYZPH0XYZ)。它可能被锁定并解锁并重试。\n___XYZ_分割___\n地址\n___XYZ_分割___\n港口\n___XYZ_分割___\n默认\n___XYZ_分割___\n姓名（可选）\n___XYZ_分割___\n钥匙\n___XYZ_分割___\n密钥已保存\n___XYZ_分割___\n没有钥匙\n___XYZ_分割___\n存储在系统凭证存储中，而不是存储在 config.json 中\n___XYZ_分割___\n保存\n___XYZ_分割___\n移除钥匙\n___XYZ_分割___\n使用此条目\n___XYZ_分割___\n托盘图标不可用
