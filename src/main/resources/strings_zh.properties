vcable_help_button=Need help setting this up?
vcable_help_win_title=Windows — VB-CABLE Setup
vcable_help_win_1=Go to vb-audio.com/Cable and download VB-CABLE.
vcable_help_win_2=Run the installer as Administrator, then restart your PC.
vcable_help_win_3=After restarting, "CABLE Input" will appear in the dropdown above — select it.
vcable_help_win_4=In Discord, Zoom or any other app, go to Audio Settings and choose "CABLE Output" as the microphone.
vcable_help_win_5=Done! The streamed audio will now appear as your microphone in those apps.
vcable_help_win_link=Open vb-audio.com/Cable
vcable_help_linux_title=Linux — Automatic Virtual Sink
vcable_help_linux_1=No installation needed. When streaming starts, a virtual sink called "WFAS_VirtualMic" is created automatically via pactl.
vcable_help_linux_2=Open pavucontrol (PulseAudio Volume Control) or a PipeWire equivalent.
vcable_help_linux_3=In the "Recording" tab, set Discord/Zoom/etc. to capture from "WFAS_VirtualMic".
vcable_help_linux_4=流式音频现在将在这些应用程序中显示为麦克风。\n___XYZ_分割___\n安装 pavucontrol\n___XYZ_分割___\nmacOS — 黑洞设置\n___XYZ_分割___\n从 github.com/ExistentialAudio/BlackHole 下载 BlackHole（免费、开源）。\n___XYZ_分割___\n按照屏幕上的说明进行安装。无需重新启动。\n___XYZ_分割___\n在上面的下拉列表中选择“BlackHole 2ch”（或 16ch）。\n___XYZ_分割___\n在“系统设置”→“声音”中，您可以选择创建一个多输出设备来收听音频并同时路由它。\n___XYZ_分割___\n在 Discord、Zoom 或任何其他应用程序中，选择“BlackHole 2ch”作为麦克风。\n___XYZ_分割___\n在 GitHub 上打开 BlackHole\n___XYZ_分割___\n开始最小化到托盘\n___XYZ_分割___\n启动隐藏在系统托盘中的应用程序。与启动时启动相结合，它的行为就像 AirPlay/Chromecast：始终可用，永远不会妨碍您。\n___XYZ_分割___\n靠近托盘\n___XYZ_分割___\n关闭窗口时，最小化到系统托盘而不是退出。右键单击托盘图标即可永久退出。\n___XYZ_分割___\n显示窗口\n___XYZ_分割___\n隐藏到托盘\n___XYZ_分割___\n戒烟\n___XYZ_分割___\n在后台运行。右键单击托盘图标即可退出。\n___XYZ_分割___\n使用深色图标（浅色面板）\n___XYZ_分割___\n使用浅色图标（深色面板）\n___XYZ_分割___\n欢迎使用 WiFi 音频流！\n___XYZ_分割___\n感谢您安装该应用程序。这是您开始使用所需的一切。\n___XYZ_分割___\n获取 Android 应用程序\n___XYZ_分割___\n安装配套的 Android 应用程序以在手机或平板电脑上接收音频。免费且开源。\n___XYZ_分割___\n在 GitHub 上下载\n___XYZ_分割___\n从终端使用它
