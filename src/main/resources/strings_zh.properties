snapcast_codec_pcm_desc=未压缩。每个客户端在 48 kHz 立体声下的速度约为 1.5 Mbps，零编码延迟。\n___XYZ_分割___\n无损压缩。带宽大致减半，增加约 25 毫秒的编码延迟。\n___XYZ_分割___\n有损、最低带宽。需要 48000 Hz 立体声 16 位输入。\n___XYZ_分割___\nOpus 需要 48000 Hz 立体声。使用当前音频设置，服务器将回退到 PCM。\n___XYZ_分割___\n块大小\n___XYZ_分割___\n客户端缓冲区（毫秒）\n___XYZ_分割___\n客户提前多远安排播放。越高则越稳健，越低则反应越灵敏。\n___XYZ_分割___\n流名称\n___XYZ_分割___\n启动服务器以通过 mDNS 通告流。客户会自动发现它。\n___XYZ_分割___\nXYZPH0XYZ 此处不可用，而是作为 XYZPH1XYZ 进行流式传输\n___XYZ_分割___\n为 XYZPH2XYZ 客户端提供 XYZPH0XYZ (XYZPH1XYZ) 服务，XYZPH3XYZ 控制连接\n___XYZ_分割___\nXYZPH0XYZ - 音量 XYZPH1XYZ%%，延迟 XYZPH2XYZ 毫秒\n___XYZ_分割___\n在线\n___XYZ_分割___\n离线\n___XYZ_分割___\nSnapcast 多房间\n___XYZ_分割___\nXYZPH0XYZ 客户端同步播放\n___XYZ_分割___\n串流\n___XYZ_分割___\n控制\n___XYZ_分割___\n编解码器\n___XYZ_分割___\n发现\n___XYZ_分割___\n通过 mDNS 发布广告\n___XYZ_分割___\n未公布 - 手动连接\n___XYZ_分割___\n端口 XYZPH0XYZ 不可用\n___XYZ_分割___\n无法打开端口：XYZPH0XYZ。另一个 Snapcast 服务器可能已经在运行，或者防火墙正在阻止它。\n___XYZ_分割___\n如何连接
