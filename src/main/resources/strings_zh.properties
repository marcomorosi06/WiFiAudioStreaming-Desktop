auto_start_server=自动启动服务器\n___XYZ_分割___\n应用程序打开时自动启动服务器\n___XYZ_分割___\n自动启动模式\n___XYZ_分割___\n自动启动客户端\n___XYZ_分割___\n每隔约 10 秒自动连接到可用的优先 IP（您必须位于客户端连接页面才能正常工作）\n___XYZ_分割___\n优先IP\n___XYZ_分割___\n添加IP\n___XYZ_分割___\n连接声音\n___XYZ_分割___\n当客户端连接到服务器时播放声音\n___XYZ_分割___\n自定义连接声音\n___XYZ_分割___\n未选择文件（使用默认蜂鸣声）\n___XYZ_分割___\n浏览...\n___XYZ_分割___\n断开声音\n___XYZ_分割___\n当客户端与服务器断开连接时播放声音\n___XYZ_分割___\n原生音频引擎\n___XYZ_分割___\n使用原生 C 音频引擎（推荐）。在 Linux 上：通过 dlopen 的 PulseAudio/PipeWire，自动使扬声器静音。禁用回退到旧版 FFmpeg 采集器。\n___XYZ_分割___\n流媒体时将扬声器静音\n___XYZ_分割___\n在服务器捕获本地播放时将其静音，这样就不会听到两次音频。将其关闭以继续在此处以及在客户端上听到它。仅本机引擎；当服务器停止时，将恢复之前的状态。 CLI: --no-mute-render。\n___XYZ_分割___\n断开连接后保持服务器运行\n___XYZ_分割___\n在单播中，客户端离开会结束会话，而不是服务器：它保持端口打开并等待下一个客户端。多播已经以这种方式工作。\n___XYZ_分割___\n传入麦克风路由\n___XYZ_分割___\n选择如何处理从客户端收到的麦克风流\n___XYZ_分割___\n关闭\n___XYZ_分割___\n忽略客户端麦克风\n___XYZ_分割___\n虚拟麦克风
