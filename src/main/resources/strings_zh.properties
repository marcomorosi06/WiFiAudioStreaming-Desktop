snapcast_how_to_connect_auto=该网络上的客户端自行查找流。如果没有，请将其指向下面的地址。\n___XYZ_分割___\n自动发现已关闭，因此客户端必须明确指向该地址。\n___XYZ_分割___\n在 Snapcast 移动应用程序中通过 IP 添加服务器。在 Home Assistant 中，使用 Snapcast 与该主机和控制端口集成。\n___XYZ_分割___\n记住钥匙\n___XYZ_分割___\n存储在XYZPH0XYZ中，由系统加密。\n___XYZ_分割___\n不存储：每次启动时都会再次询问。\n___XYZ_分割___\n该系统上没有凭证存储，因此不会保存密钥：在每次启动时输入它，或设置 WFAS_AUTH_KEY。\n___XYZ_分割___\n自动启动前等待...\n___XYZ_分割___\n等待网络...\n___XYZ_分割___\n自动启动取消：60秒后无本地地址\n___XYZ_分割___\n自动启动取消：安全设置为密钥，但不保存密钥\n___XYZ_分割___\n启动延迟\n___XYZ_分割___\n服务器启动前等待的秒数。登录时网络通常还没有准备好，没有地址启动的服务器是无人找到的服务器。\n___XYZ_分割___\n等待网络\n___XYZ_分割___\n保持自动启动，直到该计算机具有可用的本地地址，最多一分钟。\n___XYZ_分割___\n起始量\n___XYZ_分割___\n服务器自动启动时应用的音量。离开以保留当前的。\n___XYZ_分割___\n自动启动安全\n___XYZ_分割___\n自动启动服务器的安全模式。继承使用通用设置； key 需要保存的预共享密钥。\n___XYZ_分割___\n继承\n___XYZ_分割___\n自动连接到 XYZPH0XYZ...\n___XYZ_分割___\nXYZPH0XYZ 已跳过：保存的密钥不可用\n___XYZ_分割___\n扫描间隔\n___XYZ_分割___\n检查列表的频率（以秒为单位）。\n___XYZ_分割___\n重试延迟
