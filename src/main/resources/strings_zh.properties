http_codec_aac_desc=亚克力？更高的延迟。 Safari、iOS、所有浏览器。当 Opus 客户端失败时使用。\n___XYZ_分割___\nRTP/PCM 流活动\n___XYZ_分割___\n复制或保存 SDP 文件以使用 VLC 或 FFplay 收听\n___XYZ_分割___\n复制SDP\n___XYZ_分割___\n将 SDP 保存到文件\n___XYZ_分割___\n网络接口（发现和组播）\n___XYZ_分割___\n如果您使用 VPN（例如 ZeroTier、Tailscale），请在此处选择其虚拟适配器以允许设备相互查找。\n___XYZ_分割___\n启用 RTP 流时会强制执行多播。\n___XYZ_分割___\n启用 HTTP 流时会强制执行多播。\n___XYZ_分割___\n启用 RTP 或 HTTP 流时会强制执行多播。\n___XYZ_分割___\n对于活动协议来说，多播是强制性的。\n___XYZ_分割___\n给我买杯咖啡\n___XYZ_分割___\n如果你喜欢这个应用程序，请给我一杯咖啡！ §2615\n___XYZ_分割___\n许可证\n___XYZ_分割___\nEUPL v1.2 \u2014 \u00a9 Marco Morosi\n___XYZ_分割___\n该项目根据欧盟公共许可证 v1.2 获得许可。所有知识产权均属于 Marco Morosi。该许可证授予您使用、研究、修改和重新分发该软件的权利，即使是修改后的形式，前提是您保留相同的许可证。\n___XYZ_分割___\n阅读完整的 EUPL v1.2 文本\n___XYZ_分割___\n在浏览器中打开 eupl.eu\n___XYZ_分割___\n开源许可证\n___XYZ_分割___\n第三方软件及其许可证\n___XYZ_分割___\n开源许可证\n___XYZ_分割___\n注意：Web 浏览器对 HTTP 流强制执行内部缓冲，这不可避免地会导致 1-3 秒的延迟。这是正常现象，无法绕过。\n___XYZ_分割___\nLinux 自启动配置\n___XYZ_分割___\n启动时启动\n___XYZ_分割___\n登录时自动启动应用程序
