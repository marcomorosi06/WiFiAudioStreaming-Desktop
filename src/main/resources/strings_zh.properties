protocol_dlna_title=DLNA / UPnP 渲染器\n___XYZ_分割___\n将音频推送到 AV 接收器、条形音箱和智能电视 — 无需应用程序\n___XYZ_分割___\nDLNA 媒体端口\n___XYZ_分割___\n渲染器连接回的 TCP 端口。必须可从渲染器访问。\n___XYZ_分割___\n音频格式\n___XYZ_分割___\n自动（协商）\n___XYZ_分割___\n询问每个渲染器支持什么并选择最佳匹配。受到推崇的。\n___XYZ_分割___\n未压缩的 16 位 PCM，~1.4 Mbps。最低的延迟，最广泛的兼容性。\n___XYZ_分割___\n流式 WAV 标头内未压缩的 PCM。对一些较旧的固件有帮助。\n___XYZ_分割___\n压缩后，约 320 kbps。当网络速度较慢或 Wi-Fi 拥塞时使用。\n___XYZ_分割___\n压缩的 AAC。高效，但渲染器支持最不稳定。\n___XYZ_分割___\n网络上的渲染器\n___XYZ_分割___\n重新扫描\n___XYZ_分割___\n正在搜索渲染器...\n___XYZ_分割___\n未找到 DLNA 渲染器。确保设备已打开且位于同一网络上。\n___XYZ_分割___\n流式传输开始时，系统会记住并自动重新连接选定的渲染器。\n___XYZ_分割___\n离线\n___XYZ_分割___\n后备\n___XYZ_分割___\n演奏\n___XYZ_分割___\n正在连接…\n___XYZ_分割___\n正在重试...\n___XYZ_分割___\n握手失败\n___XYZ_分割___\n复制诊断\n___XYZ_分割___\n清除选择\n___XYZ_分割___\n和
