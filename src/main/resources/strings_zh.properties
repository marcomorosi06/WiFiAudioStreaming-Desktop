mic_routing_virtual_desc=将麦克风作为虚拟输入设备提供给其他应用程序（Discord、Zoom...）\n___XYZ_分割___\n混入流中\n___XYZ_分割___\n将麦克风混合到发送回客户端的音频流中\n___XYZ_分割___\n将通过 pactl 自动创建名为“WFAS_VirtualMic”的虚拟接收器\n___XYZ_分割___\n检测到的虚拟电缆：XYZPH0XYZ\n___XYZ_分割___\n未检测到虚拟电缆。安装 VB-CABLE (Windows) 或 BlackHole/Loopback (macOS)，或手动选择设备\n___XYZ_分割___\n麦克风输出设备\n___XYZ_分割___\n麦克风将直接混合到输出音频流中\n___XYZ_分割___\n仅单播模式支持麦克风共享。禁用多播/RTP 才能使用它。\n___XYZ_分割___\n虚拟麦克风仅在单播模式下可用。混合到流中仍然可以在多播中工作。\n___XYZ_分割___\n麦克风静音\n___XYZ_分割___\n麦克风处于活动状态\n___XYZ_分割___\n麦克风输入设备\n___XYZ_分割___\n需要帮助设置吗？\n___XYZ_分割___\nWindows — VB-CABLE 设置\n___XYZ_分割___\n转至 vb-audio.com/Cable 并下载 VB-CABLE。\n___XYZ_分割___\n以管理员身份运行安装程序，然后重新启动电脑。\n___XYZ_分割___\n重新启动后，“电缆输入”将出现在上面的下拉列表中 - 选择它。\n___XYZ_分割___\n在 Discord、Zoom 或任何其他应用程序中，转到音频设置并选择“电缆输出”作为麦克风。\n___XYZ_分割___\n完成！流式音频现在将在这些应用程序中显示为您的麦克风。\n___XYZ_分割___\n打开 vb-audio.com/Cable\n___XYZ_分割___\nLinux — 自动虚拟接收器\n___XYZ_分割___\n无需安装。当流式传输开始时，会通过 pactl 自动创建一个名为“WFAS_VirtualMic”的虚拟接收器。\n___XYZ_分割___\n打开 pavucontrol（PulseAudio 音量控制）或 PipeWire 等效项。\n___XYZ_分割___\n在“录音”选项卡中，设置Discord/Zoom/等。从“WFAS_VirtualMic”捕获。
