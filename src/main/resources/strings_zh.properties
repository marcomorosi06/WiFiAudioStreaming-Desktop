welcome_privacy_detail=GitHub 是微软旗下的一家美国公司。每个请求都必须向他们透露您的 IP 地址以及请求时间。不会发送任何其他内容：没有帐户、没有标识符、没有使用数据。关闭此功能后，应用程序永远不会自行连接网络，您仍然可以随时从“设置”中手动检查。\n___XYZ_分割___\n每次启动时都会进行检查\n___XYZ_分割___\n关闭应用程序永远不会联系 GitHub\n___XYZ_分割___\n更多详情\n___XYZ_分割___\n细节较少\n___XYZ_分割___\n我看到你在 build.gradle 中做了什么。\n___XYZ_分割___\n看看你，正在破解你自己的本地文件。为自己感到骄傲吗？ ;)\n___XYZ_分割___\n无法播放此流：服务器发送 XYZPH0XYZ，此输出设备不支持。\n___XYZ_分割___\n开发商\n___XYZ_分割___\n开发者特色\n___XYZ_分割___\n显示高级实验选项\n___XYZ_分割___\n降噪\n___XYZ_分割___\n消除来自模拟源的电源嗡嗡声和嘶嘶声\n___XYZ_分割___\n强度：XYZPH0XYZ%%\n___XYZ_分割___\n仅适用于嘈杂的模拟发送器，例如对线路输出进行采样的微控制器。在干净的数字音频上，它只能添加伪影。如果发送器已经消除了其一侧的噪音，请勿使用它。\n___XYZ_分割___\n该服务器已经在流式传输到另一台设备。\n___XYZ_分割___\nUSB连接\n___XYZ_分割___\n通过 USB 串流\n___XYZ_分割___\n使用 USB 电缆代替 Wi-Fi。在 Android 手机上启用 USB 网络共享，然后应用程序会自行查找链接。\n___XYZ_分割___\nUSB 缓冲区（毫秒）\n___XYZ_分割___\n当 USB 链路处于活动状态时，使用抖动缓冲器代替音频缓冲器。更低意味着延迟更少，但丢失的风险更大。某些设备会突发传输 USB 数据包，因此需要比 Wi-Fi 更多的缓冲区，而不是更少。\n___XYZ_分割___\nUSB 模式已关闭。\n___XYZ_分割___\nUSB 链路处于活动状态：XYZPH0XYZ (XYZPH0XYZ)\n___XYZ_分割___\n未找到 USB 链接。连接手机并启用 USB 网络共享。\n___XYZ_分割___\n未找到 USB 链接。连接手机并启用 USB 网络共享。
