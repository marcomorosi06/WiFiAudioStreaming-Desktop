tray_unavailable_desc=该窗口无法隐藏到托盘中，因此关闭它会退出应用程序。\n___XYZ_分割___\n自动启动加密\n___XYZ_分割___\n对自动启动的服务器的音频进行加密。与一般设置不同，因为两者服务于不同的时刻：有人参与的会话可以保持畅通无阻以供检查，而自行启动并运行数小时的会话则值得加密。\n___XYZ_分割___\n加密的\n___XYZ_分割___\n未加密\n___XYZ_分割___\n继承目前意味着加密。\n___XYZ_分割___\n继承目前意味着不加密。\n___XYZ_分割___\n不捕捉\n___XYZ_分割___\n麦克风\n___XYZ_分割___\n系统音频\n___XYZ_分割___\n麦克风和系统音频\n___XYZ_分割___\n系统输出（环回）\n___XYZ_分割___\n混入流中\n___XYZ_分割___\n端口 XYZPH0XYZ 上的侦听器\n___XYZ_分割___\n立即捕捉\n___XYZ_分割___\n打开捕获日志\n___XYZ_分割___\n将音量重置为 100%\n___XYZ_分割___\n高于 100% 的是数字增益：大声的段落剪辑。
auto_start_encryption_title=Auto-start Encryption
auto_start_encryption_desc=Encrypt the audio of the automatically started server. Separate from the general setting, because the two serve different moments: an attended session can stay in the clear for inspection, while one that starts by itself and runs for hours is worth encrypting.
