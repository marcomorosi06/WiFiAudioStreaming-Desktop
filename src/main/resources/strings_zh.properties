qr_pairing_self_body=该邀请是由同一设备生成的，因此没有任何可连接的内容。从应接收音频的设备上扫描它。\n___XYZ_分割___\n明白了\n___XYZ_分割___\n这是你自己的代码\n___XYZ_分割___\n另一台设备拒绝了此邀请。它可能已被更新的密钥替换，或者组密钥已重新生成。要求一个新的代码。\n___XYZ_分割___\n扫描新代码\n___XYZ_分割___\n关闭\n___XYZ_分割___\n邀请不再有效\n___XYZ_分割___\n重新生成密钥\n___XYZ_分割___\n扫描二维码\n___XYZ_分割___\n关闭扫描仪\n___XYZ_分割___\n该邀请已过期。要求一份新鲜的。\n___XYZ_分割___\n已找到邀请\n___XYZ_分割___\n将相机对准其他设备显示的二维码。\n___XYZ_分割___\n嗯……你想让我扫描一下吗？这不是 WFAS 二维码！\n___XYZ_分割___\n扫描邀请码\n___XYZ_分割___\n火炬\n___XYZ_分割___\n二维码\n___XYZ_分割___\n为每个邀请自动生成一个随机密钥 - 比手动选择的密码更安全。无需记住或大声说出密码。\n___XYZ_分割___\n自动生成密钥\n___XYZ_分割___\n在密钥模式下密钥不能为空。在“安全性”下输入一个，或切换到二维码，让其为您生成。\n___XYZ_分割___\n钥匙丢失\n___XYZ_分割___\n发件人更改了组密钥\n___XYZ_分割___\n无法在多播组上发送：XYZPH0XYZ\n___XYZ_分割___\n连接方式\n___XYZ_分割___\n如何连接
