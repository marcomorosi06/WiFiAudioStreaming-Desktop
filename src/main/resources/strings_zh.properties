usb_diag_macos=未找到 USB 链接。 macOS 没有内置的 RNDIS 驱动程序，因此 Android USB 网络共享通常在这里不起作用；使用 Wi-Fi 代替。\n___XYZ_分割___\n找到 USB 适配器 (XYZPH0XYZ)，但没有 IP 地址。设备上的 USB 网络共享可能仍处于关闭状态。\n___XYZ_分割___\nUSB接口\n___XYZ_分割___\n保留“自动”，除非检测选择了错误的适配器。没有 IP 地址的适配器也被列出，因此您可以区分过时的驱动程序和实时驱动程序。\n___XYZ_分割___\n汽车\n___XYZ_分割___\nXYZPH0XYZ（无 IP）\n___XYZ_分割___\n通过 USB 发送\n___XYZ_分割___\n通过电缆而不是 Wi-Fi 流式传输到手机。\n___XYZ_分割___\n通过 USB 接收\n___XYZ_分割___\n通过电缆而不是 Wi-Fi 收听电话。\n___XYZ_分割___\n此电缆上的设备出现在标记为 USB 的列表中。\n___XYZ_分割___\n连接手机并启用 USB 网络共享。\n___XYZ_分割___\n电缆已被识别。打开设备上的 USB 网络共享，以便它分发地址。\n___XYZ_分割___\nUSB\n___XYZ_分割___\n无线网络\n___XYZ_分割___\nWFAS 可用性\n___XYZ_分割___\n选择此设备何时提供本机 WFAS 协议。 “连接 USB 时关闭”使 WFAS 保持在网络上，但一旦 USB 链路出现就将其抑制。\n___XYZ_分割___\n始终开启\n___XYZ_分割___\n连接 USB 时熄灭\n___XYZ_分割___\n关闭\n___XYZ_分割___\n关闭 WFAS 后，您至少需要启用一种其他协议或有效的 USB 连接才能启动流。\n___XYZ_分割___\n无可用协议\n___XYZ_分割___\n激活 WFAS 协议\n___XYZ_分割___\n通过 USB 连接\n___XYZ_分割___\n无线连接
