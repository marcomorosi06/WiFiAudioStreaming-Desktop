qr_pairing_deeplink_confirm_body_multicast=检测到用于多播接收的 WFAS 邀请。您现在想连接吗？\n___XYZ_分割___\n检测到 WFAS 邀请用于从该设备进行流式传输。您现在想连接吗？\n___XYZ_分割___\n连接\n___XYZ_分割___\n忽略\n___XYZ_分割___\n该设备正在传输。连接将停止该传输。\n___XYZ_分割___\n连接到 XYZPH0XYZ？\n___XYZ_分割___\n该多播组的密钥在代码生成后被更新。向广播设备请求新的邀请。\n___XYZ_分割___\n明白了\n___XYZ_分割___\n这个群已经变了\n___XYZ_分割___\n出于安全原因，此代码不再有效。生成新邀请以继续。\n___XYZ_分割___\n生成新代码\n___XYZ_分割___\n关闭\n___XYZ_分割___\n二维码已过期\n___XYZ_分割___\n扫描的代码不是有效的 WFAS 邀请。确保您正在扫描其他设备生成的代码。\n___XYZ_分割___\n取消\n___XYZ_分割___\n再试一次\n___XYZ_分割___\n代码无法识别\n___XYZ_分割___\n未检测到网络摄像头。您仍然可以手动输入地址和密钥。\n___XYZ_分割___\n关闭\n___XYZ_分割___\n手动输入\n___XYZ_分割___\n相机不可用\n___XYZ_分割___\n所有连接的设备都必须重新配对。如果您认为未经授权的设备知道当前密钥，请使用此选项。\n___XYZ_分割___\n取消\n___XYZ_分割___\n再生\n___XYZ_分割___\n重新生成组密钥？
