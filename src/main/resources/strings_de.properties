welcome_privacy_title=Automatische Update-Prüfung
welcome_privacy_desc=Bei jedem Start fragt die App GitHub, ob eine neuere Version existiert.
welcome_privacy_detail=GitHub ist ein US-amerikanisches Unternehmen im Besitz von Microsoft. Bei jeder Anfrage werden zwingend Ihre IP-Adresse und der Zeitpunkt der Anfrage an den Nutzer weitergegeben. Es wird nichts anderes gesendet: kein Konto, keine Kennung, keine Nutzungsdaten. Wenn Sie diese Option deaktivieren, nimmt die App nie selbst Kontakt mit dem Netzwerk auf. Sie können dies jederzeit manuell in den Einstellungen überprüfen.
welcome_privacy_on=7 Kontrollen bei jedem Start
welcome_privacy_off=Ab 7 nimmt die App nie Kontakt zu GitHub auf
