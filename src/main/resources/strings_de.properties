vcable_help_button=Benötigen Sie Hilfe beim Einrichten?
vcable_help_win_title=Windows – VB-CABLE-Setup
vcable_help_win_1=Gehen Sie zu vb-audio.com/Cable und laden Sie VB-CABLE herunter.
vcable_help_win_2=Führen Sie das Installationsprogramm als Administrator aus und starten Sie dann Ihren PC neu.
vcable_help_win_3=Nach dem Neustart erscheint „CABLE Input“ im Dropdown-Menü oben – wählen Sie es aus.
vcable_help_win_4=Gehen Sie in Discord, Zoom oder einer anderen App zu den Audioeinstellungen und wählen Sie „CABLE Output“ als Mikrofon.
vcable_help_win_5=Fertig! Das gestreamte Audio wird nun in diesen Apps als Ihr Mikrofon angezeigt.
vcable_help_win_link=Öffnen Sie vb-audio.com/Cable
vcable_help_linux_title=Linux – Automatische virtuelle Senke
vcable_help_linux_1=Keine Installation erforderlich. Wenn das Streaming startet, wird über pactl automatisch eine virtuelle Senke namens „WFAS_VirtualMic“ erstellt.
vcable_help_linux_2=Öffnen Sie pavucontrol (PulseAudio Volume Control) oder ein PipeWire-Äquivalent.
vcable_help_linux_3=Stellen Sie im Reiter „Aufnahme“ Discord/Zoom/usw. ein. zum Aufnehmen von „WFAS_VirtualMic“.
vcable_help_linux_4=Das gestreamte Audio wird nun in diesen Apps als Mikrofon angezeigt.
vcable_help_linux_link=Pavucontrol installieren
vcable_help_mac_title=macOS – BlackHole-Setup
vcable_help_mac_1=Laden Sie BlackHole (kostenlos, Open Source) von github.com/ExistentialAudio/BlackHole herunter.
vcable_help_mac_2=Installieren Sie es gemäß den Anweisungen auf dem Bildschirm. Kein Neustart erforderlich.
vcable_help_mac_3=Wählen Sie im Dropdown-Menü oben „BlackHole 2ch“ (oder 16ch) aus.
vcable_help_mac_4=Unter Systemeinstellungen → Ton können Sie optional ein Multi-Output-Gerät erstellen, um den Ton zu hören und ihn gleichzeitig weiterzuleiten.
vcable_help_mac_5=Wählen Sie in Discord, Zoom oder einer anderen App „BlackHole 2ch“ als Mikrofon.
vcable_help_mac_link=Öffnen Sie BlackHole auf GitHub
start_minimized_tray=In Fach minimiert starten
start_minimized_tray_desc=Starten Sie die in der Taskleiste versteckte App. In Kombination mit „Beim Start starten“ verhält es sich wie AirPlay/Chromecast: immer verfügbar, nie im Weg.
close_to_tray=In der Nähe des Tabletts
close_to_tray_desc=Wenn Sie das Fenster schließen, verkleinern Sie es in die Taskleiste, anstatt es zu beenden. Klicken Sie mit der rechten Maustaste auf das Taskleistensymbol, um den Vorgang endgültig zu beenden.
