protocol_incompatible_body=Die beiden Apps führen inkompatible WFAS-Protokollversionen aus (dieses Gerät: v%1$d, anderes Ende: v%2$d). Die Verbindung wurde geschlossen. Bitte aktualisieren Sie, damit auf beiden Geräten die neueste Version läuft.
