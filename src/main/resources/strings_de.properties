usb_section=USB-Verbindung
usb_mode=Streamen Sie über USB
usb_mode_desc=Verwenden Sie das USB-Kabel anstelle von WLAN. Aktivieren Sie USB-Tethering auf dem Android-Telefon, dann findet die App den Link selbstständig.
usb_latency=USB-Puffer (ms)
usb_latency_desc=Jitter-Puffer wird anstelle des Audiopuffers verwendet, während die USB-Verbindung aktiv ist. Niedriger bedeutet weniger Latenz, aber ein höheres Risiko von Aussetzern. Einige Geräte liefern USB-Pakete in Schüben und benötigen hier mehr Puffer als über WLAN, nicht weniger.
usb_diag_disabled=Der USB-Modus ist ausgeschaltet.
usb_diag_ready=USB-Link aktiv: %s (%s)
usb_diag_windows=Kein USB-Link gefunden. Schließen Sie das Telefon an und aktivieren Sie USB-Tethering.
usb_diag_linux=Kein USB-Link gefunden. Schließen Sie das Telefon an und aktivieren Sie USB-Tethering.
usb_diag_macos=Kein USB-Link gefunden. macOS verfügt über keinen integrierten RNDIS-Treiber, daher funktioniert Android USB-Tethering hier normalerweise nicht; Verwenden Sie stattdessen WLAN.
usb_diag_no_ip=USB-Adapter gefunden (%s), aber er hat keine IP-Adresse. USB-Tethering ist auf dem Gerät wahrscheinlich immer noch deaktiviert.
usb_interface=USB-Schnittstelle
usb_interface_desc=Lassen Sie die Einstellung „Auto“, es sei denn, die Erkennung wählt den falschen Adapter aus. Adapter ohne IP-Adresse werden ebenfalls aufgelistet, sodass Sie einen veralteten Treiber vom aktiven unterscheiden können.
usb_interface_auto=Automatisch
usb_interface_no_ip=%s (keine IP)
usb_send_label=Über USB senden
usb_send_hint=Streamen Sie über das Kabel statt über WLAN auf das Telefon.
usb_receive_label=Über USB empfangen
usb_receive_hint=Hören Sie Ihre Telefongespräche über das Kabel statt über WLAN.
usb_panel_hint_ready=Geräte an diesem Kabel erscheinen in der Liste mit der Bezeichnung USB.
usb_panel_hint_waiting=Schließen Sie das Telefon an und aktivieren Sie USB-Tethering.
usb_panel_hint_no_ip=Das Kabel wird erkannt. Aktivieren Sie USB-Tethering am Gerät, damit es eine Adresse ausgibt.
usb_transport_label=USB
usb_transport_wifi=WLAN
wfas_mode_label=WFAS-Verfügbarkeit
wfas_mode_desc=Wählen Sie aus, wann dieses Gerät das native WFAS-Protokoll unterstützt. „Aus, wenn USB angeschlossen ist“ hält WFAS im Netzwerk, unterdrückt es jedoch, sobald die USB-Verbindung hergestellt wird.
wfas_mode_always=Immer an
wfas_mode_off_on_usb=Aus, wenn USB angeschlossen ist
wfas_mode_off=Aus
wfas_no_protocol_desc=Wenn WFAS ausgeschaltet ist, benötigen Sie mindestens ein anderes aktiviertes Protokoll oder eine aktive USB-Verbindung, um einen Stream zu starten.
