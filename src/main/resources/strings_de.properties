update_ahead_body=Schauen Sie sich an, wie Sie Ihre eigene lokale Datei hacken. Stolz auf dich? ;)
status_unsupported_format=Dieser Stream kann nicht abgespielt werden: Der Server sendet %1$s, was dieses Ausgabegerät nicht unterstützt.
