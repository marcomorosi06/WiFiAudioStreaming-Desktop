nr_hint=Nur für verrauschte analoge Sender, z. B. einen Mikrocontroller, der einen Line-Out abtastet. Bei sauberem digitalem Audio können nur Artefakte hinzugefügt werden. Verwenden Sie es nicht, wenn der Sender auf seiner Seite bereits Rauschen entfernt.
