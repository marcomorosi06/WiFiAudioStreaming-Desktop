status_server_silent_maybe_outdated=Der Server antwortet nicht auf die Verbindungsanfrage. Wenn Sie es in der Liste sehen, es aber keine Verbindung herstellt, wird wahrscheinlich eine ältere Version der App ausgeführt: Aktualisieren Sie sie auf diesem Gerät.
