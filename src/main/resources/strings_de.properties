protocol_incompatible_body_receiver=Auf dem empfangenden Gerät wird eine ältere Version der App ausgeführt (WFAS-Protokoll v%2$d, dieses Gerät verwendet v%1$d), daher wurde die Verbindung geschlossen. Aktualisieren Sie die App auf dem empfangenden Gerät.
protocol_incompatible_body_local=Auf diesem Gerät wird eine ältere Version der App ausgeführt (WFAS-Protokoll v%1$d, das andere Gerät verwendet v%2$d), daher wurde die Verbindung geschlossen. Aktualisieren Sie die App auf diesem Gerät.
