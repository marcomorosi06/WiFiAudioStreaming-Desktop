auto_start_delay_desc=서버가 시작되기 전에 기다리는 시간(초)입니다. 로그인 시 네트워크가 아직 준비되지 않은 경우가 많으며 주소 없이 시작되는 서버는 아무도 찾지 못하는 서버입니다.\n_
auto_start_network_title=네트워크를 기다리세요\n_
auto_start_network_desc=이 컴퓨터가 사용 가능한 로컬 주소를 가질 때까지 최대 1분 동안 자동 시작을 보류합니다.\n_
auto_start_volume_title=볼륨 시작\n_
auto_start_volume_desc=서버 자동 시작 시 적용되는 볼륨입니다. 현재 항목을 유지하려면 끄세요.\n_
auto_start_security_title=자동 시작 보안\n_
auto_start_security_desc=자동으로 시작된 서버의 보안 모드입니다. 상속은 일반 설정을 사용합니다. 키에는 저장된 사전 공유 키가 필요합니다.\n_
auto_start_security_inherit=상속\n_

# --- Auto-connect client (5.3) ---
auto_connect_connecting=%s에 자동 연결 중...\n_
