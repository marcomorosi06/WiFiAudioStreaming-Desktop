usb_diag_macos=USB 링크를 찾을 수 없습니다. macOS에는 내장 RNDIS 드라이버가 없으므로 Android USB 테더링은 일반적으로 여기서 작동하지 않습니다. 대신 Wi-Fi를 사용하세요.\n_
