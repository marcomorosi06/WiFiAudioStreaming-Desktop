welcome_privacy_desc=시작할 때마다 앱은 GitHub에 최신 버전이 있는지 묻습니다.
welcome_privacy_detail=GitHub는 Microsoft가 소유한 미국 회사입니다. 모든 요청에는 반드시 요청 시간과 함께 귀하의 IP 주소가 공개됩니다. 계정, 식별자, 사용 데이터 등 다른 어떤 것도 전송되지 않습니다. 이 기능을 끄면 앱이 자체적으로 네트워크에 연결하지 않습니다. 언제든지 설정에서 수동으로 확인할 수 있습니다.\n_
