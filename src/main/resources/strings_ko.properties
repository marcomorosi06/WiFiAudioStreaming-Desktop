usb_mode=USB를 통해 스트리밍\n_
usb_mode_desc=Wi-Fi 대신 USB 케이블을 사용하세요. Android 휴대폰에서 USB 테더링을 활성화하면 앱이 자체적으로 링크를 찾습니다.\n_
