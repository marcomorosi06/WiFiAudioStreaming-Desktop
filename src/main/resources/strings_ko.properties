# --- Tray (5.3) ---
tray_unavailable_title=트레이 아이콘을 사용할 수 없습니다.
tray_unavailable_desc=창은 트레이에 숨길 수 없으므로 창을 닫으면 앱이 종료됩니다.\n_
auto_start_encryption_title=암호화 자동 시작\n_
auto_start_encryption_desc=자동으로 시작된 서버의 오디오를 암호화합니다. 두 가지가 서로 다른 순간을 제공하기 때문에 일반 설정과 별개입니다. 참석한 세션은 검사를 위해 암호화되지 않은 상태로 유지될 수 있는 반면, 자체적으로 시작되어 몇 시간 동안 실행되는 세션은 암호화할 가치가 있습니다.\n_
auto_start_encryption_on=암호화됨\n_
auto_start_encryption_off=암호화되지 않음\n_
auto_start_encryption_inherit_on=상속은 현재 암호화됨을 의미합니다.\n_
auto_start_encryption_inherit_off=상속은 현재 암호화되지 않음을 의미합니다.\n_

