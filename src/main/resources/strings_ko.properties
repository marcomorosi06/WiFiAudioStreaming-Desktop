auto_connect_prompt_key_title=열쇠를 요청하세요\n_
auto_connect_prompt_key_desc=서버가 키를 요청하는 경우 이 항목은 저장되지 않았습니다. 키 대화 상자를 표시하거나 해당 서버를 건너뜁니다. 기본적으로 꺼져 있습니다. 아무도 응답할 수 없는 창에서는 무인 재연결을 중지할 수 없기 때문입니다.\n_
auto_connect_targets=저장된 서버\n_
auto_connect_add=서버 추가\n_
auto_connect_key_no_vault=시스템 키링에 접근할 수 없으므로 키를 안전하게 저장할 수 없습니다. Linux에서는 'secret-tool'(libsecret 패키지)을 설치하고 다시 시작하세요.\n_
secret_vault_title=자격 증명 저장소 문제\n_
secret_vault_consequence=이 문제가 해결될 때까지 여기에 입력한 키는 기억되지 않습니다.\n_
secret_vault_no_store_linux=연결할 수 있는 시스템 키링이 없습니다. 'secret-tool'(libsecret 패키지)을 설치하고 다시 시작하세요.\n_
secret_vault_no_store_windows=이 시스템에서는 Windows 자격 증명 보호(DPAPI)를 사용할 수 없습니다.\n_
secret_vault_no_store_macos=이 시스템에서는 macOS 키체인을 사용할 수 없습니다.\n_
