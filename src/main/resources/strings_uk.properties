mic_routing_mix_info=Мікрофон буде мікшований безпосередньо у вихідний аудіопотік
mic_routing_unicast_only=Спільний доступ до мікрофона підтримується лише в одноадресному режимі. Вимкніть multicast/RTP, щоб використовувати його.
mic_routing_virtual_unicast_only=Віртуальний мікрофон доступний лише в одноадресному режимі. Змішування в потік все ще працює в груповій розсилці.
mic_muted=Мікрофон вимкнено
mic_active=Мікрофон активний
mic_routing_mix_input_device=Пристрій введення мікрофона

vcable_help_button=Потрібна допомога з налаштуванням?
vcable_help_win_title=Windows — налаштування VB-CABLE
vcable_help_win_1=Перейдіть на сайт vb-audio.com/Cable і завантажте VB-CABLE.
vcable_help_win_2=Запустіть програму встановлення від імені адміністратора, а потім перезавантажте ПК.
vcable_help_win_3=Після перезапуску у спадному списку вище з’явиться «CABLE Input» — виберіть його.
vcable_help_win_4=У Discord, Zoom або будь-якій іншій програмі перейдіть до налаштувань звуку та виберіть «CABLE Output» як мікрофон.
vcable_help_win_5=Готово! Потокове аудіо тепер відображатиметься як ваш мікрофон у цих програмах.
vcable_help_win_link=Відкрийте vb-audio.com/Cable
vcable_help_linux_title=Linux — автоматичний віртуальний приймач
vcable_help_linux_1=Установка не потрібна. Коли починається трансляція, за допомогою pactl автоматично створюється віртуальний приймач під назвою "WFAS_VirtualMic".
vcable_help_linux_2=Відкрийте pavucontrol (PulseAudio Volume Control) або еквівалент PipeWire.
vcable_help_linux_3=У вкладці «Запис» встановіть Discord/Zoom тощо. для захоплення з "WFAS_VirtualMic".
vcable_help_linux_4=Потокове аудіо тепер відображатиметься як мікрофон у цих програмах.
vcable_help_linux_link=Встановити pavucontrol
vcable_help_mac_title=macOS — налаштування BlackHole
vcable_help_mac_1=Завантажте BlackHole (безкоштовно, з відкритим кодом) з github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Встановіть його, дотримуючись інструкцій на екрані. Перезапуск не потрібен.
vcable_help_mac_3=Виберіть «BlackHole 2ch» (або 16ch) у спадному списку вище.
vcable_help_mac_4=У «Системних параметрах» → «Звук» ви можете додатково створити пристрій із кількома вихідними сигналами, щоб слухати аудіо та одночасно направляти його.
vcable_help_mac_5=У Discord, Zoom або будь-якому іншому додатку виберіть «BlackHole 2ch» як мікрофон.
vcable_help_mac_link=Відкрийте BlackHole на GitHub
start_minimized_tray=Почати згорнуто в трей
start_minimized_tray_desc=Запустіть програму, приховану в системному треї. У поєднанні з Launch at Startup він поводиться як AirPlay/Chromecast: завжди доступний, ніколи не заважає.
close_to_tray=Близько до Трая
close_to_tray_desc=Коли ви закриєте вікно, згорніть його до системного лотка замість виходу. Щоб вийти назавжди, клацніть правою кнопкою миші значок у треї.
tray_show_window=Показати вікно
tray_hide_window=Сховатися в трей
tray_quit=Вийти
tray_running_in_background=Працює у фоновому режимі. Щоб вийти, клацніть правою кнопкою миші піктограму на панелі задач.
tray_icon_dark=Використовувати темний значок (світлі панелі)
tray_icon_light=Використовувати світлий значок (темні панелі)
# Welcome screen (GUI)
welcome_title=Ласкаво просимо до потокового передавання аудіо через WiFi!
welcome_thanks=Дякуємо за встановлення програми. Ось усе, що вам потрібно для початку.
welcome_android_title=Завантажте програму для Android
welcome_android_body=Установіть додаткову програму для Android, щоб отримувати аудіо на свій телефон або планшет. Безкоштовний і відкритий код.
welcome_android_btn=Завантажити на GitHub
welcome_cli_title=Використовуйте його з терміналу
welcome_cli_body=Ви можете керувати програмою з будь-якого терміналу за допомогою команди wfas. Натисніть нижче, щоб додати його до свого ШЛЯХУ.
welcome_cli_btn=Додайте wfas до PATH
welcome_get_started=Почніть роботу

# CLI welcome (terminal)
cli_welcome_thanks=дякую за встановлення!
cli_welcome_path_tip=Порада: додайте wfas до свого PATH для швидкого доступу.
cli_welcome_path_how=Запустіть програму GUI > Налаштування > Команда CLI > Встановити

# CLI PATH
cli_group_title=Команда CLI (wfas)
cli_install_title=Встановіть wfas у PATH
cli_install_desc=Додає команду wfas до PATH вашої системи, щоб ви могли запускати її з будь-якого терміналу. Запустіть знову, якщо ви перемістите програму, щоб оновити шлях.
cli_status_installed=wfas встановлено та оновлено
cli_status_not_installed=Не встановлено
cli_btn_install=встановити
cli_btn_update=Оновити PATH
cli_install_success_title=встановлено
cli_install_success_body=Команда wfas тепер доступна у вашому PATH. Щоб використовувати його, відкрийте новий термінал.
cli_install_terminal_title=Термінал відкрито
cli_install_terminal_body=Відкрилося вікно терміналу для завершення встановлення з правами адміністратора. Коли він закриється, відкрийте новий термінал і запустіть: wfas --help
cli_install_failure_title=Помилка встановлення

show_welcome_screen=Показати екран привітання
reset_all_settings=Скинути всі налаштування
reset_all_settings_desc=Відновіть усі налаштування до стандартних значень
reset_all_settings_confirm_title=Скинути всі налаштування?
reset_all_settings_confirm_body=Це відновить усі параметри до значень за замовчуванням. Цю дію не можна скасувати.
reset=Скинути
fw_group_title=Брандмауер
fw_title=Дозволити через брандмауер Windows
fw_status_active=Правило активне
fw_status_inactive=Не налаштовано
fw_desc=Якщо пристрій не може підключитися та залишається в режимі очікування, дозвольте вхідний трафік на цих портах UDP. Потрібне одноразове схвалення адміністратора.
fw_ports_label=UDP порти
fw_title_linux=Дозволити через брандмауер
fw_detected_firewalld=брандмауер активний у цій системі
fw_detected_ufw=ufw активний у цій системі
fw_desc_linux=Якщо пристрій не може підключитися та залишається в режимі очікування, вхідний UDP на цих портах, ймовірно, заблоковано. Виконайте наведену нижче команду в терміналі.
fw_copy_btn=Копіювати команду
fw_btn=Дозволити
fw_result_success_title=Брандмауер оновлено
fw_result_success_body=Вхідний UDP тепер дозволений на вибраних портах. Пристрої повинні мати можливість підключатися.
fw_result_denied_title=Не застосовується
fw_result_denied_body=Зміна потребує схвалення адміністратора. Ще раз натисніть «Дозволити» та прийміть підказку Windows.
fw_result_failure_title=Помилка
fw_result_unsupported_body=Ця функція доступна лише в Windows.
startup_window=Запуск і вікно
sounds_group=Звуки
system_group=система
info_group=Інформація
update_download_site=Завантажити з сайту
update_download_github=Завантажити з GitHub
welcome_privacy_title=Автоматична перевірка оновлень
welcome_privacy_desc=Під час кожного запуску програма запитує GitHub, чи існує новіша версія.
welcome_privacy_detail=GitHub — американська компанія, що належить Microsoft. Кожен запит обов’язково розкриває їм вашу IP-адресу разом із часом запиту. Більше нічого не надсилається: ні облікового запису, ні ідентифікатора, ні даних про використання. Вимкніть це, і програма ніколи не зв’язуватиметься з мережею самостійно; ви все одно зможете будь-коли перевірити вручну в налаштуваннях.
welcome_privacy_on=On \u00b7 перевіряє при кожному запуску
welcome_privacy_off=Вимкнено \u00b7 програма ніколи не зв’язується з GitHub
more_details=Детальніше
less_details=Менше деталей
update_ahead_title=Я бачу, що ви зробили там у build.gradle.
update_ahead_body=Подивіться на себе, зламуючи ваш власний локальний файл. пишається собою? ;)
status_unsupported_format=Неможливо відтворити цей потік: сервер надсилає %1$s, який цей пристрій виведення не підтримує.
developer_group=Розробник
developer_title=Особливості розробника
developer_desc=Показати розширені, експериментальні варіанти
nr_title=Зменшення шуму
nr_desc=Очищає гул і шипіння в мережі з аналогових джерел
nr_strength=Міцність: %1$d%%
nr_hint=Лише для шумних аналогових передавачів, таких як мікроконтролер, який виконує вибірку лінійного виходу. На чистому цифровому аудіо він може лише додати артефакти. Не використовуйте його, якщо відправник уже видаляє шум на своїй стороні.
status_server_busy=Цей сервер уже транслює на інший пристрій.

usb_section=USB-з’єднання
usb_mode=Потік через USB
usb_mode_desc=Використовуйте кабель USB замість Wi-Fi. Увімкніть USB-модем на телефоні Android, тоді програма самостійно знайде посилання.
usb_latency=Буфер USB (мс)
usb_latency_desc=Буфер джиттера використовується замість аудіо, коли USB-з’єднання активне. Нижче означає меншу затримку, але більший ризик вибуття. Деякі пристрої доставляють USB-пакети пакетами, і тут потрібно більше буфера, ніж через Wi-Fi, не менше.
usb_diag_disabled=Режим USB вимкнено.
usb_diag_ready=USB-з’єднання активне: %s (%s)
usb_diag_windows=USB-з’єднання не знайдено. Підключіть телефон і ввімкніть на ньому USB-модем.
usb_diag_linux=USB-з’єднання не знайдено. Підключіть телефон і ввімкніть на ньому USB-модем.
usb_diag_macos=USB-з’єднання не знайдено. macOS не має вбудованого драйвера RNDIS, тому USB-модем Android тут зазвичай не працює; натомість використовуйте Wi-Fi.
usb_diag_no_ip=USB-адаптер знайдено (%s), але він не має IP-адреси. Імовірно, USB-модем на пристрої все ще вимкнено.
usb_interface=інтерфейс USB
usb_interface_desc=Залиште на Auto, якщо виявлення не вибере неправильний адаптер. Адаптери без IP-адреси також перераховані, тож ви можете відрізнити застарілий драйвер від активного.
usb_interface_auto=Авто
usb_interface_no_ip=%s (без IP)
usb_send_label=Надіслати через USB
usb_send_hint=Потік на телефон через кабель замість Wi-Fi.
usb_receive_label=Отримувати через USB
usb_receive_hint=Слухайте телефон через кабель замість Wi-Fi.
usb_panel_hint_ready=Пристрої, підключені до цього кабелю, відображаються в списку з позначкою USB.
usb_panel_hint_waiting=Підключіть телефон і ввімкніть на ньому USB-модем.
usb_panel_hint_no_ip=Кабель розпізнано. Увімкніть USB-модем на пристрої, щоб він передав адресу.
usb_transport_label=USB
usb_transport_wifi=Wi-Fi
wfas_mode_label=Доступність WFAS
wfas_mode_desc=Виберіть, коли цей пристрій обслуговує рідний протокол WFAS. «Вимкнено, коли підключено USB» утримує WFAS у мережі, але пригнічує його, щойно з’являється з’єднання USB.
wfas_mode_always=Завжди ввімкнено
wfas_mode_off_on_usb=Вимкнено, коли підключено USB
wfas_mode_off=Вимкнено
wfas_no_protocol_desc=Якщо WFAS вимкнено, вам потрібен принаймні один інший протокол або активне USB-з’єднання, щоб почати трансляцію.
wfas_no_protocol_title=Немає протоколу
wfas_activate_action=Активуйте протокол WFAS
link_connected_usb=ПІДКЛЮЧЕНО ЧЕРЕЗ USB
link_connected_wireless=ПІДКЛЮЧЕНО БЕЗДРОТОВО

protocol_dlna_title=Рендерери DLNA / UPnP
protocol_dlna_desc=Передайте аудіо на аудіо-відео-ресивери, звукові панелі та смарт-телевізори — жодних програм не потрібно
dlna_port=медіапорт DLNA
dlna_port_hint=Порт TCP, до якого рендерер підключається. Має бути доступним із рендерера.
dlna_format_label=Формат аудіо
dlna_format_auto=Автоматичний (договірна)
dlna_format_auto_desc=Запитайте кожен рендерер, що він підтримує, і виберіть найкращий варіант. Рекомендовано.
dlna_format_lpcm_desc=16-бітний PCM без стиснення, ~1,4 Мбіт/с. Найнижча затримка, найширша сумісність.
dlna_format_wav_desc=Нестиснутий PCM у потоковому заголовку WAV. Допомагає деяким старішим прошивкам.
dlna_format_mp3_desc=Стиснений, ~320 кбіт/с. Використовуйте, коли мережа повільна або Wi-Fi перевантажений.
dlna_format_adts_desc=Стиснений AAC. Ефективно, але підтримка рендерера є найменш послідовною.
dlna_devices_label=Рендерери в мережі
dlna_rescan=Повторне сканування
dlna_scanning=Пошук рендерів…
dlna_no_devices=DLNA рендерер не знайдено. Переконайтеся, що пристрій увімкнено та в одній мережі.
dlna_selection_hint=Вибрані рендерери запам’ятовуються та повторно підключаються автоматично, коли починається трансляція.
dlna_offline=Офлайн
dlna_fallback=запасний варіант
dlna_state_playing=Граючи
dlna_state_connecting=Підключення…
dlna_state_retrying=Повторна спроба…
dlna_state_error=Рукостискання не вдалося
dlna_copy_diagnostics=Діагностика копій
dlna_clear_selection=Очистити вибір
list_and=і
status_serving_protocols=Потокова трансляція з %s
dlna_card_title=Вихід DLNA
dlna_card_endpoint=Кінцева точка медіа
dlna_card_format=Формат
dlna_card_no_targets=Рендерер не вибрано. Виберіть один у налаштуваннях.
dlna_card_connections=%d активне(і) підключення(а)

# QR pairing
qr_invite_button=Запросити
qr_invite_button_multicast=Пристрій запрошення
qr_invite_close=Закрити
qr_invite_content_description=Згенеруйте код запрошення
qr_invite_copied=Ключ скопійовано
qr_invite_copy=Копія
qr_invite_countdown=Термін дії закінчується через %1$s
qr_invite_encryption_note=Було ввімкнено шифрування аудіо: група багатоадресної передачі не має рукостискання, тому без нього ключ нічого не захистить.
qr_invite_endpoint=%1$s · порт %2$d
qr_invite_expired_pill=Термін дії минув
qr_invite_key_hide=Приховати ключ
qr_invite_key_label=Ключ (введення вручну)
qr_invite_key_reveal=Показати ключ
qr_invite_no_ip=Мережевої адреси ще немає. Підключіться до мережі Wi-Fi і повторіть спробу.
qr_invite_subtitle_multicast=Відскануйте цей код із пристрою-одержувача, щоб приєднатися до групи.
qr_invite_subtitle_unicast=Відскануйте цей код із приймального пристрою. Він дійсний лише для однієї пари.
qr_invite_tap_expressive=Торкніться коду, щоб повернутися до кольорової версії.
qr_invite_tap_plain=Проблеми зі скануванням? Торкніться коду для простої чорно-білої версії.
qr_invite_title=Сканування для підключення
qr_pairing_deeplink_confirm_body_multicast=Було виявлено запрошення WFAS для багатоадресного прийому. Ви хочете підключитися зараз?
qr_pairing_deeplink_confirm_body_unicast=Було виявлено запрошення WFAS для трансляції з цього пристрою. Ви хочете підключитися зараз?
qr_pairing_deeplink_confirm_connect=Підключитися
qr_pairing_deeplink_confirm_ignore=Ігнорувати
qr_pairing_deeplink_confirm_stops_server=Цей пристрій зараз передає. Підключення припинить цю передачу.
qr_pairing_deeplink_confirm_title=Підключитися до %1$s?
qr_pairing_epoch_mismatch_body=Ключ цієї багатоадресної групи було оновлено після створення коду. Попросіть пристрій трансляції нове запрошення.
qr_pairing_epoch_mismatch_button=зрозумів
qr_pairing_epoch_mismatch_title=Ця група змінилася
qr_pairing_expired_body=Цей код більше не дійсний з міркувань безпеки. Щоб продовжити, створіть нове запрошення.
qr_pairing_expired_primary=Згенеруйте новий код
qr_pairing_expired_secondary=Закрити
qr_pairing_expired_title=Термін дії QR-коду минув
qr_pairing_invalid_body=Відсканований код не є дійсним запрошенням WFAS. Переконайтеся, що ви скануєте код, згенерований іншим пристроєм.
qr_pairing_invalid_cancel=Скасувати
qr_pairing_invalid_retry=Спробуйте знову
qr_pairing_invalid_title=Код не розпізнано
qr_pairing_no_camera_body=Веб-камера не виявлена. Ви все ще можете ввести адресу та ключ вручну.
qr_pairing_no_camera_close=Закрити
qr_pairing_no_camera_manual=Введіть вручну
qr_pairing_no_camera_title=Камера недоступна
qr_pairing_regenerate_confirm_body=Усі підключені пристрої потрібно буде сполучити знову. Використовуйте цей параметр, якщо ви вважаєте, що неавторизований пристрій знає поточний ключ.
qr_pairing_regenerate_confirm_cancel=Скасувати
qr_pairing_regenerate_confirm_confirm=Регенерувати
qr_pairing_regenerate_confirm_title=Повторно створити ключ групи?
qr_pairing_self_body=Це запрошення було створено цим самим пристроєм, тому немає до чого підключатися. Відскануйте його з пристрою, який має отримати аудіо.
qr_pairing_self_button=зрозумів
qr_pairing_self_title=Це ваш власний код
qr_pairing_superseded_body=Інший пристрій відхилив це запрошення. Ймовірно, його замінили на новіший, або ключ групи був перегенерований. Попросіть свіжий код.
