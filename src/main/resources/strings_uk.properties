auto_connect_connecting=Автоматичне підключення до %s...
auto_connect_key_locked=%s пропущено: збережений ключ недоступний
auto_connect_interval_title=Інтервал сканування
auto_connect_interval_desc=Частота перевірки списку в секундах.
auto_connect_retry_title=Затримка повтору
auto_connect_retry_desc=Скільки потрібно чекати після відключення перед повторним підключенням, у секундах.
auto_connect_prompt_key_title=Попросіть ключ
auto_connect_prompt_key_desc=Якщо сервер запитує ключ, цей запис не збережено: відкрийте діалогове вікно ключа або пропустіть цей сервер. За замовчуванням вимкнено, оскільки автоматичне повторне підключення не може зупинитися у вікні, коли ніхто не може відповісти.
auto_connect_targets=Збережені сервери
auto_connect_add=Додати сервер
auto_connect_key_no_vault=Системний брелок недоступний, тому ключі неможливо надійно зберігати. У Linux встановіть «secret-tool» (пакет libsecret) і перезапустіть.
secret_vault_title=Проблема зі сховищем облікових даних
secret_vault_consequence=Доки це не буде виправлено, ключі, які ви тут вводите, не запам’ятовуються.
secret_vault_no_store_linux=Системний брелок недоступний. Встановіть «secret-tool» (пакет libsecret) і перезапустіть.
secret_vault_no_store_windows=Захист облікових даних Windows (DPAPI) недоступний у цій системі.
secret_vault_no_store_macos=Брелок macOS недоступний у цій системі.
secret_vault_no_store_other=Ця система не підтримує сховище облікових даних.
secret_vault_failing=Системний брелок відповів, але тестове збереження не вдалося (%s). Можливо, він заблокований \u2014 розблокуйте його та повторіть спробу.
