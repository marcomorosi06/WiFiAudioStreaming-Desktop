auto_connect_key_none=Немає ключа
auto_connect_key_hint=Зберігається в системному сховищі облікових даних, ніколи не в config.json
auto_connect_key_save=зберегти
auto_connect_key_clear=Зняти ключ
auto_connect_entry_enabled=Використовуйте цей запис

# --- Tray (5.3) ---
tray_unavailable_title=Піктограма в треї недоступна
tray_unavailable_desc=Вікно не можна приховати в треї, тому після його закриття програма закривається.
auto_start_encryption_title=Автоматичний запуск шифрування
auto_start_encryption_desc=Зашифруйте звук автоматично запущеного сервера. Окремо від загального налаштування, оскільки вони служать різним моментам: відвідуваний сеанс може залишатися відкритим для перевірки, тоді як сеанс, який починається сам і триває годинами, вартий шифрування.
auto_start_encryption_on=Зашифровано
auto_start_encryption_off=Не зашифровано
auto_start_encryption_inherit_on=Успадкувати зараз означає зашифровано.
auto_start_encryption_inherit_off=Успадкувати зараз означає не зашифровано.

