qr_scan_expired_hint=Термін дії цього запрошення минув. Попросіть свіжий.
qr_scan_found=Запрошення знайдено
qr_scan_hint=Наведіть камеру на QR-код, показаний на іншому пристрої.
qr_scan_not_wfas=Гм… ти хочеш, щоб я відсканувала це? Це не QR-код WFAS!
qr_scan_title=Відскануйте код запрошення
qr_scan_torch=Факел
sec_mode_qr=QR-код
sec_mode_qr_info_body=Автоматично генерує випадковий ключ для кожного запрошення — безпечніше, ніж пароль, обраний вручну. Пароль не потрібно запам'ятовувати або вимовляти вголос.
sec_mode_qr_info_title=Ключ генерується автоматично
server_key_required_desc=У режимі ключа ключ не може бути порожнім. Введіть його в розділі «Безпека» або перейдіть на QR-код, щоб він згенерувався для вас.
