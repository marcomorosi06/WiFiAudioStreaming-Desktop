snapcast_discovery_on=рекламується через mDNS
snapcast_discovery_off=не афішується - підключити вручну
snapcast_port_blocked=порт %1$d недоступний
snapcast_bind_error=Не вдалося відкрити порт: %1$s. Можливо, інший сервер Snapcast уже запущений або його блокує брандмауер.
snapcast_how_to_connect=Як підключити
snapcast_how_to_connect_auto=Клієнти цієї мережі знаходять потік самостійно. Якщо ні, вкажіть його за адресою нижче.
snapcast_how_to_connect_manual=Автоматичне виявлення вимкнено, тому клієнти повинні вказувати на цю адресу явно.
snapcast_how_to_connect_apps=У мобільному додатку Snapcast додайте сервер за IP. У Home Assistant використовуйте інтеграцію Snapcast із цим хостом і портом керування.
auth_key_remember_label=Запам'ятайте ключ
auth_key_remember_on=Зберігається в %s, зашифрований системою.
auth_key_remember_off=Не зберігається: знову запитується під час кожного запуску.
auth_key_no_vault=У цій системі немає сховища облікових даних, тому ключ не зберігається: вводьте його під час кожного запуску або встановіть WFAS_AUTH_KEY.

# --- Auto-start server (5.3) ---
auto_start_waiting=Очікування перед автозапуском...
auto_start_waiting_network=Очікування мережі...
auto_start_no_network=Автоматичний запуск скасовано: немає локальної адреси після 60 с
auto_start_key_missing=Автоматичний запуск скасовано: для безпеки встановлено ключ, але ключ не збережено
auto_start_delay_title=Затримка запуску
auto_start_delay_desc=Секунди очікування перед запуском сервера. Під час входу мережа часто ще не готова, і сервер, який запускається без адреси, є сервером, який ніхто не знаходить.
auto_start_network_title=Дочекайтеся Мережі
auto_start_network_desc=Утримуйте автоматичний запуск, доки ця машина не отримає придатну локальну адресу, до однієї хвилини.
auto_start_volume_title=Початкова гучність
auto_start_volume_desc=Обсяг, застосований під час автоматичного запуску сервера. Вимкніть, щоб зберегти поточний.
auto_start_security_title=Автозапуск безпеки
auto_start_security_desc=Режим безпеки для автоматично запущеного сервера. Inherit використовує загальне налаштування; ключ потребує збереженого спільного ключа.
auto_start_security_inherit=Успадкувати

