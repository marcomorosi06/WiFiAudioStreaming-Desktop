protocol_snapcast_title=Сервер Snapcast (мультирум)
protocol_snapcast_desc=Подавати синхронізоване аудіо на будь-який клієнт snapclient: Raspberry Pi, ESP32, Home Assistant, мобільні програми Snapcast
snapcast_port=Порт потоку
snapcast_control_port=Порт керування
snapcast_codec_label=Кодек
snapcast_codec_pcm_desc=Без стиснення. Приблизно 1,5 Мбіт/с на клієнта при 48 кГц стерео, нульова затримка кодування.
snapcast_codec_flac_desc=Стиснення без втрат. Приблизно вдвічі зменшує пропускну здатність, додає приблизно 25 мс затримки кодування.
snapcast_codec_opus_desc=З втратами, найнижча пропускна здатність. Потрібен стерео 16-бітний вхід 48000 Гц.
snapcast_opus_requirement=Opus потребує 48000 Гц стерео. З поточними налаштуваннями звуку сервер повернеться до PCM.
snapcast_chunk_label=Розмір шматка
