snapcast_buffer_hint=Наскільки клієнти запланували відтворення. Вищий – надійніший, нижчий – більш чуйний.
snapcast_stream_name=Назва потоку
snapcast_hint=Запустіть сервер для оголошення потоку через mDNS. Клієнти виявляють це автоматично.
