protocol_incompatible_body=Hai ứng dụng đang chạy các phiên bản giao thức WFAS không tương thích (thiết bị này: v%1$d, đầu kia: v%2$d). Kết nối đã bị đóng. Vui lòng cập nhật để cả hai thiết bị chạy phiên bản mới nhất.
protocol_incompatible_body_sender=Thiết bị đang truyền đang chạy phiên bản cũ hơn của ứng dụng (giao thức WFAS v%2$d, thiết bị này sử dụng v%1$d), do đó kết nối đã bị đóng. Cập nhật ứng dụng trên thiết bị truyền.
protocol_incompatible_body_receiver=Thiết bị đang nhận đang chạy phiên bản cũ hơn của ứng dụng (giao thức WFAS v%2$d, thiết bị này sử dụng v%1$d), do đó kết nối đã bị đóng. Cập nhật ứng dụng trên thiết bị nhận.
protocol_incompatible_body_local=Thiết bị này đang chạy phiên bản cũ hơn của ứng dụng (giao thức WFAS v%1$d, thiết bị kia sử dụng v%2$d), do đó kết nối đã bị đóng. Cập nhật ứng dụng trên thiết bị này.
