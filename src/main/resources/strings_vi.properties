protocol_incompatible_body_sender=Thiết bị phát âm thanh đang chạy phiên bản cũ hơn (giao thức WFAS v%2$d, thiết bị này dùng v%1$d), kết nối đã bị đóng. Vui lòng cập nhật ứng dụng trên thiết bị phát.
