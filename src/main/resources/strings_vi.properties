mic_routing_mix_input_device=Thiết bị đầu vào micrô

vcable_help_button=Cần trợ giúp thiết lập điều này?
vcable_help_win_title=Windows — Cài đặt VB-CABLE
vcable_help_win_1=Truy cập vb-audio.com/Cable và tải xuống VB-CABLE.
vcable_help_win_2=Chạy trình cài đặt với tư cách Quản trị viên, sau đó khởi động lại PC của bạn.
vcable_help_win_3=Sau khi khởi động lại, "Đầu vào CÁP" sẽ xuất hiện trong danh sách thả xuống ở trên - hãy chọn nó.
vcable_help_win_4=Trong Discord, Zoom hoặc bất kỳ ứng dụng nào khác, hãy đi tới Cài đặt âm thanh và chọn "Đầu ra CÁP" làm micrô.
vcable_help_win_5=Xong! Âm thanh được truyền trực tiếp bây giờ sẽ xuất hiện dưới dạng micrô của bạn trong các ứng dụng đó.
vcable_help_win_link=Mở vb-audio.com/Cable
vcable_help_linux_title=Linux - Chìm ảo tự động
vcable_help_linux_1=Không cần cài đặt. Khi quá trình phát trực tuyến bắt đầu, một hệ thống chìm ảo có tên "WFAS_VirtualMic" được tạo tự động thông qua Pactl.
vcable_help_linux_2=Mở pavucontrol (PulseAudio Volume Control) hoặc tương đương với PipeWire.
vcable_help_linux_3=Trong tab "Ghi", đặt Discord/Zoom/etc. để chụp từ "WFAS_VirtualMic".
vcable_help_linux_4=Âm thanh được truyền trực tiếp bây giờ sẽ xuất hiện dưới dạng micrô trong các ứng dụng đó.
vcable_help_linux_link=Cài đặt pavucontrol
vcable_help_mac_title=macOS — Thiết lập BlackHole
vcable_help_mac_1=Tải xuống BlackHole (miễn phí, mã nguồn mở) từ github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Cài đặt nó theo hướng dẫn trên màn hình. Không cần khởi động lại.
vcable_help_mac_3=Chọn "BlackHole 2ch" (hoặc 16ch) trong danh sách thả xuống ở trên.
vcable_help_mac_4=Trong Cài đặt hệ thống → Âm thanh, bạn có thể tùy ý tạo Thiết bị nhiều đầu ra để nghe âm thanh và định tuyến đồng thời.
vcable_help_mac_5=Trong Discord, Zoom hoặc bất kỳ ứng dụng nào khác, chọn "BlackHole 2ch" làm micrô.
vcable_help_mac_link=Mở BlackHole trên GitHub
start_minimized_tray=Khởi động thu nhỏ vào khay hệ thống
start_minimized_tray_desc=Chạy ẩn ứng dụng dưới khay hệ thống khi mở máy, sẵn sàng kết nối mà không vướng víu màn hình.
close_to_tray=Đóng cửa sổ về khay hệ thống
close_to_tray_desc=Khi nhấn nút đóng (X), ứng dụng sẽ thu nhỏ về khay hệ thống thay vì thoát hoàn toàn.
tray_show_window=Hiện cửa sổ ứng dụng
tray_hide_window=Ẩn về khay hệ thống
tray_quit=Thoát hoàn toàn
tray_running_in_background=Ứng dụng đang chạy nền. Nhấp chuột phải vào biểu tượng khay để thoát.
tray_icon_dark=Sử dụng Biểu tượng tối (Bảng sáng)
tray_icon_light=Sử dụng Biểu tượng Ánh sáng (Bảng tối)
# Welcome screen (GUI)
welcome_title=Chào mừng bạn đến với Truyền phát âm thanh WiFi!
welcome_thanks=Cảm ơn bạn đã cài đặt ứng dụng. Đây là tất cả mọi thứ bạn cần để bắt đầu.
welcome_android_title=Tải ứng dụng Android
welcome_android_body=Cài đặt ứng dụng Android đồng hành để nhận âm thanh trên điện thoại hoặc máy tính bảng của bạn. Nguồn mở và miễn phí.
welcome_android_btn=Tải xuống trên GitHub
welcome_cli_title=Sử dụng nó từ Terminal
welcome_cli_body=Bạn có thể điều khiển ứng dụng từ bất kỳ thiết bị đầu cuối nào bằng lệnh wfas. Nhấp vào bên dưới để thêm nó vào PATH của bạn ngay bây giờ.
