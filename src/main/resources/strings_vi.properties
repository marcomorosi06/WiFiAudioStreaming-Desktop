fw_detected_ufw=ufw đang hoạt động trên hệ thống này
fw_desc_linux=Nếu một thiết bị không thể kết nối và vẫn ở trạng thái "chờ" thì UDP gửi đến trên các cổng này có thể đã bị chặn. Chạy lệnh dưới đây trong một thiết bị đầu cuối.
