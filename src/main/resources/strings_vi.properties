auto_connect_add=Thêm máy chủ
auto_connect_key_no_vault=Không thể truy cập được khóa hệ thống nên không thể lưu trữ khóa một cách an toàn. Trên Linux cài đặt 'công cụ bí mật' (gói libsecret) và khởi động lại.
