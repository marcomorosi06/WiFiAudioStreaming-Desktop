dlna_format_auto_desc=Hãy hỏi từng trình kết xuất những gì nó hỗ trợ và chọn kết quả phù hợp nhất. Khuyến khích.
dlna_format_lpcm_desc=PCM 16 bit không nén, ~ 1,4 Mbps. Độ trễ thấp nhất, khả năng tương thích rộng nhất.
dlna_format_wav_desc=PCM không nén bên trong tiêu đề WAV phát trực tuyến. Giúp một số firmware cũ hơn.
dlna_format_mp3_desc=Đã nén, ~320 kbps. Sử dụng khi mạng chậm hoặc Wi-Fi bị tắc nghẽn.
dlna_format_adts_desc=AAC nén. Hiệu quả, nhưng hỗ trợ trình kết xuất kém nhất quán nhất.
