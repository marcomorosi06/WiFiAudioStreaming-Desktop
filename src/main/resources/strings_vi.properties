mic_routing_unicast_only=Chia sẻ micrô chỉ được hỗ trợ ở chế độ unicast. Tắt multicast/RTP để sử dụng nó.
mic_routing_virtual_unicast_only=Micrô ảo chỉ khả dụng ở chế độ unicast. Trộn vào luồng vẫn hoạt động ở chế độ phát đa hướng.
