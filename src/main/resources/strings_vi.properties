nr_hint=Chỉ dành cho người gửi tương tự ồn ào, chẳng hạn như bộ vi điều khiển lấy mẫu đầu ra. Trên âm thanh kỹ thuật số sạch, nó chỉ có thể thêm các tạo tác. Không sử dụng nó nếu người gửi đã loại bỏ tiếng ồn ở bên cạnh nó.
