auto_connect_prompt_key_desc=Nếu máy chủ yêu cầu khóa thì mục này chưa được lưu: hiển thị hộp thoại khóa hoặc bỏ qua máy chủ đó. Tắt theo mặc định vì kết nối lại không được giám sát không thể dừng trên cửa sổ, không ai có thể ở đó để trả lời.
