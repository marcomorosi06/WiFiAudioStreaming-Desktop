welcome_privacy_title=Kiểm tra cập nhật tự động
welcome_privacy_desc=Mỗi lần khởi chạy, ứng dụng sẽ hỏi GitHub xem có phiên bản mới hơn không.
welcome_privacy_detail=GitHub là một công ty Mỹ thuộc sở hữu của Microsoft. Mọi yêu cầu nhất thiết phải tiết lộ địa chỉ IP của bạn cho họ, cùng với thời gian yêu cầu. Không có gì khác được gửi: không có tài khoản, không có số nhận dạng, không có dữ liệu sử dụng. Tắt tính năng này và ứng dụng sẽ không bao giờ tự kết nối với mạng \u2014 bạn vẫn có thể kiểm tra thủ công từ Cài đặt bất kỳ lúc nào.
welcome_privacy_on=Trên \u00b7 lần kiểm tra mỗi lần khởi chạy
