server_silent_body=“%1$s” không trả lời yêu cầu kết nối. Nguyên nhân phổ biến nhất là thiết bị đang chạy phiên bản cũ hơn — hãy cập nhật ứng dụng trên thiết bị đó. Ngoài ra, hãy kiểm tra tường lửa xem có chặn cổng không.
