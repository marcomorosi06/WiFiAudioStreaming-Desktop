usb_section=liên kết USB
usb_mode=Truyền phát qua USB
usb_mode_desc=Sử dụng cáp USB thay vì Wi-Fi. Bật tính năng chia sẻ kết nối USB trên điện thoại Android, sau đó ứng dụng sẽ tự tìm liên kết.
usb_latency=Bộ đệm USB (ms)
usb_latency_desc=Bộ đệm jitter được sử dụng thay cho bộ đệm âm thanh khi liên kết USB đang hoạt động. Thấp hơn có nghĩa là độ trễ ít hơn nhưng có nhiều nguy cơ bỏ học hơn. Một số thiết bị phân phối các gói USB theo đợt và cần nhiều bộ đệm hơn ở đây so với qua Wi-Fi chứ không phải ít hơn.
usb_diag_disabled=Chế độ USB đã tắt.
usb_diag_ready=Liên kết USB đang hoạt động: %s (%s)
usb_diag_windows=Không tìm thấy liên kết USB. Kết nối điện thoại và bật tính năng chia sẻ kết nối USB trên điện thoại.
usb_diag_linux=Không tìm thấy liên kết USB. Kết nối điện thoại và bật tính năng chia sẻ kết nối USB trên điện thoại.
usb_diag_macos=Không tìm thấy liên kết USB. macOS không có trình điều khiển RNDIS tích hợp, vì vậy tính năng chia sẻ kết nối qua USB của Android thường không hoạt động ở đây; thay vào đó hãy sử dụng Wi-Fi.
usb_diag_no_ip=Đã tìm thấy bộ chuyển đổi USB (%s) nhưng nó không có địa chỉ IP. Tính năng chia sẻ kết nối USB có thể vẫn tắt trên thiết bị.
usb_interface=Giao diện USB
usb_interface_desc=Để ở chế độ Tự động trừ khi phát hiện chọn sai bộ chuyển đổi. Các bộ điều hợp không có địa chỉ IP cũng được liệt kê, vì vậy bạn có thể phân biệt trình điều khiển cũ với trình điều khiển đang hoạt động.
usb_interface_auto=Tự động
