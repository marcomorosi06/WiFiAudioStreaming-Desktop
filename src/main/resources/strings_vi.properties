protocol_incompatible_body=Hai ứng dụng đang chạy phiên bản giao thức WFAS không tương thích (thiết bị này: v%1$d, thiết bị kia: v%2$d). Kết nối đã bị đóng. Vui lòng cập nhật để cả hai thiết bị chạy phiên bản mới nhất.
protocol_incompatible_body_sender=Thiết bị truyền phát đang chạy phiên bản ứng dụng cũ hơn (giao thức WFAS v%2$d, thiết bị này dùng v%1$d), do đó kết nối bị ngắt. Hãy cập nhật ứng dụng trên thiết bị truyền.
protocol_incompatible_body_receiver=Thiết bị nhận đang chạy phiên bản ứng dụng cũ hơn (giao thức WFAS v%2$d, thiết bị này dùng v%1$d), do đó kết nối bị ngắt. Hãy cập nhật ứng dụng trên thiết bị nhận.
protocol_incompatible_body_local=Thiết bị này đang chạy phiên bản cũ hơn (giao thức WFAS v%1$d, thiết bị kia dùng v%2$d), kết nối bị ngắt. Vui lòng cập nhật ứng dụng trên thiết bị này.
