dlna_no_devices=Không tìm thấy trình kết xuất DLNA. Đảm bảo thiết bị được bật và trên cùng một mạng.
dlna_selection_hint=Trình kết xuất đã chọn sẽ được ghi nhớ và tự động kết nối lại khi bắt đầu phát trực tuyến.
