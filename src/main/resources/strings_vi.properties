auto_start_encryption_desc=Mã hóa âm thanh của máy chủ tự động khởi động. Tách biệt với cài đặt chung, vì cả hai đều phục vụ những thời điểm khác nhau: một phiên đã tham dự có thể ở chế độ rõ ràng để kiểm tra, trong khi một phiên tự bắt đầu và chạy hàng giờ đáng để mã hóa.
