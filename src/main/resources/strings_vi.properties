cli_install_terminal_title=Đã mở thiết bị đầu cuối
cli_install_terminal_body=Một cửa sổ terminal đã được mở để hoàn tất quá trình cài đặt với quyền quản trị viên. Khi nó đóng lại, hãy mở một thiết bị đầu cuối mới và chạy: wfas --help
