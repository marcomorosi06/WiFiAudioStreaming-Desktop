usb_panel_hint_waiting=Kết nối điện thoại và bật tính năng chia sẻ kết nối USB trên điện thoại.
usb_panel_hint_no_ip=Cáp được công nhận. Bật tính năng chia sẻ kết nối qua USB trên thiết bị để thiết bị cung cấp địa chỉ.
usb_transport_label=USB
usb_transport_wifi=Wi-Fi
wfas_mode_label=Tính khả dụng của WFAS
wfas_mode_desc=Chọn thời điểm thiết bị này phục vụ giao thức WFAS gốc. "Tắt khi kết nối USB" giữ WFAS trên mạng nhưng sẽ tắt nó ngay khi liên kết USB xuất hiện.
