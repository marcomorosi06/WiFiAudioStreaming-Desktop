cli_install_desc=Thêm lệnh wfas vào PATH hệ thống của bạn để bạn có thể chạy nó từ bất kỳ thiết bị đầu cuối nào. Chạy lại nếu bạn di chuyển ứng dụng để cập nhật đường dẫn.
