secret_vault_no_store_macos=Móc khóa macOS không có sẵn trên hệ thống này.
secret_vault_no_store_other=Hệ thống này không có cửa hàng thông tin xác thực được hỗ trợ.
secret_vault_failing=Khóa hệ thống đã trả lời nhưng lưu thử nghiệm không thành công (%s). Nó có thể bị khóa \u2014 hãy mở khóa và thử lại.
