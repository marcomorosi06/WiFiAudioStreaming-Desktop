fw_status_inactive=Chưa được định cấu hình
fw_desc=Nếu một thiết bị không thể kết nối và vẫn ở trạng thái "chờ", hãy cho phép lưu lượng truy cập vào trên các cổng UDP này. Yêu cầu sự chấp thuận của quản trị viên một lần.
