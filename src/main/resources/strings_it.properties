qr_pairing_public_ip=Questo indirizzo non \u00e8 nella tua rete locale. Continua solo se sai chi ti ha mandato il link.

# WFAS v3
w3_protocol_section=Protocollo WFAS
w3_v3_title=WFAS v3 (consigliato)
w3_v3_desc=I dispositivi si abbinano una volta sola, con un codice, un QR o un PIN. Ogni sessione è cifrata e autenticata da un capo all'altro, con chiavi che cambiano a ogni connessione, e sulla rete non viene annunciato nulla. La specifica è ancora in bozza (sperimentale): non c'è ancora stato un audit esterno.
w3_v2_title=WFAS v2 (versione precedente)
w3_v2_desc=Per i dispositivi non ancora aggiornati. Attivarlo disattiva v3.
w3_v2_enable_title=Attivare WFAS v2?
w3_v2_enable_body=WFAS v2 è la versione precedente del protocollo. Resta disponibile per i dispositivi che non si possono ancora aggiornare, ma è obsoleta e ha punti deboli noti che v3 risolve:\n\n- la protezione è facoltativa: senza chiave chiunque sulla rete può connettersi e l'audio viaggia in chiaro;\n- con una chiave condivisa, una passphrase debole può essere indovinata da chi registra il traffico, e chi ottiene la chiave può decifrare anche le sessioni registrate in passato;\n- il server si annuncia a tutta la rete, e quegli annunci si possono falsificare;\n- in multicast qualunque ricevitore può inserire audio a nome del server.\n\nTi consigliamo di restare su v3. Se attivi v2, v3 viene disattivato finché non torni indietro.
w3_v2_enable_stay=Resta su v3
w3_v2_enable_confirm=Attiva v2
w3_device_name=Nome mostrato durante l'abbinamento
w3_device_name_hint=Vuoto: il nome di questo dispositivo (%1$s). In modalità PIN è visibile ai dispositivi vicini finché la finestra resta aperta.
w3_paired_title=Dispositivi abbinati
w3_paired_empty=Nessun dispositivo abbinato.
w3_paired_remove=Rimuovi
w3_paired_remove_title=Rimuovere %1$s?
w3_paired_remove_body=Le sue chiavi vengono cancellate da questo dispositivo e gli viene chiesto di dimenticare anche questo. Per usarlo di nuovo andrà abbinato un'altra volta.
