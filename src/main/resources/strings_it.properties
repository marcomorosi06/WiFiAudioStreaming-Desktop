w3_codec_pcm_desc=Senza perdita, %1$d Hz, circa %2$d kbit/s. La frequenza segue le impostazioni audio.
w3_codec_opus_desc=Bitrate costante: ogni pacchetto ha la stessa dimensione, così il traffico non rivela nulla dell'audio.
