w3_pf_used=Questa finestra di abbinamento è già stata usata da un altro dispositivo. Aprine una nuova sul server.
w3_pf_full=Non c'è più spazio per nuovi abbinamenti (al massimo 64). Rimuovi un dispositivo che non usi più.
w3_pf_protocol=Lo scambio non è andato a buon fine. Riprova; se succede ancora, aggiorna l'app su entrambi i dispositivi.
w3_pf_cancelled=Abbinamento annullato.
w3_pf_code=I codici non coincidevano, quindi l'abbinamento è stato interrotto per precauzione. Riprova; se succede di nuovo, qualcosa sulla rete potrebbe interferire.
