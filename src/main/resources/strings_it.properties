native_engine_title=Motore Audio Nativo
native_engine_desc=Usa il motore audio nativo in C (consigliato). Su Linux: PulseAudio/PipeWire via dlopen, muto automatico degli speaker. Disattiva per tornare al grabber FFmpeg legacy.
mute_render_title=Muta gli altoparlanti durante lo streaming
mute_render_desc=Silenzia la riproduzione locale mentre il server la cattura, cosi' l'audio non si sente due volte. Disattiva per sentirlo anche qui oltre che sul client. Solo con il motore nativo; lo stato precedente viene ripristinato all'arresto del server. Sui pochi dispositivi dove il mute silenzierebbe anche la cattura, gli altoparlanti restano attivi. CLI: --no-mute-render.
server_persist_title=Tieni acceso il server dopo la disconnessione
server_persist_desc=In unicast, se il client se ne va finisce la sessione, non il server: la porta resta aperta in attesa del prossimo client. In multicast funziona gia' cosi'.
