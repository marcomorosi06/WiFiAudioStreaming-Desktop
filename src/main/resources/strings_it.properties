w3_sync_desc=Tutti i client suonano nello stesso istante, con gli orologi allineati. Aggiunge latenza: da 30 a 200 ms, adattata alla rete.
w3_accept_new=Accetta nuove connessioni
w3_accept_new_desc=Se disattivato, ai nuovi client viene risposto che il server è occupato; quelli già connessi restano.
w3_multicast_note=Multicast: un solo flusso cifrato per tutti i client. Il microfono dei client richiede l'unicast.
w3_change_live=Le modifiche valgono subito: i client si adeguano senza riconnettersi, tranne per sincronizzazione e multicast, per cui si riconnettono da soli.
