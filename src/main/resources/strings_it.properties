w3u_fact_client_desc=Abbina un server: incolla il codice che mostra, inquadra il suo QR o scrivi il suo PIN.
w3u_fact_both_title=Una volta, poi da solo
w3u_fact_both_desc=Con un PIN entrambi gli schermi mostrano lo stesso codice: conferma solo se è lo stesso. Dopo si trovano da soli.
w3u_fact_code_title=QR o codice
w3u_fact_code_desc=Per un dispositivo con fotocamera o dove si può incollare il codice. Il codice è un segreto finché è sullo schermo.
w3u_fact_pin_title=PIN
w3u_fact_pin_desc=Per qualunque dispositivo vicino sulla stessa rete: 8 cifre da scrivere, poi un codice da confrontare. Questo PC chiede sempre.
w3u_fact_pair_title=Abbinato
w3u_fact_pair_desc=Riconosciuto dalla sua chiave: nessun altro può rispondere al suo posto senza che si noti.
w3u_fact_guest_desc=Come ospite: non salvato, finisce con la sessione.
w3u_fact_mic_desc=Può inviare il suo microfono a questo PC.
w3u_fact_suspect_desc=Le sue chiavi sono state usate altrove o ripristinate da una copia più vecchia: abbinalo di nuovo per continuare.
w3u_fact_kept_title=Cosa si conserva
w3u_fact_kept_desc=La sua chiave, il suo nome e cosa può fare. Nessun indirizzo, nessuna data, nessun conteggio delle sessioni.
client_enc_v3=Cifrato e autenticato (WFAS v3)
home_other_ways=Altri modi per collegarsi
home_addr_title=Collegati con l'indirizzo
home_addr_desc=Prima v3; v2 solo se lo dici tu
home_addr_note=Per quando un server non si trova da solo. Scrivi l'indirizzo IP dell'altro dispositivo: se lì c'è un server abbinato con la v3, suona cifrato come dalla lista sopra. Altrimenti l'app ti chiede prima di provare WFAS v2, che non è cifrato.
home_legacy_title=Dispositivi vecchi (WFAS v2)
home_legacy_desc=Solo per server che non hanno ancora la v3
home_legacy_found=%1$d trovati
home_legacy_note=Questi server compaiono senza abbinamento e il loro flusso non è cifrato; l'app ti chiede prima di ogni connessione. Se l'altro dispositivo ha la v3, abbinalo sopra: è più sicuro e si trova da solo.
usb_v3_detail=Funziona con v3 e v2
usb_v3_on=Attivo
usb_v3_how_client=Il cavo diventa un collegamento di rete tra telefono e computer, e nient'altro cambia: un server v3 abbinato si trova da solo attraverso il cavo e suona cifrato, come sul Wi-Fi. Attiva il tethering USB sul telefono; sul computer lascia l'interfaccia di rete su automatico.
usb_v3_how_server=Il cavo diventa un collegamento di rete tra telefono e computer, e nient'altro cambia: i client abbinati trovano questo server da soli attraverso il cavo e suonano cifrati, come sul Wi-Fi. Un dispositivo abbinato sul Wi-Fi funziona anche col cavo.
rail_send=Invia
rail_listen=Ascolta
rail_send_hint=Questo computer manda il suo audio ad altri dispositivi.
rail_listen_hint=Questo computer riproduce quello che manda un altro dispositivo.
rail_devices_hint=I dispositivi abbinati con WFAS v3.
rail_locked=Prima ferma lo streaming, poi cambia.
hero_role_send=Invio da questo computer
hero_role_listen=Ascolto su questo computer
hero_pick_server=Scegli un server qui sotto
srv_link_desc=Come l'audio arriva a chi ascolta: Wi-Fi o cavo, un flusso unico o uno a testa.
security_section_desc_v2=Chi può connettersi con WFAS v2, e se il flusso è cifrato.
client_configuration_desc=Da dove esce il suono, e se il tuo microfono torna indietro.
servers_found_desc=Server che si annunciano su questa rete.
device_star_desc=Connettiti da solo a questo server
manual_ip_label=Indirizzo del server
manual_title_v2=Collegati con l'indirizzo
manual_desc_v2=Per un server che non si trova da solo.
usb_section_title=Cavo USB
w3u_delivery_title=Trasmissione
w3u_delivery_each=Unicast
w3u_delivery_all=Multicast
w3u_delivery_each_note=Un flusso separato per ogni dispositivo. Il traffico cresce con ogni ascoltatore; serve se i client mandano il loro microfono.
w3u_delivery_all_note=Un solo flusso condiviso da tutti i dispositivi: il traffico resta uguale con quanti ascoltatori vuoi. I client non possono mandare il microfono, e alcuni router Wi-Fi gestiscono male il multicast.
w3u_delivery_locked=Il multicast è obbligatorio finché %1$s è attivo.
w3u_delivery_live_all=Invio in multicast. Per cambiarlo, ferma e riavvia.
w3u_delivery_live_each=Invio in unicast. Per cambiarlo, ferma e riavvia.
settings_material_hues_title=Colori Material
settings_material_hues_desc=Dà a ogni sezione un colore suo (ambra, verde, rosa, azzurro), sopra il tema. Spento: ogni colore segue quello del tema.
w3u_latency_quick=Più reattiva
w3u_latency_steady=Più stabile
latency_label_v2=Latenza per v2 e RTP: %d ms (%s)
latency_v2_hint=Con WFAS v3 la latenza la decide il server, nella sua scheda.
settings_v2_detail=Porte, dimensione dei pacchetti, buffer USB e riduzione del rumore: solo per i dispositivi ancora in v2.
w3_autoconnect_desc=Con WFAS v3 il client torna all'ultimo server abbinato che ha usato e lo cerca da solo. L'elenco degli indirizzi e i suoi tempi sono di WFAS v2 e tornano con la v2.
