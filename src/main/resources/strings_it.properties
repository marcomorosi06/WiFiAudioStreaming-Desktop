# Server start: a key or QR pairing only protects WFAS
unprotected_protocols_title=Non protetto sugli altri protocolli
unprotected_protocols_body=La chiave, il pairing QR e la cifratura proteggono solo WFAS. %s trasmetter\u00e0 lo stesso audio senza cifratura e senza chiave: chiunque sulla rete pu\u00f2 ascoltarlo.
