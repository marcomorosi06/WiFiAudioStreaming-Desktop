w3_notice_suspect_title=%1$s: abbinamento da rinnovare
w3_notice_suspect_body=Le chiavi di questo abbinamento risultano usate da un altro dispositivo, oppure i dati salvati sono stati ripristinati da una copia precedente. Non è un problema di rete. Per precauzione le connessioni con %1$s sono sospese: abbinalo di nuovo per continuare, ci vuole un minuto.
w3_notice_forget_title=%1$s ha rimosso questo abbinamento
w3_notice_forget_body=Vuoi rimuoverlo anche qui? Se lo tieni, non funzionerà finché non lo abbini di nuovo.
w3_notice_keep=Tieni
w3_notice_mic_refused=Il server non consente il microfono di questo dispositivo: l'audio continua senza.
w3_notice_storage=Non è stato possibile salvare le chiavi di WFAS v3, quindi v3 si è fermato per non perderle. Controlla lo spazio libero e i permessi della cartella di configurazione.
w3_fail_library=Il modulo WFAS v3 non è disponibile per questo sistema.
w3_fail_selftest=Il controllo iniziale della crittografia non è riuscito su questo dispositivo, quindi WFAS v3 resta spento per precauzione.
w3_fail_device_record=I dati di sicurezza di WFAS v3 salvati su questo dispositivo non sono leggibili. Puoi reimpostarli dalle impostazioni; poi i dispositivi andranno abbinati di nuovo.
w3_fail_storage=Non è stato possibile salvare le chiavi di WFAS v3. Controlla lo spazio libero e i permessi della cartella di configurazione.
w3_fail_port=La porta UDP %1$d è già usata da un altro programma.
w3_fail_network=Non è stato possibile aprire la porta di rete di WFAS v3.
w3_status_serving=Server WFAS v3 pronto: in attesa dei dispositivi abbinati
w3_unprotected_body=WFAS v3 protegge solo il proprio flusso. %s trasmetterà lo stesso audio senza cifratura e senza abbinamento: chiunque sulla rete può ascoltarlo.
w3_cpair_no_camera=Nessuna webcam trovata. Puoi digitare il codice mostrato sul server.
w3_fail_in_use=WFAS v3 è già in uso da un'altra finestra o da un altro terminale di questa app. Chiudi quella, oppure usa quella.
w3_fail_store_key=Manca la chiave che apre i dati di WFAS v3 salvati su questo dispositivo (per esempio dopo un ripristino del portachiavi di sistema). Non \u00e8 stato sovrascritto nulla: ripristina la chiave, oppure azzera WFAS v3 nelle impostazioni e abbina di nuovo i dispositivi.
w3_script_v2_refused=WFAS v3 è attivo e nessun server abbinato ha risposto a %1$s. A un server WFAS v2 ci si collega dall'app, dopo una conferma, oppure attivando WFAS v2 nelle impostazioni.
w3_manual_looking=Cerco un server abbinato a %1$s…

