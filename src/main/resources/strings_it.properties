w3_v2_connect_title=%1$s usa WFAS v2
w3_v2_connect_body=Questo server usa ancora la versione precedente del protocollo, che ha limiti di sicurezza noti: a seconda di come è configurato, l'audio può viaggiare in chiaro, e chiunque sia sulla rete può vedere il server o fingersi lui.\n\nSe puoi, aggiorna l'app su quel dispositivo e attiva WFAS v3: lo abbinerai una volta e la connessione sarà protetta. Puoi comunque connetterti ora.
