usb_send_hint=Przesyłaj strumieniowo do telefonu przez kabel zamiast przez Wi-Fi.
usb_receive_label=Odbieraj przez USB
usb_receive_hint=Słuchaj telefonu przez kabel zamiast Wi-Fi.
usb_panel_hint_ready=Urządzenia podłączone do tego kabla pojawią się na liście oznaczone jako USB.
usb_panel_hint_waiting=Podłącz telefon i włącz na nim tethering przez USB.
usb_panel_hint_no_ip=Kabel został rozpoznany. Włącz tethering przez USB na urządzeniu, aby rozdawało adres.
usb_transport_label=USB
usb_transport_wifi=Wi-Fi
wfas_mode_label=Dostępność WFAS
wfas_mode_desc=Wybierz, kiedy to urządzenie obsługuje natywny protokół WFAS. Opcja „Wyłączone, gdy podłączony jest USB” utrzymuje funkcję WFAS w sieci, ale wyłącza ją, gdy tylko pojawi się łącze USB.
