auto_start_key_missing=Automatyczne uruchomienie anulowane: zabezpieczenie jest ustawione na klucz, ale żaden klucz nie został zapisany
auto_start_delay_title=Opóźnienie rozpoczęcia
auto_start_delay_desc=Sekundy oczekiwania przed uruchomieniem serwera. W momencie logowania sieć często nie jest jeszcze gotowa, a serwer, który uruchamia się bez adresu, jest serwerem, którego nikt nie znajduje.
auto_start_network_title=Poczekaj na sieć
auto_start_network_desc=Przytrzymaj funkcję automatycznego uruchamiania, aż urządzenie będzie miało użyteczny adres lokalny (do jednej minuty).
auto_start_volume_title=Rozpocznij głośność
auto_start_volume_desc=Wolumen zastosowany podczas automatycznego uruchamiania serwera. Opuść, aby zachować bieżący.
auto_start_security_title=Automatyczne uruchamianie zabezpieczeń
auto_start_security_desc=Tryb zabezpieczeń dla automatycznie uruchamianego serwera. Dziedzicz używa ustawień ogólnych; klucz wymaga zapisanego klucza współdzielonego.
auto_start_security_inherit=Dziedzicz

# --- Auto-connect client (5.3) ---
auto_connect_connecting=Automatyczne łączenie z %s...
auto_connect_key_locked=%s pominięte: zapisany klucz jest niedostępny
auto_connect_interval_title=Interwał skanowania
auto_connect_interval_desc=Jak często lista jest sprawdzana, w sekundach.
auto_connect_retry_title=Opóźnienie ponownej próby
auto_connect_retry_desc=Czas oczekiwania po rozłączeniu przed ponownym podłączeniem, w sekundach.
auto_connect_prompt_key_title=Poproś o Klucz
auto_connect_prompt_key_desc=Jeśli serwer poprosi o klucz, ten wpis nie został zapisany: pokaż okno dialogowe klucza lub pomiń ten serwer. Domyślnie wyłączone, ponieważ nienadzorowane ponowne połączenie nie może zostać zatrzymane w oknie, w którym nikt nie może odpowiedzieć.
auto_connect_targets=Zapisane serwery
auto_connect_add=Dodaj serwer
auto_connect_key_no_vault=Pęt kluczy systemowych jest nieosiągalny, więc kluczy nie można bezpiecznie przechowywać. W systemie Linux zainstaluj „secret-tool” (pakiet libsecret) i uruchom ponownie.
secret_vault_title=Problem z magazynem danych uwierzytelniających
secret_vault_consequence=Dopóki nie zostanie to naprawione, wprowadzone tutaj klucze nie będą zapamiętywane.
secret_vault_no_store_linux=Żaden pęk kluczy systemowych nie jest osiągalny. Zainstaluj „secret-tool” (pakiet libsecret) i uruchom ponownie.
secret_vault_no_store_windows=Ochrona poświadczeń systemu Windows (DPAPI) nie jest dostępna w tym systemie.
secret_vault_no_store_macos=Pęk kluczy macOS nie jest dostępny w tym systemie.
secret_vault_no_store_other=Ten system nie ma obsługiwanego magazynu danych uwierzytelniających.
secret_vault_failing=Brelok systemowy odpowiedział, ale zapis testowy nie powiódł się (%s). Może być zablokowany, odblokuj go i spróbuj ponownie.
auto_connect_ip=Adres
auto_connect_port=Portu
auto_connect_port_hint=Domyślne
auto_connect_label=Imię (opcjonalnie)
auto_connect_key=Klucz
auto_connect_key_saved=Klucz zapisany
auto_connect_key_none=Brak klucza
auto_connect_key_hint=Przechowywane w magazynie danych uwierzytelniających systemu, nigdy w pliku config.json
auto_connect_key_save=Zapisz
auto_connect_key_clear=Usuń klucz
auto_connect_entry_enabled=Skorzystaj z tego wpisu

# --- Tray (5.3) ---
tray_unavailable_title=Ikona w zasobniku jest niedostępna
tray_unavailable_desc=Okna nie można ukryć w zasobniku, więc zamknięcie go powoduje zamknięcie aplikacji.
auto_start_encryption_title=Automatyczne uruchamianie szyfrowania
auto_start_encryption_desc=Zaszyfruj dźwięk automatycznie uruchomionego serwera. Oddzielne od ustawień ogólnych, ponieważ służą różnym momentom: sesja, w której uczestniczysz, może pozostać niezauważona do wglądu, podczas gdy sesja, która rozpoczyna się sama i trwa godzinami, jest warta zaszyfrowania.
auto_start_encryption_on=Zaszyfrowane
auto_start_encryption_off=Niezaszyfrowane
auto_start_encryption_inherit_on=Dziedzicz obecnie oznacza zaszyfrowane.
auto_start_encryption_inherit_off=Dziedzicz obecnie oznacza niezaszyfrowany.

