server_silent_body=„%1$s” nigdy nie odpowiedział na żądanie połączenia. Najbardziej prawdopodobną przyczyną jest to, że działa starsza wersja aplikacji, która nie może komunikować się z tą – zaktualizuj aplikację na tym urządzeniu. W przeciwnym razie sprawdź, czy zapora sieciowa nie blokuje portu.
protocol_incompatible_title=Drugie urządzenie wymaga aktualizacji
protocol_incompatible_title_local=To urządzenie wymaga aktualizacji
protocol_incompatible_body=Obie aplikacje korzystają z niezgodnych wersji protokołu WFAS (to urządzenie: v%1$d, drugi koniec: v%2$d). Połączenie zostało zamknięte. Zaktualizuj, aby na obu urządzeniach działała najnowsza wersja.
protocol_incompatible_body_sender=Urządzenie, które transmituje, ma starszą wersję aplikacji (protokół WFAS v%2$d, to urządzenie używa v%1$d), więc połączenie zostało zamknięte. Zaktualizuj aplikację na urządzeniu nadawczym.
protocol_incompatible_body_receiver=Na odbierającym urządzeniu działa starsza wersja aplikacji (protokół WFAS v%2$d, to urządzenie używa v%1$d), więc połączenie zostało zamknięte. Zaktualizuj aplikację na urządzeniu odbiorczym.
protocol_incompatible_body_local=Na tym urządzeniu działa starsza wersja aplikacji (protokół WFAS v%1$d, drugie urządzenie używa v%2$d), więc połączenie zostało zamknięte. Zaktualizuj aplikację na tym urządzeniu.
