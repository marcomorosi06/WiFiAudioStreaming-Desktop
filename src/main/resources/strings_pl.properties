protocol_dlna_title=Renderery DLNA/UPnP
protocol_dlna_desc=Przesyłaj dźwięk do amplitunerów AV, listew dźwiękowych i telewizorów Smart TV — nie jest wymagana żadna aplikacja
dlna_port=Port multimedialny DLNA
dlna_port_hint=Port TCP, z którym moduł renderujący się ponownie łączy. Musi być osiągalny z modułu renderującego.
dlna_format_label=Format audio
dlna_format_auto=Automatyczny (do negocjacji)
dlna_format_auto_desc=Zapytaj każdego renderera, co obsługuje, i wybierz najlepsze dopasowanie. Zalecony.
dlna_format_lpcm_desc=Nieskompresowany 16-bitowy PCM, ~1,4 Mb/s. Najmniejsze opóźnienia, najszersza kompatybilność.
dlna_format_wav_desc=Nieskompresowany PCM w strumieniowym nagłówku WAV. Pomaga w przypadku starszego oprogramowania.
dlna_format_mp3_desc=Skompresowany, ~320 kb/s. Używaj, gdy sieć jest wolna lub Wi-Fi jest przeciążone.
dlna_format_adts_desc=Skompresowany plik AAC. Wydajne, ale obsługa modułu renderującego jest najmniej spójna.
