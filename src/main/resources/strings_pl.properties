capture_mic=Mikrofon
capture_system=Dźwięk systemowy
capture_both=Mikrofon i dźwięk systemowy
capture_source_loopback=wyjście systemowe (pętla zwrotna)
capture_peer_local_mix=zmieszany ze strumieniem
