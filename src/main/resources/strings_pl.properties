connection_sound_title=Dźwięk połączenia
connection_sound_desc=Odtwarzaj dźwięk, gdy klient łączy się z serwerem
custom_sound_title=Niestandardowy dźwięk połączenia
custom_sound_none=Nie wybrano pliku (używany jest domyślny sygnał dźwiękowy)
browse=Przeglądaj...
disconnection_sound_title=Dźwięk rozłączenia
disconnection_sound_desc=Odtwórz dźwięk, gdy klient rozłączy się z serwerem
native_engine_title=Natywny silnik audio
native_engine_desc=Użyj natywnego silnika audio C (zalecane). W systemie Linux: PulseAudio/PipeWire przez dlopen, automatycznie wycisza głośniki. Wyłącz możliwość powrotu do starszego grabbera FFmpeg.
mute_render_title=Wycisz głośniki podczas przesyłania strumieniowego
mute_render_desc=Wycisz odtwarzanie lokalne na czas przechwytywania przez serwer, aby dźwięk nie był odtwarzany dwukrotnie. Wyłącz tę opcję, aby nadal ją słyszeć zarówno tutaj, jak i na kliencie. Tylko silnik natywny; poprzedni stan zostaje przywrócony po zatrzymaniu serwera. CLI: --no-mute-render.
server_persist_title=Utrzymuj działanie serwera po rozłączeniu
server_persist_desc=W przypadku emisji pojedynczej opuszczenie klienta kończy sesję, a nie serwer: port pozostaje otwarty i czeka na następnego klienta. Multicast już działa w ten sposób.
mic_routing_title=Kierowanie mikrofonu przychodzącego
mic_routing_desc=Wybierz sposób obsługi strumienia mikrofonu otrzymanego od klienta
mic_routing_off=Wyłączone
mic_routing_off_desc=Ignoruj mikrofon klienta
mic_routing_virtual=Wirtualny mikrofon
mic_routing_virtual_desc=Udostępnij mikrofon innym aplikacjom (Discord, Zoom...) jako wirtualne urządzenie wejściowe
mic_routing_mix=Wmieszaj do strumienia
mic_routing_mix_desc=Połącz mikrofon ze strumieniem audio odsyłanym do klientów
mic_routing_linux_auto=Wirtualny zlew o nazwie „WFAS_VirtualMic” zostanie utworzony automatycznie przez pactl
mic_routing_vcable_detected=Wykryty kabel wirtualny: %s
mic_routing_vcable_missing=Nie wykryto kabla wirtualnego. Zainstaluj VB-CABLE (Windows) lub BlackHole/Loopback (macOS) lub wybierz urządzenie ręcznie
mic_routing_manual_device=Urządzenie wyjściowe dla mikrofonu
mic_routing_mix_info=Mikrofon zostanie zmiksowany bezpośrednio z wychodzącym strumieniem audio
mic_routing_unicast_only=Udostępnianie mikrofonu jest obsługiwane tylko w trybie emisji pojedynczej. Aby z niego skorzystać, wyłącz multicast/RTP.
mic_routing_virtual_unicast_only=Mikrofon wirtualny jest dostępny tylko w trybie emisji pojedynczej. Miksowanie w strumień nadal działa w trybie multiemisji.
mic_muted=Mikrofon wyciszony
mic_active=Mikrofon aktywny
mic_routing_mix_input_device=Urządzenie wejściowe mikrofonu

vcable_help_button=Potrzebujesz pomocy w skonfigurowaniu tego?
vcable_help_win_title=Windows — konfiguracja VB-CABLE
vcable_help_win_1=Przejdź do vb-audio.com/Cable i pobierz VB-CABLE.
vcable_help_win_2=Uruchom instalator jako Administrator, a następnie uruchom ponownie komputer.
vcable_help_win_3=Po ponownym uruchomieniu w menu rozwijanym powyżej pojawi się „Wejście kablowe” — wybierz je.
vcable_help_win_4=W Discord, Zoom lub dowolnej innej aplikacji przejdź do Ustawień audio i wybierz „Wyjście kablowe” jako mikrofon.
vcable_help_win_5=Gotowe! Przesyłany strumieniowo dźwięk będzie teraz wyświetlany jako mikrofon w tych aplikacjach.
vcable_help_win_link=Otwórz stronę vb-audio.com/Cable
vcable_help_linux_title=Linux — automatyczny wirtualny ujście
vcable_help_linux_1=Nie wymaga instalacji. Po rozpoczęciu przesyłania strumieniowego za pomocą pactl tworzony jest automatycznie wirtualny ujście o nazwie „WFAS_VirtualMic”.
vcable_help_linux_2=Otwórz pavucontrol (regulacja głośności PulseAudio) lub odpowiednik PipeWire.
vcable_help_linux_3=W zakładce „Nagranie” ustaw Discord/Zoom/etc. do przechwycenia z „WFAS_VirtualMic”.
vcable_help_linux_4=Przesyłany strumieniowo dźwięk będzie teraz wyświetlany w tych aplikacjach jako mikrofon.
vcable_help_linux_link=Zainstaluj pavucontrol
vcable_help_mac_title=macOS — konfiguracja BlackHole
vcable_help_mac_1=Pobierz BlackHole (bezpłatny, open source) z github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Zainstaluj go, postępując zgodnie z instrukcjami wyświetlanymi na ekranie. Nie ma potrzeby ponownego uruchamiania.
vcable_help_mac_3=Z powyższego menu rozwijanego wybierz „BlackHole 2ch” (lub 16ch).
vcable_help_mac_4=W Ustawieniach systemu → Dźwięk możesz opcjonalnie utworzyć urządzenie z wieloma wyjściami, aby odtwarzać dźwięk i jednocześnie go przesyłać.
vcable_help_mac_5=W Discord, Zoom lub dowolnej innej aplikacji wybierz „BlackHole 2ch” jako mikrofon.
vcable_help_mac_link=Otwórz BlackHole na GitHubie
start_minimized_tray=Rozpocznij zminimalizowanie do zasobnika
start_minimized_tray_desc=Uruchom aplikację ukrytą w zasobniku systemowym. W połączeniu z funkcją Uruchom przy uruchomieniu zachowuje się jak AirPlay/Chromecast: zawsze dostępny, nigdy nie przeszkadzający.
close_to_tray=Blisko Tray
close_to_tray_desc=Po zamknięciu okna zminimalizuj do zasobnika systemowego, zamiast wychodzić. Kliknij prawym przyciskiem myszy ikonę w zasobniku, aby zakończyć na dobre.
tray_show_window=Pokaż okno
tray_hide_window=Ukryj w zasobniku
tray_quit=Przestań
