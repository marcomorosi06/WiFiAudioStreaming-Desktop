auto_start_server_desc=Automatycznie uruchamiaj serwer po otwarciu aplikacji
auto_start_mode=Tryb automatycznego uruchamiania
auto_connect_client_title=Klient automatycznego uruchamiania
auto_connect_client_desc=Łączy się automatycznie z priorytetowymi adresami IP, jeśli są dostępne, co ~10 sekund (aby to działało, musisz być na stronie połączeń klientów)
