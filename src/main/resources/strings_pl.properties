welcome_privacy_title=Automatyczne sprawdzanie aktualizacji
welcome_privacy_desc=Przy każdym uruchomieniu aplikacja pyta GitHub, czy istnieje nowsza wersja.
welcome_privacy_detail=GitHub to amerykańska firma należąca do Microsoftu. Każde żądanie koniecznie ujawnia im Twój adres IP wraz z czasem żądania. Nic więcej nie jest wysyłane: żadne konto, żaden identyfikator, żadne dane dotyczące użytkowania. Wyłącz tę opcję, a aplikacja nigdy sama nie będzie łączyć się z siecią. Nadal możesz w dowolnej chwili sprawdzić to ręcznie w Ustawieniach.
