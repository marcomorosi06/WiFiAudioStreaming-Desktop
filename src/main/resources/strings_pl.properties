http_latency_warning=Uwaga: przeglądarki internetowe wymuszają wewnętrzne buforowanie strumieni HTTP, co nieuchronnie powoduje opóźnienie 1–3 sekund. Jest to normalne i nie można tego obejść.
linux_autostart_title=Konfiguracja automatycznego uruchamiania systemu Linux
