license_info_desc=Ten projekt jest objęty licencją na mocy Europejskiej Licencji Publicznej Unii Europejskiej v1.2. Cała własność intelektualna należy do Marco Morosiego. Licencja przyznaje Ci prawo do używania, studiowania, modyfikowania i redystrybucji oprogramowania, nawet w zmodyfikowanej formie, pod warunkiem zachowania tej samej licencji.
