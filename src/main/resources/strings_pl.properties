nr_hint=Tylko dla hałaśliwych nadawców analogowych, takich jak mikrokontroler próbkujący wyjście liniowe. W przypadku czystego dźwięku cyfrowego może jedynie dodawać artefakty. Nie używaj go, jeśli nadajnik już usuwa hałas ze swojej strony.
status_server_busy=Ten serwer już przesyła strumieniowo do innego urządzenia.

usb_section=Łącze USB
usb_mode=Przesyłaj strumieniowo przez USB
usb_mode_desc=Użyj kabla USB zamiast Wi-Fi. Włącz tethering przez USB na telefonie z Androidem, a aplikacja sama znajdzie łącze.
usb_latency=Bufor USB (ms)
usb_latency_desc=Bufor jitter używany zamiast audio, gdy łącze USB jest aktywne. Niższe oznacza mniejsze opóźnienia, ale większe ryzyko utraty połączenia. Niektóre urządzenia dostarczają pakiety USB seriami i potrzebują tutaj więcej buforu niż przez Wi-Fi, a nie mniej.
usb_diag_disabled=Tryb USB jest wyłączony.
usb_diag_ready=Aktywne łącze USB: %s (%s)
usb_diag_windows=Nie znaleziono łącza USB. Podłącz telefon i włącz na nim tethering przez USB.
usb_diag_linux=Nie znaleziono łącza USB. Podłącz telefon i włącz na nim tethering przez USB.
usb_diag_macos=Nie znaleziono łącza USB. macOS nie ma wbudowanego sterownika RNDIS, więc tethering przez USB w Androidzie zwykle tutaj nie działa; zamiast tego użyj Wi-Fi.
usb_diag_no_ip=Znaleziono adapter USB (%s), ale nie ma on adresu IP. Tethering przez USB prawdopodobnie jest nadal wyłączony na urządzeniu.
usb_interface=Interfejs USB
usb_interface_desc=Pozostaw opcję Auto, chyba że wykrywanie wybierze niewłaściwy adapter. Na liście znajdują się również adaptery bez adresu IP, dzięki czemu można odróżnić nieaktualny sterownik od aktualnego.
