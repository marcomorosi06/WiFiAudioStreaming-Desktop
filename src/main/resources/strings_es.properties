vcable_help_button=¿Necesitas ayuda para configurar esto?
vcable_help_win_title=Windows: configuración de VB-CABLE
vcable_help_win_1=Vaya a vb-audio.com/Cable y descargue VB-CABLE.
vcable_help_win_2=Ejecute el instalador como administrador, luego reinicie su PC.
vcable_help_win_3=Después de reiniciar, aparecerá "Entrada de CABLE" en el menú desplegable de arriba; selecciónelo.
vcable_help_win_4=En Discord, Zoom o cualquier otra aplicación, vaya a Configuración de audio y elija "Salida de CABLE" como micrófono.
vcable_help_win_5=¡Listo! El audio transmitido ahora aparecerá como su micrófono en esas aplicaciones.
vcable_help_win_link=Abra vb-audio.com/Cable
vcable_help_linux_title=Linux: sumidero virtual automático
vcable_help_linux_1=No se necesita instalación. Cuando comienza la transmisión, se crea automáticamente un receptor virtual llamado "WFAS_VirtualMic" a través de pactl.
vcable_help_linux_2=Abra pavucontrol (control de volumen de PulseAudio) o un equivalente de PipeWire.
vcable_help_linux_3=En la pestaña "Grabación", configure Discord/Zoom/etc. para capturar desde "WFAS_VirtualMic".
vcable_help_linux_4=El audio transmitido ahora aparecerá como un micrófono en esas aplicaciones.
vcable_help_linux_link=Instalar pavucontrol
vcable_help_mac_title=macOS: configuración de BlackHole
vcable_help_mac_1=Descargue BlackHole (gratis, de código abierto) desde github.com/ExistentialAudio/BlackHole.
vcable_help_mac_2=Instálalo siguiendo las instrucciones en pantalla. No es necesario reiniciar.
vcable_help_mac_3=Seleccione "BlackHole 2ch" (o 16ch) en el menú desplegable de arriba.
vcable_help_mac_4=En Configuración del sistema → Sonido, opcionalmente puede crear un dispositivo de salida múltiple para escuchar el audio y enrutarlo simultáneamente.
vcable_help_mac_5=En Discord, Zoom o cualquier otra aplicación, elige "BlackHole 2ch" como micrófono.
vcable_help_mac_link=Abra BlackHole en GitHub
